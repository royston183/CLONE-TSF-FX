<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MO: INR Head-Ups Reminder</title>
<style>
/* =========================================================
   Design system
   ========================================================= */
:root{
  --bg:#F4F8FC;
  --card:#FFFFFF;
  --text:#1D2D3E;
  --text-muted:#5C7085;
  --text-faint:#8CA0B3;
  --border:#E1E9F2;
  --border-strong:#CBD9E8;
  --primary:#1F6FEB;
  --primary-dark:#1657C4;
  --primary-light:#6FA8FF;
  --primary-tint:#EAF2FF;
  --success:#27AE60;
  --success-tint:#E8F8EF;
  --warning:#FF8A00;
  --warning-tint:#FFF3E4;
  --error:#E74C3C;
  --error-tint:#FDEAE8;
  --teal:#17BEBB;
  --teal-tint:#E7FAF9;
  --purple:#8E44AD;
  --purple-tint:#F5EAFA;
  --gray-tint:#EEF2F6;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(22,39,64,0.04), 0 4px 14px rgba(22,39,64,0.06);
  --shadow-pop:0 8px 28px rgba(22,39,64,0.16);
  --font:'Inter',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:12.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);}
input,select,textarea{font-family:var(--font);}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#C7D4E2;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   Layout
   ========================================================= */
.app{
  max-width:100%;
  margin:0;
  padding:0.3rem 0.2rem 0.5rem;
}

.table-col{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 210px);
}
.table-col > .card{
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  min-height:0;
  margin-bottom:0;
}
.table-col .table-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
}
@media (max-width:1080px){
  .table-col{
    max-height:none;
  }
  .table-col .table-scroll{max-height:520px;}
}

.page-actions-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px;
}

/* KPI cards */
.kpi-row{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.kpi-card{
  flex:1 1 180px;
  min-width:170px;
  background:var(--card);
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  min-height:64px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-left-color .18s ease;
}
.kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(22,39,64,0.08), 0 10px 22px rgba(22,39,64,0.09);
  border-left-color:var(--primary-dark);
}
.kpi-card .kpi-value{
  font-size:30px;
  font-weight:700;
  color:var(--primary-dark);
  line-height:1.15;
}
.kpi-card .kpi-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
}

.create-card{border-left-color:var(--primary);}
.create-card .create-icon-circle{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  font-weight:700;
  line-height:1;
  transition:background .18s ease, transform .18s ease;
}
.create-card .kpi-label{color:var(--text);font-weight:700;font-size:13px;}
.create-card:hover .create-icon-circle{
  background:var(--primary-dark);
  transform:scale(1.08);
}
.create-card:hover{border-left-color:var(--primary-dark);}

/* Header */
.page-header{
  margin-bottom:12px;
  background:#EAF3FF;
  border:1px solid #D7E9FF;
  border-radius:var(--radius-md);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}
.page-header .logo-img{
  height:40px;
  width:auto;
  max-width:120px;
  object-fit:contain;
  flex:none;
}
.page-header .logo-placeholder{
  height:36px;
  width:36px;
  flex:none;
  border-radius:8px;
  border:1px dashed var(--border-strong);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--text-faint);
}
.page-header .header-text{display:flex;flex-direction:column;}

/* Compact form rows with variable-width fields */
.form-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  margin-bottom:12px;
}
.form-row:last-child{margin-bottom:0;}
.form-row > .field{flex:1 1 160px;min-width:0;}
.field.w-sm{flex:0 1 100px;}
.field.w-sm-md{flex:0 1 124px;}
.field.w-md{flex:0 1 154px;}
.field.w-md-wide{flex:0 1 184px;}
.field.w-wide{flex:1 1 190px;min-width:165px;}
.field.w-date{flex:0 0 156px;min-width:156px;}
.form-row.no-wrap{flex-wrap:nowrap;}
.form-row.no-wrap > .field{min-width:0;}
.field.fx-field{flex:1 1 0;min-width:130px;}

/* 12-column responsive grid for the Create Master Contract modal.
   Each field gets a span sized to what its value actually needs,
   rather than forcing every field to equal width. */
.form-grid-12{
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:10px 12px;
  margin-bottom:14px;
}
.form-grid-12:last-child{margin-bottom:0;}
.form-grid-12 > .field{min-width:0;}
.gc-3{grid-column:span 3;}
.gc-4{grid-column:span 4;}
.gc-5{grid-column:span 5;}
.gc-6{grid-column:span 6;}
.gc-7{grid-column:span 7;}
@media (max-width:700px){
  .form-grid-12{grid-template-columns:repeat(6, 1fr);}
  .gc-3{grid-column:span 3;}
  .gc-4{grid-column:span 3;}
  .gc-5{grid-column:span 6;}
  .gc-6{grid-column:span 6;}
  .gc-7{grid-column:span 6;}
}
@media (max-width:460px){
  .form-grid-12{grid-template-columns:1fr;}
  .gc-3, .gc-4, .gc-5, .gc-6, .gc-7{grid-column:span 1;}
}
.page-header h1{
  font-size:19px;
  font-weight:700;
  margin:0 0 3px;
  letter-spacing:-0.2px;
}
.page-header p{
  margin:0;
  color:var(--text-muted);
  font-size:12.5px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  margin-bottom:12px;
  overflow:visible;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:700;
  color:var(--primary-dark);
  letter-spacing:0.3px;
}
.section-title .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;
}
.section-body{
  padding:12px 16px 14px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px 14px;
}
.form-grid.cols-1{grid-template-columns:1fr;}
.form-grid.cols-2{grid-template-columns:repeat(2,1fr);}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.field label{
  font-size:11.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  line-height:1.2;
}
.field label .req{color:var(--error);margin-left:2px;}
.field .hint{font-size:11px;color:var(--text-faint);}
.field .error-msg{
  font-size:11px;
  color:var(--error);
  display:none;
  margin-top:-2px;
}
.field.has-error .error-msg{display:block;}
.field.has-error input,
.field.has-error .select-display,
.field.has-error .dd-input{
  border-color:var(--error) !important;
  background:var(--error-tint);
}

.control{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 11px;
  font-size:12.5px;
  color:var(--text);
  background:#fff;
  width:100%;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.control::placeholder{color:var(--text-faint);}
.control:hover{border-color:#AFC2D8;}
.control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-tint);
}
.control[readonly]{
  background:var(--gray-tint);
  color:var(--text-muted);
  cursor:default;
}
.control:disabled{
  background:var(--gray-tint);
  color:var(--text-faint);
  cursor:not-allowed;
}

.input-with-suffix{
  position:relative;
  display:flex;
  align-items:center;
}
.input-with-suffix .control{padding-right:58px;}
.input-with-suffix .suffix{
  position:absolute;
  right:8px;
  font-size:11px;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-tint);
  padding:3px 7px;
  border-radius:6px;
  pointer-events:none;
  white-space:nowrap;
}

/* Searchable dropdown */
.dd{position:relative;}
.dd-input{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 32px 0 11px;
  font-size:12.5px;
  width:100%;
  outline:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%235C7085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
  cursor:pointer;
  transition:border-color .15s, box-shadow .15s;
}
.dd-input::placeholder{color:var(--text-faint);}
.dd-input:hover{border-color:#AFC2D8;}
.dd-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.dd.disabled .dd-input{background-color:var(--gray-tint);color:var(--text-faint);cursor:not-allowed;}

.dd-panel{
  position:absolute;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  min-width:200px;
  max-height:240px;
  overflow-y:auto;
  z-index:210;
  display:none;
  padding:6px;
}
.dd.open .dd-panel{display:block;}
.dd-item{
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.dd-item:hover, .dd-item.active{background:var(--primary-tint);}
.dd-item .primary-line{font-weight:600;font-size:12.5px;color:var(--text);}
.dd-item .secondary-line{font-size:11px;color:var(--text-muted);}
.dd-empty{padding:14px 10px;text-align:center;color:var(--text-faint);font-size:11.5px;}

/* Date field */
.date-field{position:relative;}
.date-field .control{padding-right:34px;}
.date-icon{
  position:absolute;
  right:6px;top:50%;
  transform:translateY(-50%);
  width:24px;height:24px;
  border:none;background:transparent;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--text-muted);
  font-size:13px;
}
.date-icon:hover{background:var(--primary-tint);color:var(--primary);}
.date-popup{
  position:absolute;
  width:250px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  z-index:210;
  padding:10px;
  display:none;
}
.date-popup.open{display:block;}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.cal-head button{
  width:24px;height:24px;border:none;background:var(--gray-tint);
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);
}
.cal-head button:hover{background:var(--primary-tint);color:var(--primary);}
.cal-head .cal-title{font-weight:700;font-size:12px;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal-grid .dow{
  text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding:4px 0;
}
.cal-grid .day{
  text-align:center;
  font-size:11.5px;
  padding:6px 0;
  border-radius:6px;
  cursor:pointer;
  color:var(--text);
}
.cal-grid .day:hover{background:var(--primary-tint);}
.cal-grid .day.muted{color:var(--text-faint);}
.cal-grid .day.selected{background:var(--primary);color:#fff;font-weight:700;}
.cal-grid .day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--primary-light);}

/* Buttons */
.btn{
  height:32px;
  padding:0 16px;
  border-radius:var(--radius-sm);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, box-shadow .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(31,111,235,0.25);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 1px 4px rgba(22,39,64,0.08);}
.btn-danger{background:#fff;color:var(--error);border-color:#F3C6C0;}
.btn-danger:hover{background:var(--error-tint);}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:0 6px;height:auto;}
.btn-ghost:hover{text-decoration:underline;}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px;}

.actions-row{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:12px 16px;
}

/* Success banner */
.success-banner{
  display:none;
  align-items:center;
  gap:10px;
  margin:0 0 12px;
  padding:9px 14px;
  background:var(--success-tint);
  border:1px solid #BFE8D0;
  border-radius:var(--radius-md);
  color:#1E7A46;
  font-size:12px;
}
.success-banner.show{display:flex;}
.success-banner b{font-weight:700;}
.success-banner .spacer{flex:1;}

/* =========================================================
   Master Contracts table section
   ========================================================= */
.table-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 16px 10px;
  flex-wrap:wrap;
  flex:0 0 auto;
}
.search-box{
  position:relative;
  flex:1 1 260px;
  min-width:200px;
}
.search-box input{
  height:32px;
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 12px 0 30px;
  font-size:12.5px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-box .icon{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-faint);font-size:13px;
}
.toolbar-spacer{flex:1 0 8px;}
.result-count{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}

.filter-select{
  flex:0 1 122px;
  min-width:88px;
  height:32px;
  cursor:pointer;
}

.table-scroll{
  overflow-x:auto;
}
table.mc-table{
  width:100%;
  border-collapse:collapse;
  min-width:1060px;
}
table.mc-table thead th{
  position:sticky;top:0;
  background:#F7FAFD;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color:var(--text-muted);
  font-weight:700;
  padding:10px 14px;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  z-index:5;
}
table.mc-table thead th:hover{color:var(--primary-dark);}
table.mc-table thead th.no-sort{cursor:default;}
table.mc-table thead th.no-sort:hover{color:var(--text-muted);}
table.mc-table thead th.action-col, table.mc-table td.action-col{
  width:40px;
  text-align:center;
  padding-left:10px;
  padding-right:10px;
}
.row-select-checkbox{
  width:14px;height:14px;
  accent-color:var(--primary);
  cursor:pointer;
  vertical-align:middle;
}
table.mc-table thead th .sort-ind{
  display:inline-block;
  margin-left:4px;
  font-size:9px;
  color:var(--text-faint);
}
table.mc-table thead th.sorted .sort-ind{color:var(--primary);}
table.mc-table thead th.num,
table.mc-table td.num{text-align:right;}
table.mc-table tbody td{
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  white-space:nowrap;
}
table.mc-table tbody tr{cursor:pointer;transition:background .18s ease;}
table.mc-table tbody tr:hover{background:#F7FAFD;}
table.mc-table tbody tr:hover .mc-link{color:var(--primary);}
table.mc-table tbody tr.selected{background:var(--primary-tint);}
table.mc-table tbody tr.row-new{animation:flashNew 1.8s ease-out;}
@keyframes flashNew{
  0%{background:#DFF3E6;}
  100%{background:transparent;}
}
.mc-link{color:var(--primary-dark);font-weight:700;cursor:pointer;transition:color .15s ease;}
.mc-link:hover{text-decoration:underline;color:var(--primary);}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.status-pill .status-dot{width:6px;height:6px;border-radius:50%;}
.status-in-use{background:var(--success-tint);color:#1E7A46;}
.status-in-use .status-dot{background:var(--success);}
.status-confirmed{background:var(--primary-tint);color:var(--primary-dark);}
.status-confirmed .status-dot{background:var(--primary);}
.status-draft{background:var(--gray-tint);color:var(--text-muted);}
.status-draft .status-dot{background:var(--text-faint);}
.status-pending{background:var(--warning-tint);color:#9A5300;}
.status-pending .status-dot{background:var(--warning);}
.status-rejected{background:var(--error-tint);color:#B4362A;}
.status-rejected .status-dot{background:var(--error);}
.status-settled{background:var(--teal-tint);color:#0E8785;}
.status-settled .status-dot{background:var(--teal);}
.status-matured{background:var(--purple-tint);color:#6C3488;}
.status-matured .status-dot{background:var(--purple);}

/* Plain-text status presentation (Master Contracts table) */
.status-text{font-weight:600;font-size:12px;white-space:nowrap;}
.status-text-in-use{color:var(--success);}
.status-text-confirmed{color:var(--primary);}
.status-text-draft{color:var(--text-muted);}
.status-text-pending{color:var(--warning);}
.status-text-rejected{color:var(--error);}
.status-text-settled{color:var(--teal);}
.status-text-matured{color:var(--purple);}

.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.empty-state .big{font-size:28px;margin-bottom:6px;}

.table-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  flex-wrap:wrap;
  gap:10px;
  flex:0 0 auto;
  border-top:1px solid var(--border);
}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.page-size-select select{height:28px;border:1px solid var(--border-strong);border-radius:6px;font-size:11.5px;padding:0 6px;}

.pagination{display:flex;align-items:center;gap:4px;}
.pagination button{
  min-width:28px;height:28px;
  border:1px solid var(--border-strong);
  background:#fff;
  border-radius:6px;
  font-size:11.5px;
  cursor:pointer;
  color:var(--text);
  transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}

/* =========================================================
   OTTK visual theme — CSS-ONLY override block.
   This block is appended last so its rules win the cascade

:root{

body{ font-size:13px; }

var ABAP = {
  SUB_FX1:'FX1', SUB_FX2:'FX2',
  EXT_PRODUCT_NDF:'12D',               /* c_11d (value changed from 11 to 12 on 08.11.2024) */
  LEG_TYPE:'D1',
  MAIL_STATUSES:['05','07'],           /* c_05, c_07 */
  MODEL_EXT_BASE:['M030','M034'],      /* gc_mod30, gc_mod34 */
  MODEL_EXT_BY_CURR:{ C001:'01', C003:'02' }
};

/* =========================================================
   2. LOOKUP HELPERS (shared lookup datasets)
   ========================================================= */
function findEntity(code){ return appData.entities.filter(function(e){ return e.code===code; })[0]; }
function findRegion(id){ return appData.regions.filter(function(r){ return r.id===id; })[0]; }
function findStatus(code){ return appData.statuses.filter(function(s){ return s.code===code; })[0]; }
function findMcByRef(ref){ return appData.masterContracts.filter(function(m){ return m.ref===ref; })[0]; }
function findDeal(id){ return appData.deals.filter(function(d){ return d.dealId===id; })[0]; }
function modelRule(id){ return appData.models.filter(function(m){ return m.id===id; })[0]; }

/* =========================================================
   3. DATE / NUMBER FORMATTING
   ========================================================= */
function pad2(n){ return (n<10 ? '0' : '') + n; }
function isoToDMY(iso){
  if(!iso) return '';
  var p = iso.split('-');
  return p[2]+'-'+p[1]+'-'+p[0];
}
function dateToISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function formatDMY(d){ return pad2(d.getDate())+'-'+pad2(d.getMonth()+1)+'-'+d.getFullYear(); }
/* Accepts dd-mm-yyyy (also dd/mm/yyyy, dd.mm.yyyy); returns a Date or null */
function parseDMY(str){
  if(!str) return null;
  var m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(String(str).trim());
  if(!m) return null;
  var d = parseInt(m[1],10), mo = parseInt(m[2],10)-1, y = parseInt(m[3],10);
  var dt = new Date(y, mo, d);
  if(dt.getDate()!==d || dt.getMonth()!==mo || dt.getFullYear()!==y) return null;
  return dt;
}
function addDaysISO(iso, n){
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)+n);
  return dateToISO(d);
}
function formatAmount(n){
  return Number(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function formatRate(n){
  return Number(n).toLocaleString('en-US', { minimumFractionDigits:6, maximumFractionDigits:6 });
}
function compactAmount(n){
  if(n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return String(n);
}
function trimMillions(n){ return String(parseFloat((n/1e6).toFixed(6))); }
function escapeHtml(s){
  return String(s===undefined || s===null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

/* =========================================================
   4. BUSINESS LOGIC (pure functions, no DOM)
   ========================================================= */
/* "Model extension" (SUB_GET_DATA): M030 / M034 get a currency suffix after the CO-area lookup */
function extendModelId(modelId, currId){
  if(ABAP.MODEL_EXT_BASE.indexOf(modelId) !== -1 && ABAP.MODEL_EXT_BY_CURR[currId]){
    return modelId + ABAP.MODEL_EXT_BY_CURR[currId];
  }
  return modelId;
}

/* FX / option utilisation amount: absolute USD-side amount of the deal's legs.
   NOTE: the ABAP loops FROM the first D1 row to the end of the table without leaving on a
   deal change; the intended per-deal total is implemented here (see assumptions). */
function legUsdAmount(leg){
  if(leg.curr1 === 'USD') return Math.abs(leg.amt1);
  if(leg.curr2 === 'USD') return Math.abs(leg.amt2);
  return 0;
}
function calculateUtilisation(dealId){
  var total = 0;
  [appData.fxLegs, appData.optLegs].forEach(function(legs){
    var mine = legs.filter(function(l){ return l.dealId === dealId; });
    var hasD1 = mine.some(function(l){ return l.type === ABAP.LEG_TYPE; });
    if(hasD1){ mine.forEach(function(l){ total += legUsdAmount(l); }); }
  });
  return Math.round(total*100)/100;
}

/* Mail plan of SEND_EMAIL: status 05/07, model sub type FX1 -> FX mails (indicator on full
   model id); FX2 -> option mails (indicator on first 4 chars of model id). */
function mailPlanForRow(row){
  if(ABAP.MAIL_STATUSES.indexOf(row.status) === -1) return [];
  var rule = modelRule(row.modelId.substring(0,4));
  if(!rule) return [];
  if(rule.subType === ABAP.SUB_FX1){
    var full = modelRule(row.modelId);                       /* indicator keyed on the full id */
    if(full && full.headFx) return ['Heads Up FX','Heads Up FX for DMCC'];
  } else if(rule.subType === ABAP.SUB_FX2){
    if(rule.headOpt) return ['Heads Up Option','Heads Up Option for DMCC'];
  }
  return [];
}
function buildMailPlan(rows){
  var deals = [], mails = 0;
  rows.forEach(function(r){
    var m = mailPlanForRow(r);
    if(m.length){ deals.push({ dealId:r.dealId, mails:m }); mails += m.length; }
  });
  return { deals:deals, mailCount:mails };
}

/* =========================================================
   5. MOCK TABLE BUILDER (deterministic)
   ========================================================= */
function buildMockTables(){
  var users = ['RMENON','SKAPOOR','APATEL','NIYER'];
  appData.masterContracts.forEach(function(mc){
    mc.ref = 'MC/'+mc.origin+'/2026/'+mc.no;
  });
  appData.deals = []; appData.fxLegs = []; appData.optLegs = []; appData.spotDealIds = {};

  appData.dealSeeds.forEach(function(s, i){
    var mc = appData.masterContracts.filter(function(m){ return m.no===s[0]; })[0];
    var rule = modelRule(mc.modelId);
    var entity = findEntity(mc.origin);
    var dealId = String(1000004101 + i);
    var usd = s[5];
    var settledStage = ['06','07','08'].indexOf(s[3]) !== -1;
    var plAmt = settledStage ? Math.round(usd*0.0125*(i%2 ? -1 : 1)*100)/100 : 0;

    appData.deals.push({
      dealId: dealId, dealType: ABAP.LEG_TYPE, subType: rule.subType,
      dealDesc: mc.origin+' '+rule.desc+' USD '+compactAmount(usd),
      startDate: s[1], maturityDate: s[2], mcRef: mc.ref, status: s[3], confirmed: !!s[4],
      plAmt: plAmt, plCurr: settledStage ? 'USD' : '', plRate: settledStage ? entity.fxRate+0.4 : 0,
      currId: mc.currId,
      createdBy: users[i%4], createdDate: s[1], createdTime: pad2(8+(i%9))+':'+pad2((i*7)%60)+':'+pad2((i*13)%60),
      changedBy: users[(i+1)%4], changedDate: addDaysISO(s[1], (i%5)+1), changedTime: pad2(9+(i%8))+':'+pad2((i*11)%60)+':'+pad2((i*17)%60)
    });

    if(rule.subType === ABAP.SUB_FX1){
      var ndf = (mc.modelId === 'M032' || mc.modelId === 'M037');
      appData.fxLegs.push({
        dealId: dealId, type: ABAP.LEG_TYPE, curr1:'USD', curr2: entity.currency,
        amt1: usd, amt2: -Math.round(usd*entity.fxRate*100)/100,
        sgsart: ndf ? ABAP.EXT_PRODUCT_NDF : '11D',
        bp: ndf ? appData.banks[i % appData.banks.length] : '',
        ndfDate: ndf ? addDaysISO(s[2], -2) : ''
      });
    } else {
      /* staggered / put & call options: two legs, alternating which side holds USD */
      var half = Math.round(usd/2*100)/100;
      appData.optLegs.push({ dealId:dealId, type:ABAP.LEG_TYPE, curr1:'INR', curr2:'USD',
        amt1: Math.round(half*entity.fxRate*100)/100, amt2: -half });
      appData.optLegs.push({ dealId:dealId, type:ABAP.LEG_TYPE, curr1:'USD', curr2:'INR',
        amt1: usd-half, amt2: -Math.round((usd-half)*entity.fxRate*100)/100 });
    }
    if(settledStage){ appData.spotDealIds[dealId] = true; }
  });
}

var HeadsUpService = {
  /* SUB_GET_DATA + DATA_FILTER */
  fetchDeals: function(p){
    if(p.coArea && appData.currentUser.authorizedCoAreas.indexOf(p.coArea) === -1){
      return { error:'You are not authorized to execute for the CO Area '+p.coArea, rows:[] };
    }
    var rows = appData.deals.filter(function(d){
      if(!d.mcRef) return false;
      if(p.dealId && d.dealId !== p.dealId) return false;
      var mc = findMcByRef(d.mcRef);
      var entity = findEntity(mc.origin);
      if(p.keyDate && d.maturityDate !== p.keyDate) return false;      /* ze_date <> p_date  -> deleted */
      if(p.status && d.status !== p.status) return false;
      if(p.region && entity.regionId !== p.region) return false;
      if(p.entity && mc.origin !== p.entity) return false;
      return true;
    }).map(function(d){ return HeadsUpService.buildRow(d, p.coArea); });
    return { error:null, rows:rows };
  },

  buildRow: function(d, coArea){
    var mc = findMcByRef(d.mcRef);
    var entity = findEntity(mc.origin);
    var status = findStatus(d.status);
    var baseRule = modelRule(mc.modelId);

    var ndfLeg = appData.fxLegs.filter(function(l){ return l.dealId===d.dealId && l.sgsart===ABAP.EXT_PRODUCT_NDF; })[0];

      dealId:d.dealId, dealType:d.dealType, subType:d.subType, dealDesc:d.dealDesc,
      startDate:d.startDate, maturityDate:d.maturityDate, mcRef:d.mcRef,
      status:d.status, statusDesc: status ? status.sdesc : '',
      origin:mc.origin, region:entity.regionId,
      modelId: extendModelId(mc.modelId, d.currId), modelDesc: baseRule.desc,
      coArea: coRule ? coRule.coArea : '', coModelDesc: coRule ? coRule.desc : '',
      mcDesc: mc.origin+'_'+mc.commodity+'_'+mc.modelId+'_'+trimMillions(mc.amt)+'M',
      mcDate:mc.date, mcAmt:mc.amt, utiAmt:calculateUtilisation(d.dealId),
      dealCurrId:d.currId, confirmed:d.confirmed,
      plAmt:d.plAmt, plCurr:d.plCurr, plRate:d.plRate,
      ndfDate: ndfLeg ? ndfLeg.ndfDate : '', bank: ndfLeg ? ndfLeg.bp : '',

      ref:mc.ref, origin:mc.origin, originName:entity.name, region:entity.regionId,
      modelId:mc.modelId, modelDesc:rule.desc, currId:mc.currId,

/* =========================================================
   9. CELL FORMATTING / SEARCH / SORT
   ========================================================= */
function cellText(col, row){
  var v = row[col.key];
  switch(col.type){
    case 'date': return isoToDMY(v);
    case 'amt':  return (v===null || v===undefined || v==='') ? '' : formatAmount(v);
    case 'rate': return (v===null || v===undefined || v==='') ? '' : formatRate(v);
    case 'flag': return v ? 'X' : '';
    default:     return v===undefined || v===null ? '' : String(v);
  }
}
function sortValue(col, row){
  var v = row[col.key];
  if(col.type==='amt' || col.type==='rate') return Number(v)||0;
  if(col.type==='flag') return v ? 1 : 0;
  return String(v===undefined || v===null ? '' : v).toLowerCase();
}
function getFilteredSorted(){
  var cols = visibleColumns();
  var q = state.search.trim().toLowerCase();
  var list = state.rows.filter(function(r){
    if(!q) return true;
    return cols.some(function(c){ return cellText(c, r).toLowerCase().indexOf(q) !== -1; });
  });
  var col = columnByKey(state.sort.field);
  if(col){
    var dir = state.sort.dir==='asc' ? 1 : -1;
    list = list.slice().sort(function(a,b){
      var x = sortValue(col,a), y = sortValue(col,b);
      if(x<y) return -1*dir;
      if(x>y) return 1*dir;
      return a.dealId < b.dealId ? -1 : 1;
    });
  }
  return list;
}

   ========================================================= */
function statusToneClass(code){
  var s = findStatus(code);
  return 'status-text status-text-' + (s ? s.tone : 'draft');
}

function renderCell(col, row){
  var cls = [];
  if(col.num) cls.push('num');
  if(col.type==='date' || col.type==='amt' || col.type==='rate') cls.push('mono');
  if(col.color) cls.push('cell-'+col.color);
  if(col.sticky) cls.push('sticky-col');
  var inner;
  var text = escapeHtml(cellText(col,row));
  if(col.type==='deal'){
    inner = '<span class="mc-link deal-link mono" data-link="deal" title="Open invoice for this deal">'+text+'</span>';
  } else if(col.type==='mc'){
    inner = '<span class="mc-link mono" data-link="mc" title="Open master contract details">'+text+'</span>';
  } else if(col.type==='status'){
    inner = '<span class="'+statusToneClass(row.status)+'">'+text+'</span>';
  } else if(col.type==='flag'){
    inner = '<span class="chk-ro'+(row[col.key]?' on':'')+'" role="img" aria-label="'+(row[col.key]?'Yes':'No')+'">'+(row[col.key]?'&#10003;':'')+'</span>';
    cls.push('text-center');
  } else {
    inner = text;
  }
  return '<td class="'+cls.join(' ')+'">'+inner+'</td>';
}

function renderHead(){
  var html = '<tr><th class="no-sort action-col pin-check" aria-label="Select"></th>';
  visibleColumns().forEach(function(c){
    var cls = [];
    if(c.num) cls.push('num');
    if(c.sticky) cls.push('sticky-col');
    if(state.sort.field===c.key) cls.push('sorted');
    var ind = state.sort.field===c.key ? (state.sort.dir==='asc' ? '&#9650;' : '&#9660;') : '';
    html += '<th class="'+cls.join(' ')+'" data-sort="'+c.key+'">'+escapeHtml(c.label)+'<span class="sort-ind">'+ind+'</span></th>';
  });
  document.getElementById('tableHead').innerHTML = html + '</tr>';
}

function renderTable(){
  renderHead();
  var list = getFilteredSorted();
  var total = list.length;
  var pageCount = Math.max(1, Math.ceil(total/state.pageSize));
  if(state.page > pageCount) state.page = pageCount;
  var start = (state.page-1)*state.pageSize;
  var pageRows = list.slice(start, start+state.pageSize);
  var cols = visibleColumns();

  var body = '';
  pageRows.forEach(function(r){
    var sel = state.selectedDealId === r.dealId;
    body += '<tr data-id="'+r.dealId+'"'+(sel ? ' class="selected"' : '')+'>'+
      '<td class="action-col pin-check"><input type="checkbox" class="row-select-checkbox" aria-label="Select deal '+r.dealId+'"'+(sel?' checked':'')+'></td>'+
      cols.map(function(c){ return renderCell(c, r); }).join('')+'</tr>';
  });
  document.getElementById('tableBody').innerHTML = body;

  var hasError = !!state.error;
  document.getElementById('dealTable').style.display = total===0 ? 'none' : 'table';
  document.getElementById('emptyState').style.display = (total===0 && !hasError) ? 'block' : 'none';
  document.getElementById('emptyText').textContent = 'No Data Found';

  var banner = document.getElementById('authBanner');
  banner.classList.toggle('show', hasError);
  document.getElementById('authBannerText').textContent = hasError ? state.error : '';

  document.getElementById('resultCount').textContent = total===0
    ? '0 deals'
    : (start+1)+'\u2013'+Math.min(start+state.pageSize, total)+' of '+total+(total===1 ? ' deal' : ' deals');

  renderPagination(pageCount);
  updateActionStates();
}

function renderPagination(pageCount){
  var el = document.getElementById('pagination');
  el.innerHTML = '';
  function btn(label, disabled, active, onClick, aria){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if(aria) b.setAttribute('aria-label', aria);
    b.disabled = disabled;
    if(active) b.classList.add('active');
    b.addEventListener('click', onClick);
    el.appendChild(b);
  }
  btn('\u2039', state.page<=1, false, function(){ state.page--; renderTable(); }, 'Previous page');
  for(var p=1; p<=pageCount; p++){
    (function(p){ btn(String(p), false, p===state.page, function(){ state.page = p; renderTable(); }, 'Page '+p); })(p);
  }
  btn('\u203A', state.page>=pageCount, false, function(){ state.page++; renderTable(); }, 'Next page');
}

function renderKeyDateInfo(){
  document.getElementById('keyDateInfo').textContent = state.filters.keyDate ? isoToDMY(state.filters.keyDate) : '\u2014';
}

function updateActionStates(){
  var plan = buildMailPlan(state.rows);
  var btn = document.getElementById('btnSendMail');
  var can = !state.error && plan.deals.length > 0;
  btn.disabled = !can;
  btn.title = can
    ? 'Send heads-up mail for the deals matching the selection'
    : (state.error ? 'Not available without CO Area authorization'
                   : 'No deal with status 05 / 07 and a heads-up indicator in the selection');
  document.getElementById('btnExport').disabled = getFilteredSorted().length === 0;
}

/* Re-run the SAP "selection" (Key Date, Region, Origin, Deal ID, Status, CO Area) and redraw */
function reloadData(){
  var res = HeadsUpService.fetchDeals(state.filters);
  state.rows = res.rows;
  state.error = res.error;
  if(state.selectedDealId && !state.rows.some(function(r){ return r.dealId===state.selectedDealId; })){
    state.selectedDealId = null;
  }
  state.page = 1;
  renderKeyDateInfo();
  renderTable();
}

/* =========================================================
   11. FLOATING PANEL POSITIONING / DROPDOWN / DATE PICKER
   ========================================================= */
function positionFloatingPanel(triggerEl, panelEl, opts){
  opts = opts || {};
  var margin = 8, gap = opts.gap===undefined ? 6 : opts.gap;
  var t = triggerEl.getBoundingClientRect();
  var boundsEl = triggerEl.closest('.modal');
  var b = boundsEl ? boundsEl.getBoundingClientRect() : { left:0, right:window.innerWidth, top:0, bottom:window.innerHeight };
  if(opts.matchWidth){ panelEl.style.width = Math.max(t.width, 200) + 'px'; }
  var p = panelEl.getBoundingClientRect();
  var minL = b.left+margin, maxL = b.right-margin-p.width;
  var left = opts.alignRight ? (t.right - p.width) : t.left;
  if(maxL < minL){ left = minL; } else { left = Math.min(Math.max(left, minL), maxL); }
  var top = t.bottom + gap;
  if(top + p.height > b.bottom - margin){
    var above = t.top - gap - p.height;
    top = above >= b.top + margin ? above : Math.max(b.top+margin, b.bottom-margin-p.height);
  }
  panelEl.style.position = 'fixed';
  panelEl.style.left = left+'px';
  panelEl.style.top = top+'px';
  panelEl.style.right = 'auto';
  panelEl.style.bottom = 'auto';
}

/* Searchable dropdown — opens on click anywhere in the field */
function initDropdown(cfg){
  var wrap = document.getElementById('dd-'+cfg.key);
  var input = document.getElementById('input-'+cfg.key);
  var hidden = document.getElementById('value-'+cfg.key);
  var panel = document.getElementById('panel-'+cfg.key);

  function renderPanel(filterText){
    var ft = (filterText||'').toLowerCase();
    var items = cfg.items().filter(function(it){ return cfg.searchText(it).toLowerCase().indexOf(ft) !== -1; });
    panel.innerHTML = '';
    if(!items.length){
      panel.innerHTML = '<div class="dd-empty">No matches found</div>';
      return;
    }
    items.forEach(function(it){
      var el = document.createElement('div');
      el.className = 'dd-item';
      el.innerHTML = '<span class="primary-line">'+escapeHtml(cfg.primaryText(it))+'</span>'+
        (cfg.secondaryText ? '<span class="secondary-line">'+escapeHtml(cfg.secondaryText(it))+'</span>' : '');
      el.addEventListener('mousedown', function(e){ e.preventDefault(); });
      el.addEventListener('click', function(){ select(it); });
      panel.appendChild(el);
    });
  }
  function select(it){
    input.value = cfg.displayText(it);
    hidden.value = cfg.valueOf(it);
    wrap.classList.remove('open');
    cfg.onChange(hidden.value);
  }
  function open(filterText){
    renderPanel(filterText||'');
    wrap.classList.add('open');
    positionFloatingPanel(wrap, panel, { matchWidth:true, gap:4 });
  }
  input.addEventListener('focus', function(){ open(''); });
  input.addEventListener('click', function(){ open(input.value && hidden.value ? '' : input.value); });
  input.addEventListener('input', function(){
    if(hidden.value){ hidden.value = ''; cfg.onChange(''); }
    open(input.value);
  });
  input.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ wrap.classList.remove('open'); input.blur(); }
  });
  document.addEventListener('click', function(e){
    if(!wrap.contains(e.target)){
      wrap.classList.remove('open');
      if(!hidden.value){ input.value = ''; }
    }
  });
  document.addEventListener('scroll', function(e){
    if(wrap.classList.contains('open') && !panel.contains(e.target)) wrap.classList.remove('open');
  }, true);
  window.addEventListener('resize', function(){
    if(wrap.classList.contains('open')) positionFloatingPanel(wrap, panel, { matchWidth:true, gap:4 });
  });
  return { clear:function(){ input.value=''; hidden.value=''; wrap.classList.remove('open'); } };
}

/* Inline calendar. viewDate is initialised ONLY when the popup opens, never on re-render,
   so month / year navigation keeps working on populated fields. */
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function initDatePicker(fieldKey, onCommit){
  var input = document.getElementById('input-'+fieldKey);
  var btn = document.querySelector('.date-icon[data-target="'+fieldKey+'"]');
  var popup = document.getElementById('popup-'+fieldKey);
  var wrap = input.closest('.date-field');
  var field = document.getElementById('field-'+fieldKey);
  var viewDate = new Date();

  function setError(show){ field.classList.toggle('has-error', !!show); }

  function render(){
    var selected = parseDMY(input.value);
    var year = viewDate.getFullYear(), month = viewDate.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var dim = new Date(year, month+1, 0).getDate();
    var prevDim = new Date(year, month, 0).getDate();
    var today = new Date();
    var y0 = Math.min(2020, year), y1 = Math.max(2035, year);

    var html = '<div class="cal-head"><button type="button" data-nav="-1" aria-label="Previous month">\u2039</button>'+
      '<span class="cal-selects"><select class="cal-sel" data-role="month" aria-label="Month">';
    for(var m=0;m<12;m++){ html += '<option value="'+m+'"'+(m===month?' selected':'')+'>'+MONTH_NAMES[m]+'</option>'; }
    html += '</select><select class="cal-sel" data-role="year" aria-label="Year">';
    for(var y=y0;y<=y1;y++){ html += '<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'</option>'; }
    html += '</select></span><button type="button" data-nav="1" aria-label="Next month">\u203A</button></div><div class="cal-grid">';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){ html += '<div class="dow">'+d+'</div>'; });
    for(var i=0;i<firstDow;i++){ html += '<div class="day muted">'+(prevDim-firstDow+1+i)+'</div>'; }
    for(var d2=1; d2<=dim; d2++){
      var cls = 'day', dt = new Date(year, month, d2);
      if(selected && dt.getTime()===new Date(selected.getFullYear(), selected.getMonth(), selected.getDate()).getTime()) cls += ' selected';
      if(dt.toDateString()===today.toDateString()) cls += ' today';
      html += '<div class="'+cls+'" data-day="'+d2+'" role="button" tabindex="0">'+d2+'</div>';
    }
    var trailing = (7 - ((firstDow+dim) % 7)) % 7;
    for(var k=1;k<=trailing;k++){ html += '<div class="day muted">'+k+'</div>'; }
    popup.innerHTML = html + '</div>';
  }

  popup.addEventListener('click', function(e){
    e.stopPropagation();
    var nav = e.target.closest('[data-nav]');
    if(nav){
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+parseInt(nav.getAttribute('data-nav'),10), 1);
      render(); position(); return;
    }
    var day = e.target.closest('.day[data-day]');
    if(day){
      var picked = new Date(viewDate.getFullYear(), viewDate.getMonth(), parseInt(day.getAttribute('data-day'),10));
      input.value = formatDMY(picked);
      setError(false);
      popup.classList.remove('open');
      onCommit(dateToISO(picked));
    }
  });
  popup.addEventListener('change', function(e){
    var role = e.target.getAttribute('data-role');
    if(!role) return;
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    if(role==='month') m = parseInt(e.target.value,10);
    if(role==='year')  y = parseInt(e.target.value,10);
    viewDate = new Date(y, m, 1);
    render(); position();
  });
  popup.addEventListener('keydown', function(e){
    if((e.key==='Enter' || e.key===' ') && e.target.getAttribute('data-day')){ e.preventDefault(); e.target.click(); }
  });

  function position(){ positionFloatingPanel(wrap, popup, { alignRight:true, gap:6 }); }
  function open(){
    var sel = parseDMY(input.value);
    viewDate = sel ? new Date(sel.getFullYear(), sel.getMonth(), 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    render();
    popup.classList.add('open');
    position();
  }
  function close(){ popup.classList.remove('open'); }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(popup.classList.contains('open')) close(); else open();
  });
  input.addEventListener('click', function(){ if(!popup.classList.contains('open')) open(); });
  input.addEventListener('keydown', function(e){
    if(e.key==='Escape') close();
    if(e.key==='Enter'){ commitTyped(true); close(); }
  });
  /* manual typing: apply as soon as the text is a complete valid date, or empty */
  input.addEventListener('input', function(){
    var v = input.value.trim();
    if(v===''){ setError(false); onCommit(''); return; }
    var dt = parseDMY(v);
    if(dt && v.length===10){
      setError(false);
      viewDate = new Date(dt.getFullYear(), dt.getMonth(), 1);
      if(popup.classList.contains('open')){ render(); position(); }
      onCommit(dateToISO(dt));
    }
  });
  function commitTyped(final){
    var v = input.value.trim();
    if(v===''){ setError(false); onCommit(''); return; }
    var dt = parseDMY(v);
    if(dt){ input.value = formatDMY(dt); setError(false); onCommit(dateToISO(dt)); }
    else { setError(true); }
  }
  input.addEventListener('blur', function(){ commitTyped(false); });
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) close(); });
  document.addEventListener('scroll', function(e){ if(popup.classList.contains('open') && !popup.contains(e.target)) close(); }, true);
  window.addEventListener('resize', function(){ if(popup.classList.contains('open')) position(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  return {
    setValue:function(iso){ input.value = iso ? isoToDMY(iso) : ''; setError(false); close(); }
  };
}

/* =========================================================
   12. MODALS / TOAST
   ========================================================= */
function openModal(id){
  var o = document.getElementById(id);
  o.classList.remove('closing'); o.classList.add('open');
}
function closeModal(id){
  var o = document.getElementById(id);
  if(!o.classList.contains('open')) return;
  o.classList.add('closing');
  setTimeout(function(){ o.classList.remove('open'); o.classList.remove('closing'); }, 160);
}
function closeAllModals(){
  ['mcModal','invoiceModal','mailModal'].forEach(function(id){
    var o = document.getElementById(id);
    o.classList.remove('open'); o.classList.remove('closing');
  });
}
var toastTimer = null;
function showToast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
function detailItem(label, value, full){
  var v = (value===undefined || value===null || value==='') ? '\u2014' : value;
  return '<div class="detail-item'+(full?' full':'')+'"><span class="detail-label">'+label+'</span><span class="detail-value">'+v+'</span></div>';
}
function kvRow(label, value, isTotal){
  return '<div class="kv-row'+(isTotal?' kv-total':'')+'"><span class="kv-label">'+label+'</span><span class="kv-value">'+value+'</span></div>';
}

/* Hotspot: MC Reference  ->  ZSGTSFFM_MC_DETAILS( mc_ref_no ) */
function openMasterContract(ref){
  var mc = HeadsUpService.getMasterContract(ref);
  if(!mc) return;
  document.getElementById('mcModalTitle').textContent = 'Master Contract \u2014 ' + mc.ref;
  document.getElementById('mcModalBody').innerHTML =
    '<div class="detail-section"><div class="detail-section-title">Basic Details</div><div class="detail-grid">'+
      detailItem('MC Reference', escapeHtml(mc.ref))+
      detailItem('MC Date', isoToDMY(mc.date))+
      detailItem('Origin Entity', escapeHtml(mc.origin+' - '+mc.originName))+
      detailItem('Region', escapeHtml(mc.region))+
      detailItem('MC Description', escapeHtml(mc.desc), true)+
      detailItem('MC Amount (USD)', formatAmount(mc.amt))+
    '</div></div>'+
    '<div class="detail-section"><div class="detail-section-title">FX Model Details</div><div class="detail-grid">'+
      detailItem('FX Model', escapeHtml(mc.modelId+' - '+mc.modelDesc), true)+
      detailItem('Currency ID', escapeHtml(mc.currId))+
    '</div></div>';
  openModal('mcModal');
}

/* Hotspot: Deal ID  ->  SUBMIT zsgtsf_rdeal_trd_inv WITH p_deal = <deal id> AND RETURN */
function openInvoice(dealId){
  var r = state.rows.filter(function(x){ return x.dealId===dealId; })[0];
  if(!r) return;
  document.getElementById('invoiceModalTitle').textContent = 'Invoice \u2014 ' + r.dealId;
  document.getElementById('invoiceModalBody').innerHTML =
    '<div class="detail-section"><div class="detail-section-title">Deal</div><div class="detail-grid">'+
      detailItem('Deal ID', escapeHtml(r.dealId))+
      detailItem('Deal Status', '<span class="'+statusToneClass(r.status)+'">'+escapeHtml(r.status+' - '+r.statusDesc)+'</span>')+
      detailItem('Deal Description', escapeHtml(r.dealDesc), true)+
      detailItem('MC Reference', escapeHtml(r.mcRef))+
      detailItem('Deal Maturity Date', isoToDMY(r.maturityDate))+
      detailItem('FX Utilisation Amount', formatAmount(r.utiAmt))+
    '</div></div>'+
    '<div class="proto-note" title="Will be wired in the future"><b>Invoice report (ZSGTSF_RDEAL_TRD_INV)</b> is called with this Deal ID. '+
    'It is outside this program and will be wired in the future.</div>';
  openModal('invoiceModal');
}

/* Send Mail: confirmation, then SEND_EMAIL */
function openMailConfirm(){
  var plan = buildMailPlan(state.rows);
  if(state.error || !plan.deals.length) return;
  document.getElementById('mailModalBody').innerHTML =
    '<p class="confirm-text">Heads-up mails will be sent for the deals matching the current selection (Key Date, Region, Origin Entity, Deal ID, Status).</p>'+
    '<div class="kv-list">'+
      kvRow('Deals in selection', state.rows.length)+
      kvRow('Eligible deals (status 05 / 07)', plan.deals.length)+
      kvRow('Mails to send', plan.mailCount, true)+
    '</div>';
  openModal('mailModal');
}
function confirmSendMail(){
  var res = HeadsUpService.sendHeadsUpMails(state.rows);
  closeModal('mailModal');
  if(res.texts.indexOf('Successfully Sent') !== -1){ showToast('Email Sent'); }
}

/* =========================================================
   13. EXPORT (ALV standard function)
   ========================================================= */
function exportCsv(){
  var cols = visibleColumns();
  var list = getFilteredSorted();
  function q(s){ return '"'+String(s).replace(/"/g,'""')+'"'; }
  var lines = [cols.map(function(c){ return q(c.label); }).join(',')];
  list.forEach(function(r){ lines.push(cols.map(function(c){ return q(cellText(c,r)); }).join(',')); });
  var blob = new Blob(['\ufeff'+lines.join('\r\n')], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'INR_Heads_Up_Reminder.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
}

/* =========================================================
   14. EVENT HANDLING
   ========================================================= */
var dealDropdown = null, keyDatePicker = null;

function fillSelect(id, items, valueKey, labelFn){
  var sel = document.getElementById(id);
  items.forEach(function(it){
    var o = document.createElement('option');
    o.value = it[valueKey]; o.textContent = labelFn(it);
    sel.appendChild(o);
  });
}

function resetScreen(){
  state.search = '';
  state.filters = initialFilters();
  state.layout = '';
  state.sort = { field:'dealId', dir:'asc' };
  state.page = 1;
  state.selectedDealId = null;
  document.getElementById('tableSearch').value = '';
  document.getElementById('filterRegion').value = '';
  document.getElementById('filterEntity').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterCoArea').value = appData.defaultCoArea;
  document.getElementById('filterLayout').value = '';
  keyDatePicker.setValue('');
  dealDropdown.clear();
  reloadData();
}

function wireEvents(){
  document.getElementById('tableSearch').addEventListener('input', function(e){
    state.search = e.target.value; state.page = 1; renderTable();
  });

  [['filterRegion','region'],['filterEntity','entity'],['filterStatus','status'],['filterCoArea','coArea']].forEach(function(p){
    document.getElementById(p[0]).addEventListener('change', function(e){
      state.filters[p[1]] = e.target.value;
      reloadData();
    });
  });
  document.getElementById('filterLayout').addEventListener('change', function(e){
    state.layout = e.target.value;
    if(!columnByKey(state.sort.field) || LAYOUT_COLUMNS[state.layout].indexOf(state.sort.field)===-1){
      state.sort = { field:'dealId', dir:'asc' };
    }
    state.page = 1; renderTable();
  });

  document.getElementById('btnReset').addEventListener('click', resetScreen);
  /* Refresh: reload the screen from its data source and return to the initial state */
  document.getElementById('btnRefresh').addEventListener('click', function(){
    closeAllModals();
    buildMockTables();
    resetScreen();
  });
  document.getElementById('btnSendMail').addEventListener('click', openMailConfirm);
  document.getElementById('btnConfirmMail').addEventListener('click', confirmSendMail);
  document.getElementById('btnExport').addEventListener('click', exportCsv);

  document.getElementById('pageSizeSelect').addEventListener('change', function(e){
    state.pageSize = parseInt(e.target.value,10); state.page = 1; renderTable();
  });

  /* sorting (header click, preserves search / filters) */
  document.getElementById('tableHead').addEventListener('click', function(e){
    var th = e.target.closest('th[data-sort]');
    if(!th) return;
    var key = th.getAttribute('data-sort');
    if(state.sort.field===key){ state.sort.dir = state.sort.dir==='asc' ? 'desc' : 'asc'; }
    else { state.sort.field = key; state.sort.dir = 'asc'; }
    renderTable();
  });

  /* rows: single click selects (checkbox stays in sync); hotspots open their target */
  document.getElementById('tableBody').addEventListener('click', function(e){
    var tr = e.target.closest('tr[data-id]');
    if(!tr) return;
    var id = tr.getAttribute('data-id');
    var link = e.target.closest('[data-link]');
    if(link){
      e.stopPropagation();
      if(link.getAttribute('data-link')==='deal') openInvoice(id);
      else {
        var row = state.rows.filter(function(r){ return r.dealId===id; })[0];
        openMasterContract(row.mcRef);
      }
      return;
    }
    state.selectedDealId = (state.selectedDealId===id) ? null : id;
    renderTable();
  });

  /* modal close controls */
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', function(){ closeModal(b.getAttribute('data-close')); });
  });
  document.querySelectorAll('.modal-overlay').forEach(function(o){
    o.addEventListener('mousedown', function(e){ if(e.target===o) closeModal(o.id); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ ['mcModal','invoiceModal','mailModal'].forEach(closeModal); }
  });
}

/* =========================================================
   15. INITIALISATION
   ========================================================= */
function init(){
  buildMockTables();

  fillSelect('filterRegion', appData.regions, 'id', function(r){ return r.id+' - '+r.name; });
  fillSelect('filterEntity', appData.entities, 'code', function(e){ return e.code+' - '+e.name; });
  fillSelect('filterStatus', appData.statuses, 'code', function(s){ return s.code+' - '+s.sdesc; });  /* VRM list: "<key> - <text>" */
  var co = document.getElementById('filterCoArea');
  co.innerHTML = '<option value="">Select CO Area</option>';
  appData.coAreas.forEach(function(c){ var o = document.createElement('option'); o.value = c; o.textContent = c; co.appendChild(o); });
  co.value = appData.defaultCoArea;
  fillSelect('filterLayout', appData.layouts, 'id', function(l){ return l.name; });

  dealDropdown = initDropdown({
    key:'dealId',
    items:function(){ return appData.deals; },
    searchText:function(d){ return d.dealId+' '+d.dealDesc; },
    primaryText:function(d){ return d.dealId; },
    secondaryText:function(d){ return d.dealDesc; },
    displayText:function(d){ return d.dealId; },
    valueOf:function(d){ return d.dealId; },
    onChange:function(v){ state.filters.dealId = v; reloadData(); }
  });
  keyDatePicker = initDatePicker('keyDate', function(iso){
    state.filters.keyDate = iso;
    reloadData();
  });

  wireEvents();
  reloadData();
}
init();
