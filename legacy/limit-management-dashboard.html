<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Limit Management Dashboard</title>
<!-- Stylesheet of the supplied limit-management-dashboard.html (markup and script omitted: the React
     screen apps/web/src/features/limit-management replaces them). tools/scope-css.mjs reads this block. -->
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --text:#1D2D3E; --text-muted:#475E75; --text-faint:#687B8D;
  --border:#D5DADD; --border-strong:#8996A1;
  --primary:#0A6ED1; --primary-dark:#085CAF; --primary-light:#4FA3E8; --primary-tint:#EAF3FC;
  --success:#107E3E; --success-tint:#E4F5E9; --warning:#E9730C; --warning-tint:#FFF4CC;
  --error:#BB0000; --error-tint:#FCEAEA; --teal:#0F828C; --purple:#6B3FA0;
  --gray-tint:#F2F4F5;
  --radius-lg:12px; --radius-md:8px; --radius-sm:4px;
  --shadow-card:0 1px 3px rgba(34,53,72,.13);
  --shadow-pop:0 22px 70px rgba(16,38,58,.3);
  --font:"72","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:var(--font);}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#B7C2CB;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.app{max-width:100%;margin:0;padding:.3rem .2rem .5rem;}
.page-header{margin-bottom:12px;background:transparent;padding:4px 2px;display:flex;align-items:center;gap:12px;}
.page-header .logo-img{height:40px;width:auto;max-width:120px;object-fit:contain;flex:none;}
.page-header .header-text{display:flex;flex-direction:column;}
.page-header h1{font-size:16px;font-weight:700;margin:0 0 3px;letter-spacing:-.2px;}
.page-header p{margin:0;color:var(--text-muted);font-size:13px;}
.page-header .header-actions{margin-left:auto;display:flex;gap:8px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);margin-bottom:12px;overflow:visible;}
.section-title{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--primary-dark);letter-spacing:.3px;}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;}
.section-title .section-note{margin-left:auto;font-weight:500;color:var(--text-faint);font-size:12px;letter-spacing:0;}
.table-col{display:flex;flex-direction:column;}
.table-col > .card{display:flex;flex-direction:column;margin-bottom:0;}
.table-col .table-scroll{overflow:auto;max-height:calc(100vh - 235px);min-height:150px;}
.field{display:flex;flex-direction:column;gap:6px;position:relative;min-width:0;}
.field label{font-size:13px;font-weight:600;color:var(--text-muted);white-space:nowrap;line-height:1.2;}
.field label .req{color:var(--error);margin-left:2px;}
.field .hint{font-size:11.5px;color:var(--text-faint);}
.field .error-msg{font-size:11.5px;color:var(--error);display:none;margin-top:-2px;}
.field.has-error .error-msg{display:block;}
.field.has-error .control{border-color:var(--error) !important;background:var(--error-tint);}
.control{height:36px;min-width:0;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 11px;font-size:13px;color:var(--text);background:#fff;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;}
.control::placeholder{color:var(--text-faint);}
.control:hover{border-color:#A6B0B9;}
.control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.control[readonly]{background:var(--gray-tint);color:var(--text-muted);cursor:default;}
.control:disabled{background:var(--gray-tint);color:var(--text-faint);cursor:not-allowed;}
select.control{appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;padding-right:30px;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%23475E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 11px center;}
select.control:disabled{background-color:var(--gray-tint);}
.input-with-suffix{position:relative;display:flex;align-items:center;}
.input-with-suffix .control{padding-right:58px;text-align:right;}
.input-with-suffix .suffix{position:absolute;right:8px;font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);padding:3px 7px;border-radius:6px;pointer-events:none;white-space:nowrap;}
.date-field{position:relative;}
.date-field .control{padding-right:34px;}
.date-icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-muted);padding:0;}
.date-icon:hover{background:var(--primary-tint);color:var(--primary);}
.date-icon:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--text-faint);}
.btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,color .15s,opacity .15s,box-shadow .15s,transform .1s;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--primary-dark);box-shadow:0 2px 6px rgba(10,110,209,.22);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover:not(:disabled){border-color:var(--primary);color:var(--primary);box-shadow:0 1px 4px rgba(34,53,72,.1);}
.btn-danger{background:#fff;color:var(--error);border-color:#F3C6C0;}
.btn-danger:hover:not(:disabled){background:var(--error-tint);}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{height:28px;padding:0 10px;font-size:12px;}
.btn.drag-valid{border-color:var(--primary);box-shadow:0 0 0 2px rgba(10,110,209,.14);}
.btn.drag-over{border-color:var(--primary) !important;background:var(--primary-tint) !important;color:var(--primary) !important;box-shadow:0 0 0 2px rgba(10,110,209,.12);}
.table-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;flex-wrap:wrap;flex:0 0 auto;}
.toolbar-divider{width:1px;height:22px;background:var(--border);margin:0 4px;}
.search-box{position:relative;flex:1 1 230px;min-width:190px;max-width:340px;}
.search-box input{height:32px;width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 12px 0 30px;font-size:13px;outline:none;transition:border-color .18s,box-shadow .18s;}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-box .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);display:flex;}
.filter-select{flex:0 1 150px;min-width:110px;height:32px;}
.filter-year{flex:0 0 96px;min-width:80px;height:32px;}
.filter-select.has-error,.filter-year.has-error{border-color:var(--error) !important;background-color:var(--error-tint);}
.toolbar-spacer{flex:1 0 8px;}
.result-count{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.inline-alert{display:none;margin:0 16px 10px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;border:1px solid;align-items:center;gap:8px;}
.inline-alert.show{display:flex;}
.inline-alert.warn{background:var(--warning-tint);border-color:#EBD58C;color:#7A5200;}
.inline-alert.info{background:var(--primary-tint);border-color:#BEE0F7;color:var(--primary-dark);}
.inline-alert .alert-close{margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:inherit;padding:0 4px;}
table.mc-table{width:100%;border-collapse:collapse;min-width:1120px;}
table.mc-table thead th{position:sticky;top:0;background:var(--gray-tint);border-bottom:1px solid #E6E9EB;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0;color:var(--text-muted);font-weight:700;padding:8px 6px;white-space:nowrap;cursor:pointer;user-select:none;z-index:5;}
table.mc-table thead th:hover{color:var(--primary-dark);}
table.mc-table thead th.no-sort{cursor:default;}
table.mc-table thead th.no-sort:hover{color:var(--text-muted);}
table.mc-table thead th.action-col,table.mc-table td.action-col{width:34px;text-align:center;padding-left:8px;padding-right:8px;}
table.mc-table thead th .sort-ind{display:inline-block;margin-left:4px;font-size:9px;color:var(--text-faint);}
table.mc-table thead th.sorted .sort-ind{color:var(--primary);}
table.mc-table thead th.num,table.mc-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.mc-table tbody td{padding:8px 6px;border-bottom:1px solid #E6E9EB;font-size:12.5px;white-space:nowrap;user-select:none;-webkit-user-select:none;}
table.mc-table tbody tr{cursor:pointer;transition:background .15s;}
table.mc-table tbody tr:hover{background:#F7FBFF;}
table.mc-table tbody tr.selected{background:var(--primary-tint);}
table.mc-table tbody tr.dragging{opacity:.5;}
table.mc-table tbody tr.row-new{animation:flashNew 1.8s ease-out;}
@keyframes flashNew{0%{background:#DFF3E6;}100%{background:transparent;}}
.row-select-checkbox{width:14px;height:14px;accent-color:var(--primary);cursor:pointer;vertical-align:middle;}
td.c-total{background:rgba(10,110,209,.045);}
td.c-util{background:rgba(233,115,12,.06);}
td.c-bal-pos{background:rgba(16,126,62,.07);color:var(--success);font-weight:700;}
td.c-bal-neg{background:rgba(187,0,0,.07);color:var(--error);font-weight:700;}
tr.selected td.c-total,tr.selected td.c-util,tr.selected td.c-bal-pos,tr.selected td.c-bal-neg{background:transparent;}
.status-text{font-weight:700;font-size:13px;white-space:nowrap;}
.st-ok{color:var(--success);} .st-wait{color:#9B6B00;} .st-bad{color:var(--error);}
.light{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;}
.light.ok{background:var(--success);} .light.bad{background:var(--error);}
.light.led{background:#F0AB00;} .light.wait{background:#fff;border:3px solid #F0AB00;}
.empty-state{padding:44px 20px;text-align:center;color:var(--text-muted);}
.empty-state .big{display:flex;justify-content:center;margin-bottom:8px;color:var(--text-faint);}
.empty-state .title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
.table-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;flex-wrap:wrap;gap:10px;flex:0 0 auto;border-top:1px solid var(--border);}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
.page-size-select select{height:28px;border:1px solid var(--border-strong);border-radius:6px;font-size:12px;padding:0 6px;}
.page-info{font-size:12px;color:var(--text-muted);}
.pagination{display:flex;align-items:center;gap:4px;}
.pagination button{min-width:28px;height:28px;border:1px solid var(--border-strong);background:#fff;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;color:var(--text);transition:border-color .15s,color .15s,background .15s;}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pagination button:disabled{opacity:.4;cursor:not-allowed;}
.pagination .gap{padding:0 4px;color:var(--text-faint);}
.modal-overlay{position:fixed;inset:0;background:rgba(16,26,41,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.z2{z-index:220;} .modal-overlay.z3{z-index:240;}
.modal{background:#fff;border-radius:var(--radius-lg);width:420px;max-width:100%;box-shadow:var(--shadow-pop);padding:20px 22px 16px;text-align:left;animation:popIn .18s ease-out;border:1px solid #B9C2C9;display:flex;flex-direction:column;max-height:94vh;}
@keyframes popIn{from{transform:scale(.98);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex:0 0 auto;}
.modal h2{font-size:14px;margin:0;}
.modal-close-btn{border:none;background:transparent;font-size:18px;line-height:1;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:6px;}
.modal-close-btn:hover{background:var(--gray-tint);color:var(--text);}
.modal-body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:2px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex:0 0 auto;}
.modal-actions .btn{min-width:96px;}
.modal.m-set{width:min(470px,calc(100vw - 40px));}
.modal.m-wide{width:min(1060px,calc(100vw - 40px));}
.modal.m-deal{width:min(680px,calc(100vw - 40px));}
.modal.m-email{width:min(560px,calc(100vw - 40px));}
.form-stack{display:flex;flex-direction:column;gap:12px;}
.form-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;}
.range-row .to{padding-bottom:9px;color:var(--text-muted);font-size:13px;}
.ctx-box{padding:9px 11px;background:var(--primary-tint);border:1px solid #BEE0F7;border-radius:var(--radius-sm);font-size:12.5px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin-bottom:12px;}
.ctx-box b{color:var(--primary-dark);font-variant-numeric:tabular-nums;text-align:right;}
.summary-line{margin-bottom:12px;padding:9px 11px;background:var(--primary-tint);border:1px solid #BEE0F7;border-radius:var(--radius-sm);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 18px;}
.summary-line b{color:var(--primary-dark);}
.sub-title{display:flex;align-items:center;gap:10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--primary-dark);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.sub-title:first-child{margin-top:0;}
.sub-title .hint-r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text-faint);font-size:12px;}
.popup-table-wrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:auto;max-height:300px;}
table.popup-table{width:100%;border-collapse:collapse;}
table.popup-table thead th{position:sticky;top:0;background:var(--gray-tint);border-bottom:1px solid var(--border);text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);font-weight:700;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;z-index:3;}
table.popup-table thead th:hover{color:var(--primary-dark);}
table.popup-table thead th.sorted .sort-ind{color:var(--primary);}
table.popup-table thead th .sort-ind{margin-left:4px;font-size:9px;color:var(--text-faint);}
table.popup-table thead th.num,table.popup-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.popup-table td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap;user-select:none;-webkit-user-select:none;}
table.popup-table tbody tr{cursor:pointer;}
table.popup-table tbody tr:hover{background:#F7FBFF;}
table.popup-table tbody tr.selected{background:var(--primary-tint);}
table.popup-table tbody tr.total-row{background:var(--gray-tint);font-weight:700;cursor:pointer;}
table.popup-table tbody tr.total-row.selected{background:var(--primary-tint);}
table.popup-table th.pin,table.popup-table td.pin{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--border);}
table.popup-table thead th.pin{z-index:4;background:var(--gray-tint);}
table.popup-table tbody tr:hover td.pin{background:#F7FBFF;}
table.popup-table tbody tr.selected td.pin{background:var(--primary-tint);}
.popup-empty{text-align:center !important;color:var(--text-faint);padding:18px !important;}
.deal-link{color:var(--primary-dark);font-weight:700;cursor:pointer;background:none;border:none;padding:0;font-size:13px;}
.deal-link:hover{text-decoration:underline;color:var(--primary);}
.mini-search{position:relative;width:220px;}
.mini-search input{height:28px;width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 10px 0 28px;font-size:12.5px;outline:none;text-transform:none;letter-spacing:0;font-weight:400;}
.mini-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.mini-search .icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-faint);display:flex;}
.detail-section{margin-bottom:16px;} .detail-section:last-child{margin-bottom:0;}
.detail-section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--primary-dark);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
.detail-item{display:flex;flex-direction:column;gap:2px;min-width:0;}
.detail-item .detail-label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.detail-item .detail-value{font-size:13px;color:var(--text);font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
.demo-note{font-size:12px;color:var(--text-muted);background:var(--gray-tint);border-radius:var(--radius-sm);padding:7px 10px;margin-top:12px;}
.mail-meta{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}
.mail-meta b{color:var(--text);}
.mail-body{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:15px;}
.mail-body table{border-collapse:collapse;margin:8px 0 14px;}
.mail-body td{border:2px solid #E0E0E0;padding:2px 10px;font-size:15px;}
.mail-body td.lg{background:#F5F5F5;font-weight:700;width:230px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243B53;color:#fff;padding:11px 18px;border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow-pop);z-index:500;display:flex;align-items:center;gap:8px;max-width:90vw;}
.toast.error{background:#4A211D;}
@media (max-width:700px){.form-two{grid-template-columns:1fr;} .detail-grid{grid-template-columns:1fr;}}
</style>
</head>
<body></body>
</html>
