<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post FX MTM to Accounting - Other Origins</title>
<style>
/* =========================================================
   Design system
   ========================================================= */
:root{
  --bg:#F4F8FC;
  --card:#FFFFFF;
  --text:#1D2D3E;
  --text-muted:#5C7085;
  --text-faint:#8CA0B3;
  --border:#E1E9F2;
  --border-strong:#CBD9E8;
  --primary:#1F6FEB;
  --primary-dark:#1657C4;
  --primary-light:#6FA8FF;
  --primary-tint:#EAF2FF;
  --success:#27AE60;
  --success-tint:#E8F8EF;
  --warning:#FF8A00;
  --warning-tint:#FFF3E4;
  --error:#E74C3C;
  --error-tint:#FDEAE8;
  --teal:#17BEBB;
  --teal-tint:#E7FAF9;
  --purple:#8E44AD;
  --purple-tint:#F5EAFA;
  --gray-tint:#EEF2F6;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(22,39,64,0.04), 0 4px 14px rgba(22,39,64,0.06);
  --shadow-pop:0 8px 28px rgba(22,39,64,0.16);
  --font:'Inter',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:12.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);}
input,select,textarea{font-family:var(--font);}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#C7D4E2;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   Layout
   ========================================================= */
.app{
  max-width:100%;
  margin:0;
  padding:0.3rem 0.2rem 0.5rem;
}

.table-col{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 210px);
}
.table-col > .card{
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  min-height:0;
  margin-bottom:0;
}
.table-col .table-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
}
@media (max-width:1080px){
  .table-col{
    max-height:none;
  }
  .table-col .table-scroll{max-height:520px;}
}

.page-actions-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px;
}

/* KPI cards */
.kpi-row{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.kpi-card{
  flex:1 1 180px;
  min-width:170px;
  background:var(--card);
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  min-height:64px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-left-color .18s ease;
}
.kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(22,39,64,0.08), 0 10px 22px rgba(22,39,64,0.09);
  border-left-color:var(--primary-dark);
}
.kpi-card .kpi-value{
  font-size:30px;
  font-weight:700;
  color:var(--primary-dark);
  line-height:1.15;
}
.kpi-card .kpi-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
}

.create-card{border-left-color:var(--primary);}
.create-card .create-icon-circle{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  font-weight:700;
  line-height:1;
  transition:background .18s ease, transform .18s ease;
}
.create-card .kpi-label{color:var(--text);font-weight:700;font-size:13px;}
.create-card:hover .create-icon-circle{
  background:var(--primary-dark);
  transform:scale(1.08);
}
.create-card:hover{border-left-color:var(--primary-dark);}

/* Header */
.page-header{
  margin-bottom:12px;
  background:#EAF3FF;
  border:1px solid #D7E9FF;
  border-radius:var(--radius-md);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}
.page-header .logo-img{
  height:40px;
  width:auto;
  max-width:120px;
  object-fit:contain;
  flex:none;
}
.page-header .logo-placeholder{
  height:36px;
  width:36px;
  flex:none;
  border-radius:8px;
  border:1px dashed var(--border-strong);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--text-faint);
}
.page-header .header-text{display:flex;flex-direction:column;}

/* Compact form rows with variable-width fields */
.form-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  margin-bottom:12px;
}
.form-row:last-child{margin-bottom:0;}
.form-row > .field{flex:1 1 160px;min-width:0;}
.field.w-sm{flex:0 1 100px;}
.field.w-sm-md{flex:0 1 124px;}
.field.w-md{flex:0 1 154px;}
.field.w-md-wide{flex:0 1 184px;}
.field.w-wide{flex:1 1 190px;min-width:165px;}
.field.w-date{flex:0 0 156px;min-width:156px;}
.form-row.no-wrap{flex-wrap:nowrap;}
.form-row.no-wrap > .field{min-width:0;}
.field.fx-field{flex:1 1 0;min-width:130px;}

/* 12-column responsive grid for the Create Master Contract modal.
   Each field gets a span sized to what its value actually needs,
   rather than forcing every field to equal width. */
.form-grid-12{
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:10px 12px;
  margin-bottom:14px;
}
.form-grid-12:last-child{margin-bottom:0;}
.form-grid-12 > .field{min-width:0;}
.gc-3{grid-column:span 3;}
.gc-4{grid-column:span 4;}
.gc-5{grid-column:span 5;}
.gc-6{grid-column:span 6;}
.gc-7{grid-column:span 7;}
@media (max-width:700px){
  .form-grid-12{grid-template-columns:repeat(6, 1fr);}
  .gc-3{grid-column:span 3;}
  .gc-4{grid-column:span 3;}
  .gc-5{grid-column:span 6;}
  .gc-6{grid-column:span 6;}
  .gc-7{grid-column:span 6;}
}
@media (max-width:460px){
  .form-grid-12{grid-template-columns:1fr;}
  .gc-3, .gc-4, .gc-5, .gc-6, .gc-7{grid-column:span 1;}
}
.page-header h1{
  font-size:19px;
  font-weight:700;
  margin:0 0 3px;
  letter-spacing:-0.2px;
}
.page-header p{
  margin:0;
  color:var(--text-muted);
  font-size:12.5px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  margin-bottom:12px;
  overflow:visible;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:700;
  color:var(--primary-dark);
  letter-spacing:0.3px;
}
.section-title .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;
}
.section-body{
  padding:12px 16px 14px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px 14px;
}
.form-grid.cols-1{grid-template-columns:1fr;}
.form-grid.cols-2{grid-template-columns:repeat(2,1fr);}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.field label{
  font-size:11.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  line-height:1.2;
}
.field label .req{color:var(--error);margin-left:2px;}
.field .hint{font-size:11px;color:var(--text-faint);}
.field .error-msg{
  font-size:11px;
  color:var(--error);
  display:none;
  margin-top:-2px;
}
.field.has-error .error-msg{display:block;}
.field.has-error input,
.field.has-error .select-display,
.field.has-error .dd-input{
  border-color:var(--error) !important;
  background:var(--error-tint);
}

.control{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 11px;
  font-size:12.5px;
  color:var(--text);
  background:#fff;
  width:100%;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.control::placeholder{color:var(--text-faint);}
.control:hover{border-color:#AFC2D8;}
.control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-tint);
}
.control[readonly]{
  background:var(--gray-tint);
  color:var(--text-muted);
  cursor:default;
}
.control:disabled{
  background:var(--gray-tint);
  color:var(--text-faint);
  cursor:not-allowed;
}

.input-with-suffix{
  position:relative;
  display:flex;
  align-items:center;
}
.input-with-suffix .control{padding-right:58px;}
.input-with-suffix .suffix{
  position:absolute;
  right:8px;
  font-size:11px;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-tint);
  padding:3px 7px;
  border-radius:6px;
  pointer-events:none;
  white-space:nowrap;
}

/* Searchable dropdown */
.dd{position:relative;}
.dd-input{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 32px 0 11px;
  font-size:12.5px;
  width:100%;
  outline:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%235C7085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
  cursor:pointer;
  transition:border-color .15s, box-shadow .15s;
}
.dd-input::placeholder{color:var(--text-faint);}
.dd-input:hover{border-color:#AFC2D8;}
.dd-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.dd.disabled .dd-input{background-color:var(--gray-tint);color:var(--text-faint);cursor:not-allowed;}

.dd-panel{
  position:absolute;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  min-width:200px;
  max-height:240px;
  overflow-y:auto;
  z-index:210;
  display:none;
  padding:6px;
}
.dd.open .dd-panel{display:block;}
.dd-item{
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.dd-item:hover, .dd-item.active{background:var(--primary-tint);}
.dd-item .primary-line{font-weight:600;font-size:12.5px;color:var(--text);}
.dd-item .secondary-line{font-size:11px;color:var(--text-muted);}
.dd-empty{padding:14px 10px;text-align:center;color:var(--text-faint);font-size:11.5px;}

/* Date field */
.date-field{position:relative;}
.date-field .control{padding-right:34px;}
.date-icon{
  position:absolute;
  right:6px;top:50%;
  transform:translateY(-50%);
  width:24px;height:24px;
  border:none;background:transparent;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--text-muted);
  font-size:13px;
}
.date-icon:hover{background:var(--primary-tint);color:var(--primary);}
.date-popup{
  position:absolute;
  width:250px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  z-index:210;
  padding:10px;
  display:none;
}
.date-popup.open{display:block;}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.cal-head button{
  width:24px;height:24px;border:none;background:var(--gray-tint);
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);
}
.cal-head button:hover{background:var(--primary-tint);color:var(--primary);}
.cal-head .cal-title{font-weight:700;font-size:12px;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal-grid .dow{
  text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding:4px 0;
}
.cal-grid .day{
  text-align:center;
  font-size:11.5px;
  padding:6px 0;
  border-radius:6px;
  cursor:pointer;
  color:var(--text);
}
.cal-grid .day:hover{background:var(--primary-tint);}
.cal-grid .day.muted{color:var(--text-faint);}
.cal-grid .day.selected{background:var(--primary);color:#fff;font-weight:700;}
.cal-grid .day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--primary-light);}

/* Buttons */
.btn{
  height:32px;
  padding:0 16px;
  border-radius:var(--radius-sm);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, box-shadow .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(31,111,235,0.25);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 1px 4px rgba(22,39,64,0.08);}
.btn-danger{background:#fff;color:var(--error);border-color:#F3C6C0;}
.btn-danger:hover{background:var(--error-tint);}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:0 6px;height:auto;}
.btn-ghost:hover{text-decoration:underline;}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px;}

.actions-row{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:12px 16px;
}

/* Success banner */
.success-banner{
  display:none;
  align-items:center;
  gap:10px;
  margin:0 0 12px;
  padding:9px 14px;
  background:var(--success-tint);
  border:1px solid #BFE8D0;
  border-radius:var(--radius-md);
  color:#1E7A46;
  font-size:12px;
}
.success-banner.show{display:flex;}
.success-banner b{font-weight:700;}
.success-banner .spacer{flex:1;}

/* =========================================================
   Master Contracts table section
   ========================================================= */
.table-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 16px 10px;
  flex-wrap:wrap;
  flex:0 0 auto;
}
.search-box{
  position:relative;
  flex:1 1 260px;
  min-width:200px;
}
.search-box input{
  height:32px;
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 12px 0 30px;
  font-size:12.5px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-box .icon{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-faint);font-size:13px;
}
.toolbar-spacer{flex:1 0 8px;}
.result-count{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}

.filter-select{
  flex:0 1 122px;
  min-width:88px;
  height:32px;
  cursor:pointer;
}

.table-scroll{
  overflow-x:auto;
}
table.mc-table{
  width:100%;
  border-collapse:collapse;
  min-width:1060px;
}
table.mc-table thead th{
  position:sticky;top:0;
  background:#F7FAFD;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color:var(--text-muted);
  font-weight:700;
  padding:10px 14px;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  z-index:5;
}
table.mc-table thead th:hover{color:var(--primary-dark);}
table.mc-table thead th.no-sort{cursor:default;}
table.mc-table thead th.no-sort:hover{color:var(--text-muted);}
table.mc-table thead th.action-col, table.mc-table td.action-col{
  width:40px;
  text-align:center;
  padding-left:10px;
  padding-right:10px;
}
.row-select-checkbox{
  width:14px;height:14px;
  accent-color:var(--primary);
  cursor:pointer;
  vertical-align:middle;
}
table.mc-table thead th .sort-ind{
  display:inline-block;
  margin-left:4px;
  font-size:9px;
  color:var(--text-faint);
}
table.mc-table thead th.sorted .sort-ind{color:var(--primary);}
table.mc-table thead th.num,
table.mc-table td.num{text-align:right;}
table.mc-table tbody td{
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  white-space:nowrap;
}
table.mc-table tbody tr{cursor:pointer;transition:background .18s ease;}
table.mc-table tbody tr:hover{background:#F7FAFD;}
table.mc-table tbody tr:hover .mc-link{color:var(--primary);}
table.mc-table tbody tr.selected{background:var(--primary-tint);}
table.mc-table tbody tr.row-new{animation:flashNew 1.8s ease-out;}
@keyframes flashNew{
  0%{background:#DFF3E6;}
  100%{background:transparent;}
}
.mc-link{color:var(--primary-dark);font-weight:700;cursor:pointer;transition:color .15s ease;}
.mc-link:hover{text-decoration:underline;color:var(--primary);}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.status-pill .status-dot{width:6px;height:6px;border-radius:50%;}
.status-in-use{background:var(--success-tint);color:#1E7A46;}
.status-in-use .status-dot{background:var(--success);}
.status-confirmed{background:var(--primary-tint);color:var(--primary-dark);}
.status-confirmed .status-dot{background:var(--primary);}
.status-draft{background:var(--gray-tint);color:var(--text-muted);}
.status-draft .status-dot{background:var(--text-faint);}
.status-pending{background:var(--warning-tint);color:#9A5300;}
.status-pending .status-dot{background:var(--warning);}
.status-rejected{background:var(--error-tint);color:#B4362A;}
.status-rejected .status-dot{background:var(--error);}
.status-settled{background:var(--teal-tint);color:#0E8785;}
.status-settled .status-dot{background:var(--teal);}
.status-matured{background:var(--purple-tint);color:#6C3488;}
.status-matured .status-dot{background:var(--purple);}

/* Plain-text status presentation (Master Contracts table) */
.status-text{font-weight:600;font-size:12px;white-space:nowrap;}
.status-text-in-use{color:var(--success);}
.status-text-confirmed{color:var(--primary);}
.status-text-draft{color:var(--text-muted);}
.status-text-pending{color:var(--warning);}
.status-text-rejected{color:var(--error);}
.status-text-settled{color:var(--teal);}
.status-text-matured{color:var(--purple);}

.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.empty-state .big{font-size:28px;margin-bottom:6px;}

.table-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  flex-wrap:wrap;
  gap:10px;
  flex:0 0 auto;
  border-top:1px solid var(--border);
}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.page-size-select select{height:28px;border:1px solid var(--border-strong);border-radius:6px;font-size:11.5px;padding:0 6px;}

.pagination{display:flex;align-items:center;gap:4px;}
.pagination button{
  min-width:28px;height:28px;
  border:1px solid var(--border-strong);
  background:#fff;
  border-radius:6px;
  font-size:11.5px;
  cursor:pointer;
  color:var(--text);
  transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}

var MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function isoToUTC(iso){ var p = iso.split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function utcToISO(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth()+1) + '-' + pad2(d.getUTCDate()); }
function addDaysISO(iso, n){ return utcToISO(isoToUTC(iso) + n * 86400000); }
function diffDays(aIso, bIso){ return Math.round((isoToUTC(aIso) - isoToUTC(bIso)) / 86400000); }
function lastDayOfMonthISO(y, m1){ return utcToISO(Date.UTC(y, m1, 0)); }
function isMonthEndISO(iso){ return lastDayOfMonthISO(+iso.slice(0,4), +iso.slice(5,7)) === iso; }
function isoToDMY(iso){ return iso ? iso.slice(8,10) + '-' + iso.slice(5,7) + '-' + iso.slice(0,4) : ''; }
function dmyToISO(str){
  var m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(String(str || '').trim());
  if(!m) return null;
  var d = +m[1], mo = +m[2], y = +m[3];
  if(mo < 1 || mo > 12 || d < 1) return null;
  if(d > +lastDayOfMonthISO(y, mo).slice(8,10)) return null;
  return y + '-' + pad2(mo) + '-' + pad2(d);
}
function round2(n){ return Math.round(n * 100) / 100; }
function round6(n){ return Math.round(n * 1e6) / 1e6; }
function formatNumber(n, dec){
  return Number(n).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function ccyDec(ccy){ return CCY_DECIMALS.hasOwnProperty(ccy) ? CCY_DECIMALS[ccy] : 2; }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function byId(id){ return document.getElementById(id); }
function padLeft(str, len, ch){ str = String(str); while(str.length < len) str = ch + str; return str; }

function buildSpotTable(d){
  mockCurrencyPairs.forEach(function(cp){
    var mdl = spotModel[cp.pair], tbl = {};
    for(var y = 2025; y <= 2028; y++){
      for(var m = 1; m <= 12; m++){
        var offset = (y - 2026) * 12 + (m - 9);
        var rate = mdl.base * (1 + mdl.drift * offset + mdl.amp * Math.sin(offset * 1.3 + mdl.phase) - mdl.amp * Math.sin(mdl.phase));
        tbl[y + '-' + pad2(m)] = rate;
      }
    }
    d.spot[cp.pair] = tbl;
  });
}

function pairInfo(pair){
  for(var i = 0; i < mockCurrencyPairs.length; i++){ if(mockCurrencyPairs[i].pair === pair) return mockCurrencyPairs[i]; }
  return null;
}
function spotAt(d, pair, keyIso){
  var t = d.spot[pair];
  return t && t[keyIso.slice(0,7)] ? round6(t[keyIso.slice(0,7)]) : 0;
}
// Swap points curve for a pair on a key date (dlfz > 15 only, ascending by tenor)
function swapCurveFor(pair, keyIso){
  var offset = (+keyIso.slice(0,4) - 2026) * 12 + (+keyIso.slice(5,7) - 9);
  var scale = 1 + 0.05 * Math.sin(offset * 0.9);
  return swapTenorDays.map(function(days){
    return { dlfz:days, kkurs: round6(swapAnnualPoints[pair] * Math.pow(days / 365, 1.04) * scale) };
  });
}

/* ---- Selection-criteria helpers ---- */
function parseRfhaFilter(text){
  var out = [];
  String(text || '').split(/[,\s;]+/).forEach(function(tok){
    if(!tok) return;
    var m = /^(\w+)\s*-\s*(\w+)$/.exec(tok);
    if(m) out.push({ from:m[1], to:m[2] });
    else out.push({ from:tok, to:tok });
  });
  return out;
}
function matchesRfha(rfha, ranges){
  if(!ranges.length) return true;
  for(var i = 0; i < ranges.length; i++){
    if(rfha >= ranges[i].from && rfha <= ranges[i].to) return true;
  }
  return false;
}

// GET_DATA: select, derive and value the transactions for the selection criteria
function getFxTransactions(c){
  var months = buildMtmMonths(c.keyIso);
  var out = [];
  db.deals.forEach(function(deal){
    if(c.companies.indexOf(deal.bukrs) < 0) return;
    if(!(deal.dblfz <= c.keyIso && deal.delfz > c.keyIso)) return;      // DBLFZ <= date < DELFZ
    if(!matchesRfha(deal.rfha, c.rfhaRanges)) return;
    if(c.bp && deal.kontrh !== c.bp) return;
    if(deal.saktiv === '3') return;                                      // SAKTIV <> '3'
    if(EXCLUDED_TXN_STATUS.indexOf(deal.txnStatus) >= 0) return;         // TXN_STATUS NOT IN TVARV
    var isNdf = deal.sgsart.charAt(2) === 'D';
    if(c.dealType === 'NDF' && !isNdf) return;                           // RR1
    if(c.dealType === 'DELIVERABLE' && isNdf) return;                    // RR2
    if(c.pair && deal.cpair !== c.pair) return;                          // P_CURR
    out.push(valuateTransaction(deal, c.keyIso, months));
  });
  return out;
}

function getAccountingConfig(row){
  var type = row.vGl < 0 ? 'ML' : 'MG';
  var ndf = row.sgsart.charAt(2) === 'D' ? 'X' : '';
  for(var i = 0; i < db.accConfig.length; i++){
    var c = db.accConfig[i];
    if(c.type === type && c.zndf === ndf && c.zbukrs === row.bukrs) return c;
  }
  return null;
}

// POST_DOCUMNET -> BAPI_ACC_DOCUMENT_POST (+ reversal) mock. Returns message rows (GT_MSG).
function postMtmDocument(row, keyIso){
  var msgs = [];
  var cfg = getAccountingConfig(row);
  if(!cfg) return msgs;                       // source: CX_SY_ITAB_LINE_NOT_FOUND is caught silently
  var deal = null;
  for(var i = 0; i < db.deals.length; i++){ if(db.deals[i].rfha === row.rfha && db.deals[i].bukrs === row.bukrs) deal = db.deals[i]; }
  if(deal && deal.bapiError){
    msgs.push({ ok:false, rfha:row.rfha, doc:'', diff:row.vGl, message:deal.bapiError, cRate:row.cRate });
    return msgs;
  }
  var doc = String(db.docSeq++);
  msgs.push({ ok:true, rfha:row.rfha, doc:doc, diff:row.vGl, message:'Document Posted Successfully', cRate:row.cRate });
  var rev = String(db.docSeq++);              // BAPI_ACC_DOCUMENT_REV_POST, posting date = key date + 1
  msgs.push({ ok:true, rfha:row.rfha, doc:rev, diff:row.vGl, message:'Document Posted Successfully', cRate:row.cRate });
  db.mtmData.push({ ztype:'01', zbukrs:row.bukrs, zrfha:row.rfha, zdate:keyIso, zdoc:doc, zrev_doc:rev,
                    zmsg:'Document Posted Successfully', zcreated_by:CURRENT_USER });
  return msgs;
}

// GET_MONTH: next 60 month ends after the key date with +/- window (TVARV days)
function buildMtmMonths(keyIso){
  var y = +keyIso.slice(0,4), m = +keyIso.slice(5,7), out = [];
  for(var i = 1; i <= 60; i++){
    var mm = m + i, yy = y + Math.floor((mm - 1) / 12), mo = ((mm - 1) % 12) + 1;
    var end = lastDayOfMonthISO(yy, mo);
    out.push({ zmonth:i, zmonthDate:end, lowDate:addDaysISO(end, -MTM_WINDOW_DAYS), highDate:addDaysISO(end, MTM_WINDOW_DAYS) });
  }
  return out;
}

// SWAP_CALC: tenor bracketing + month-bucket interpolation (same rules as the ABAP)
function calculateSwap(pair, keyIso, valueIso, months){
  var vm = null;
  for(var i = 0; i < months.length; i++){ if(months[i].zmonthDate.slice(0,7) === valueIso.slice(0,7)){ vm = months[i]; break; } }
  if(!vm) return { swap:0, month:0 };
  var month = vm.zmonth;
  var noDays = diffDays(vm.zmonthDate, keyIso);
  var curve = swapCurveFor(pair, keyIso);
  var low = null, high = null;
  curve.forEach(function(t){
    if(t.dlfz <= noDays) low = t;
    else if(!high) high = t;
  });
  low = low || { dlfz:0, kkurs:0 };
  high = high || { dlfz:0, kkurs:0 };
  function bucketFor(dateIso){
    for(var j = 0; j < months.length; j++){
      if(months[j].lowDate < dateIso && dateIso < months[j].highDate) return months[j].zmonth;
    }
    return 0;
  }
  var b = bucketFor(addDaysISO(keyIso, low.dlfz));
  var b1 = bucketFor(addDaysISO(keyIso, high.dlfz));
  var swap = 0;
  if(month === b) swap = low.kkurs;
  else if(month === b1) swap = high.kkurs;
  else if(month > b && month <= b1){
    var perMonth = (high.kkurs - low.kkurs) / (b1 - b);
    swap = low.kkurs + perMonth * (month - b);
  } else if(month > b1) swap = low.kkurs;
  return { swap:round6(swap), month:month };
}

// CALC_FOREX_CURRENCY_AMOUNT: foreign amount -> USD at a rate (direction from the pair)
function convertToUsd(fAmt, rate, tCurr1){
  if(!rate) return 0;
  return round2(tCurr1 === 'USD' ? fAmt * rate : fAmt / rate);
}

// Per-transaction derivation inside the GET_DATA loop
function valuateTransaction(deal, keyIso, months){
  var r = {};
  for(var k in deal){ if(deal.hasOwnProperty(k)) r[k] = deal[k]; }
  r.key = deal.bukrs + '|' + deal.rfha;

  if(deal.curr1 === deal.zwaers){ r.fAmt = Math.abs(deal.amt2); r.fCurr = deal.curr2; }
  else { r.fAmt = Math.abs(deal.amt1); r.fCurr = deal.curr1; }

  r.bsBu = deal.bsO === '1' ? 'Sell' : 'Buy';
  r.ccAmt = convertToUsd(r.fAmt, deal.cRate, deal.t_curr1);
  r.vSpot = spotAt(db, deal.cpair, keyIso);
  var sw = calculateSwap(deal.cpair, keyIso, deal.delfz, months);
  r.vSwap = sw.swap;
  r.monat = sw.month;
  r.vRate = round6(r.vSpot + r.vSwap);
  r.vAmt = convertToUsd(r.fAmt, r.vRate, deal.t_curr1);

  var gl = 0;
  if(r.vAmt !== 0) gl = round2(r.vAmt - r.ccAmt);
  gl = Math.abs(gl);
  var lvBs = deal.curr1 === r.fCurr ? deal.bs1 : deal.bs2;
  if(lvBs === 'Buy'){
    if(deal.cRate >= r.vRate && gl !== 0) gl = -gl;
  } else {
    if(!(deal.cRate >= r.vRate) && gl !== 0) gl = -gl;
  }
  r.vGl = gl;
  r.month = MONTH_SHORT[+deal.delfz.slice(5,7) - 1] + ' ' + deal.delfz.slice(0,4);

  var mtm = findMtmData(db, deal.bukrs, deal.rfha, keyIso);
  r.mtmDoc = mtm ? mtm.zdoc : '';
  r.revDoc = mtm ? mtm.zrev_doc : '';
  r.msg = mtm ? mtm.zmsg : '';
  return r;
}

// Source: POST is processed only when MTM_DOC is initial and V_GL is not initial
function isPostable(row){ return !!row && !row.mtmDoc && row.vGl !== 0; }

// FB03 stand-in: rebuild the two-line posting from the BAPI input logic (HEADER_DATA / DEBIT / CREDIT)
function buildDocumentView(row, which){
  var cfg = getAccountingConfig(row);
  var isRev = which === 'rev';
  var keyIso = state.keyIso;
  var postIso = isRev ? addDaysISO(keyIso, 1) : keyIso;
  var abs = Math.abs(row.vGl);
  function gl(n){ return padLeft(n, 10, '0'); }
  var items = [];
  if(cfg){
    items.push({ item:1, gl:gl(cfg.glDebit),  pc:cfg.pcDebit  || row.prctr, ba:cfg.baDebit  || row.rbusa,
                 text:cfg.docDebit + ':' + row.xtext,  amount: isRev ? -abs :  abs });
    items.push({ item:2, gl:gl(cfg.glCredit), pc:cfg.pcCredit || row.prctr, ba:cfg.baCredit || row.rbusa,
                 text:cfg.docCredit + ':' + row.xtext, amount: isRev ?  abs : -abs });
  }
  return {
    docNo: isRev ? row.revDoc : row.mtmDoc,
    bukrs: row.bukrs,
    fiscalYear: postIso.slice(0,4),
    docType:'TR',
    docDate:postIso, postingDate:postIso,
    reference:row.rfha,
    headerText: cfg ? cfg.docHeader : '',
    user:CURRENT_USER, currency:row.zwaers,
    reversalOf: isRev ? row.mtmDoc : '',
    items:items
  };
}

function cellText(col, r){
  if(col.fmt) return col.fmt(r);
  var v = col.get(r);
  return v === null || v === undefined ? '' : String(v);
}
function visibleColumns(){
  var set = layoutColumnSets[state.layout];
  if(!set) return COLUMNS.slice();
  return COLUMNS.filter(function(c){ return set.indexOf(c.key) >= 0; });

function criteria(){
  return {
    keyIso:state.keyIso, companies:state.companies, rfhaRanges:parseRfhaFilter(state.rfhaText),
    bp:state.bp, pair:state.pair, dealType:state.dealType
  };
}
function selectionReady(){ return !state.keyDateError && state.companies.length > 0; }

function loadRows(){
  state.rows = selectionReady() ? getFxTransactions(criteria()) : [];
  var found = false;
  state.rows.forEach(function(r){ if(r.key === state.selectedKey) found = true; });
  if(!found) state.selectedKey = null;
}

function getSelectedRow(){
  for(var i = 0; i < state.rows.length; i++){ if(state.rows[i].key === state.selectedKey) return state.rows[i]; }
  return null;
}

function getViewRows(cols){
  var q = state.search.trim().toLowerCase();
  var list = state.rows.filter(function(r){
    if(!q) return true;
    for(var i = 0; i < cols.length; i++){
      if(cellText(cols[i], r).toLowerCase().indexOf(q) >= 0) return true;
    }
    return false;
  });
  if(state.sort.field){
    var col = null;
    cols.forEach(function(c){ if(c.key === state.sort.field) col = c; });
    if(col){
      var dir = state.sort.dir === 'asc' ? 1 : -1;
      list = list.slice().sort(function(a, b){
        var x = col.sortVal ? col.sortVal(a) : col.get(a);
        var y = col.sortVal ? col.sortVal(b) : col.get(b);
        if(col.type === 'num'){ x = Number(x) || 0; y = Number(y) || 0; return (x - y) * dir; }
        x = String(x).toLowerCase(); y = String(y).toLowerCase();
        return x < y ? -dir : (x > y ? dir : 0);
      });
    }
  }
  return list;
}

function renderHeaderSub(){

function renderHead(cols){
  var h = '<tr><th class="no-sort c-chk" aria-label="Select"></th>';
  cols.forEach(function(c){
    var cls = [];
    if(c.type === 'num') cls.push('num');
    if(c.cls) cls.push(c.cls);
    if(c.group) cls.push('g-' + c.group);
    if(state.sort.field === c.key) cls.push('sorted');
    var tip = c.group === 'ext' ? 'Transaction data - external' : (c.group === 'mtm' ? 'MTM data' : '');
    var ind = state.sort.field === c.key ? (state.sort.dir === 'asc' ? '\u25B2' : '\u25BC') : '\u21C5';
    h += '<th class="' + cls.join(' ') + '" data-sort="' + c.key + '"' + (tip ? ' title="' + tip + '"' : '') + '>' +
         esc(c.label) + '<span class="sort-ind">' + ind + '</span></th>';
  });
  h += '</tr>';
  byId('tableHead').innerHTML = h;
}

function renderBody(cols, pageRows){
  var h = '';
  pageRows.forEach(function(r){
    h += '<tr data-key="' + esc(r.key) + '" draggable="true">';
    h += '<td class="c-chk"><input type="checkbox" class="row-select-checkbox" data-key="' + esc(r.key) + '" aria-label="Select transaction ' + esc(r.rfha) + '"></td>';
    cols.forEach(function(c){
      var cls = [];
      if(c.type === 'num') cls.push('num');
      if(c.cls) cls.push(c.cls);
      if(c.group) cls.push('g-' + c.group);
      var txt = cellText(c, r);
      var inner = esc(txt);
      if(c.signed){ if(r.vGl < 0) cls.push('neg'); else if(r.vGl > 0) cls.push('pos'); }
      if(c.msgOk && txt) cls.push('msg-ok');
      if(c.link && txt){
        inner = '<span class="mc-link" data-link="' + c.link + '" data-key="' + esc(r.key) + '" role="link" tabindex="0">' + esc(txt) + '</span>';
      }
      h += '<td class="' + cls.join(' ') + '">' + inner + '</td>';
    });
    h += '</tr>';
  });
  byId('tableBody').innerHTML = h;
}

function renderPagination(pageCount){
  var el = byId('pagination');
  el.innerHTML = '';
  function btn(label, disabled, active, handler){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.disabled = !!disabled;
    if(active) b.classList.add('active');
    b.addEventListener('click', handler);
    el.appendChild(b);
  }
  btn('\u2039', state.page <= 1, false, function(){ state.page--; renderTable(); });
  var pages = [];
  for(var p = 1; p <= pageCount; p++){
    if(pageCount <= 7 || p === 1 || p === pageCount || Math.abs(p - state.page) <= 1) pages.push(p);
    else if(pages[pages.length - 1] !== '...') pages.push('...');
  }
  pages.forEach(function(p){
    if(p === '...'){
      var s = document.createElement('span'); s.className = 'ellipsis'; s.textContent = '\u2026'; el.appendChild(s);
    } else {
      (function(p){ btn(String(p), false, p === state.page, function(){ state.page = p; renderTable(); }); })(p);
    }
  });
  btn('\u203A', state.page >= pageCount, false, function(){ state.page++; renderTable(); });
}

function renderTable(){
  var cols = visibleColumns();
  var sortOk = false;
  cols.forEach(function(c){ if(c.key === state.sort.field) sortOk = true; });
  if(!sortOk) state.sort.field = '';

  var list = getViewRows(cols);
  var total = list.length;
  var pageCount = Math.max(1, Math.ceil(total / state.pageSize));
  if(state.page > pageCount) state.page = pageCount;
  if(state.page < 1) state.page = 1;
  var startIdx = (state.page - 1) * state.pageSize;
  var pageRows = list.slice(startIdx, startIdx + state.pageSize);

  renderHead(cols);
  renderBody(cols, pageRows);

  var empty = total === 0;
  byId('emptyState').style.display = empty ? '' : 'none';
  byId('tableScroll').style.display = empty ? 'none' : '';
  if(empty){
    byId('emptyText').textContent = state.keyDateError
      ? 'Enter a valid month-end Key Date to load transactions.'
      : (state.companies.length === 0
          ? 'Select at least one company code to load transactions.'
          : 'No transactions match your search or filters.');
  }
  byId('resultCount').textContent = state.rows.length + (state.rows.length === 1 ? ' transaction' : ' transactions');
  byId('showingText').textContent = total ? ('Showing ' + (startIdx + 1) + '\u2013' + (startIdx + pageRows.length) + ' of ' + total) : '';
  renderPagination(pageCount);
  applySelection();
  renderHeaderSub();
  updateActions();
}

function applySelection(){
  var rows = byId('tableBody').querySelectorAll('tr');
  for(var i = 0; i < rows.length; i++){
    var key = rows[i].getAttribute('data-key');
    var sel = key === state.selectedKey;
    if(sel) rows[i].classList.add('selected'); else rows[i].classList.remove('selected');
    var cb = rows[i].querySelector('.row-select-checkbox');
    if(cb) cb.checked = sel;
  }
}

function updateActions(){
  var row = getSelectedRow();
  var ok = isPostable(row);
  var btn = byId('btnPost');
  btn.disabled = !ok;
  btn.title = ok ? '' : (row ? 'Only transactions without an MTM document and with a valuation gain/loss can be posted'
                             : 'Select a transaction first');
  var exec = byId('btnExecute');
  var postMode = state.postingType === 'POST';
  exec.classList.toggle('hidden', !postMode);
  var n = 0;
  state.rows.forEach(function(r){ if(isPostable(r)) n++; });
  exec.disabled = !(postMode && n > 0);
  exec.textContent = 'Execute Posting' + (postMode ? ' (' + n + ')' : '');
  exec.title = n > 0 ? 'Posts all unposted transactions in the current selection' : 'No unposted transactions in the selection';
}

  });
  state.msgLog = msgs;
  if(msgs.length){
    loadRows();
    renderTable();
    openMessageLog(msgs);
  }
}

/* =========================================================
   9. UI COMPONENTS
   ========================================================= */
var openPanels = [];
function closeAllPanels(except){
  openPanels.forEach(function(p){ if(p.root !== except) p.close(); });
}

// Single-value dropdown (optionally searchable)
function createDropdown(rootId, cfg){
  var root = byId(rootId);
  var input = root.querySelector('.dd-input');
  var panel = root.querySelector('.dd-panel');
  var items = cfg.items || [];
  var value = cfg.value || '';
  var activeIdx = -1;
  var searchable = !!cfg.searchable;
  if(!searchable) input.readOnly = true;

  function labelFor(v){
    for(var i = 0; i < items.length; i++){ if(items[i].value === v) return v === '' ? '' : items[i].label; }
    return '';
  }
  function filtered(q){
    q = (q || '').toLowerCase();
    return items.filter(function(it){
      return !q || (it.label + ' ' + (it.secondary || '')).toLowerCase().indexOf(q) >= 0;
    });
  }
  function renderPanel(q){
    var list = filtered(q);
    var h = '';
    list.forEach(function(it, i){
      h += '<div class="dd-item' + (i === activeIdx ? ' active' : '') + '" data-v="' + esc(it.value) + '">' +
           '<span class="primary-line">' + esc(it.label) + '</span>' +
           (it.secondary ? '<span class="secondary-line">' + esc(it.secondary) + '</span>' : '') + '</div>';
    });
    panel.innerHTML = h || '<div class="dd-empty">No matches</div>';
  }
  function open(){
    closeAllPanels(root);
    activeIdx = -1;
    renderPanel('');
    root.classList.add('open');
  }
  function close(){
    root.classList.remove('open');
    input.value = labelFor(value);
  }
  function select(v){
    value = v;
    input.value = labelFor(v);
    root.classList.remove('open');
    if(cfg.onChange) cfg.onChange(v);
  }
  var api = {
    root:root, close:close,
    setValue:function(v){ value = v; input.value = labelFor(v); },
    getValue:function(){ return value; },
    setItems:function(list){ items = list; input.value = labelFor(value); }
  };
  openPanels.push(api);

  input.addEventListener('click', function(e){
    e.stopPropagation();
    if(root.classList.contains('open')){ if(!searchable) close(); } else open();
  });
  input.addEventListener('focus', function(){ if(searchable && !root.classList.contains('open')) open(); });
  input.addEventListener('input', function(){
    if(!searchable) return;
    activeIdx = -1;
    renderPanel(input.value);
    root.classList.add('open');
  });
  input.addEventListener('keydown', function(e){
    var list = filtered(searchable && root.classList.contains('open') ? input.value : '');
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(!root.classList.contains('open')) open();
      activeIdx = e.key === 'ArrowDown' ? Math.min(list.length - 1, activeIdx + 1) : Math.max(0, activeIdx - 1);
      renderPanel(searchable ? input.value : '');
    } else if(e.key === 'Enter'){
      if(root.classList.contains('open') && activeIdx >= 0 && list[activeIdx]){ e.preventDefault(); select(list[activeIdx].value); }
      else if(!root.classList.contains('open')){ open(); }
    } else if(e.key === 'Escape'){ close(); }
  });
  panel.addEventListener('mousedown', function(e){ e.preventDefault(); });
  panel.addEventListener('click', function(e){
    e.stopPropagation();
    var el = e.target;
    while(el && el !== panel && !el.getAttribute('data-v') && el.getAttribute('data-v') !== ''){ el = el.parentNode; }
    if(el && el !== panel && el.hasAttribute('data-v')) select(el.getAttribute('data-v'));
  });
  input.value = labelFor(value);
  return api;
}

// Multi-select with checkboxes (Company Code select-option)
function createMultiSelect(rootId, cfg){
  var root = byId(rootId);
  var input = root.querySelector('.dd-input');
  var panel = root.querySelector('.dd-panel');
  var items = cfg.items;
  var selected = cfg.value.slice();

  function display(){
    if(selected.length === 0) input.value = '';
    else if(selected.length === items.length) input.value = 'All (' + items.length + ')';
    else input.value = selected.join(', ');
  }
  function renderPanel(){
    var h = '<div class="ms-actions"><button type="button" class="btn btn-ghost" data-ms="all">Select all</button>' +
            '<button type="button" class="btn btn-ghost" data-ms="none">Clear</button></div>';
    items.forEach(function(it){
      h += '<label class="ms-item"><input type="checkbox" value="' + esc(it.value) + '"' +
           (selected.indexOf(it.value) >= 0 ? ' checked' : '') + '><span><span class="ms-main">' + esc(it.value) +
           '</span><br><span class="ms-sub">' + esc(it.label) + '</span></span></label>';
    });
    panel.innerHTML = h;
  }
  function changed(){ display(); if(cfg.onChange) cfg.onChange(selected.slice()); }
  function open(){ closeAllPanels(root); renderPanel(); root.classList.add('open'); }
  function close(){ root.classList.remove('open'); }
  var api = {
    root:root, close:close,
    setValue:function(v){ selected = v.slice(); display(); },
    getValue:function(){ return selected.slice(); }
  };
  openPanels.push(api);
  input.readOnly = true;
  input.addEventListener('click', function(e){
    e.stopPropagation();
    if(root.classList.contains('open')) close(); else open();
  });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ e.preventDefault(); open(); }
    else if(e.key === 'Escape'){ close(); }
  });
  panel.addEventListener('click', function(e){
    e.stopPropagation();
    var t = e.target;
    if(t.getAttribute && t.getAttribute('data-ms')){
      selected = t.getAttribute('data-ms') === 'all' ? items.map(function(i){ return i.value; }) : [];
      renderPanel(); changed();
    }
  });
  panel.addEventListener('change', function(e){
    var t = e.target;
    if(t.type !== 'checkbox') return;
    var v = t.value, idx = selected.indexOf(v);
    if(t.checked && idx < 0) selected.push(v);
    if(!t.checked && idx >= 0) selected.splice(idx, 1);
    selected.sort();
    changed();
  });
  display();
  return api;
}

// Segmented control replacing a radio-button group
function bindSegmented(id, onChange){
  var wrap = byId(id);
  wrap.addEventListener('click', function(e){
    var b = e.target;
    while(b && b !== wrap && b.tagName !== 'BUTTON'){ b = b.parentNode; }
    if(!b || b === wrap) return;
    setSegmented(id, b.getAttribute('data-value'));
    onChange(b.getAttribute('data-value'));
  });
}
function setSegmented(id, value){
  var btns = byId(id).querySelectorAll('button');
  for(var i = 0; i < btns.length; i++){
    var on = btns[i].getAttribute('data-value') === value;
    btns[i].classList.toggle('active', on);
    btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
}

/* ---- Key Date picker (custom inline calendar, same style as the reference) ---- */
var cal = { y:2026, m:8 };
function initKeyDatePicker(){
  var input = byId('input-keyDate'), popup = byId('popup-keyDate'), btn = byId('btnKeyDateIcon');
  var wrap = input.parentNode;

  function render(){
    var sel = dmyToISO(input.value);
    var first = new Date(Date.UTC(cal.y, cal.m, 1)).getUTCDay();
    var dim = +lastDayOfMonthISO(cal.y, cal.m + 1).slice(8,10);
    var prevDim = +lastDayOfMonthISO(cal.y, cal.m).slice(8,10);
    var mOpts = '', yOpts = '';
    for(var i = 0; i < 12; i++) mOpts += '<option value="' + i + '"' + (i === cal.m ? ' selected' : '') + '>' + MONTH_SHORT[i] + '</option>';
    for(var y = 2024; y <= 2030; y++) yOpts += '<option value="' + y + '"' + (y === cal.y ? ' selected' : '') + '>' + y + '</option>';
    var h = '<div class="cal-head"><button type="button" data-nav="-1" aria-label="Previous month">\u2039</button>' +
            '<span class="cal-selects"><select data-cal="m" aria-label="Month">' + mOpts + '</select><select data-cal="y" aria-label="Year">' + yOpts + '</select></span>' +
            '<button type="button" data-nav="1" aria-label="Next month">\u203A</button></div><div class="cal-grid">';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){ h += '<div class="dow">' + d + '</div>'; });
    for(var p = 0; p < first; p++) h += '<div class="day muted">' + (prevDim - first + 1 + p) + '</div>';
    for(var d = 1; d <= dim; d++){
      var iso = cal.y + '-' + pad2(cal.m + 1) + '-' + pad2(d);
      var cls = 'day';
      if(d === dim) cls += ' eom';
      if(iso === sel) cls += ' selected';
      if(iso === AS_OF_ISO) cls += ' today';
      h += '<div class="' + cls + '" data-day="' + d + '">' + d + '</div>';
    }
    var trailing = (7 - ((first + dim) % 7)) % 7;
    for(var t = 1; t <= trailing; t++) h += '<div class="day muted">' + t + '</div>';
    h += '</div><div class="cal-legend"><i></i>Month end dates</div>';
    popup.innerHTML = h;
  }
  function open(){
    closeAllPanels(null);
    var d = dmyToISO(input.value) || AS_OF_ISO;      // initialise view ONLY when opening
    cal.y = +d.slice(0,4); cal.m = +d.slice(5,7) - 1;
    render();
    popup.classList.add('open');
  }
  function close(){ popup.classList.remove('open'); }
  openPanels.push({ root:wrap, close:close });

  btn.addEventListener('click', function(e){ e.stopPropagation(); if(popup.classList.contains('open')) close(); else open(); });
  input.addEventListener('click', function(e){ e.stopPropagation(); if(!popup.classList.contains('open')) open(); });
  popup.addEventListener('click', function(e){
    e.stopPropagation();
    var t = e.target;
    var nav = t.getAttribute && t.getAttribute('data-nav');
    if(nav){
      cal.m += parseInt(nav, 10);
      if(cal.m < 0){ cal.m = 11; cal.y--; } else if(cal.m > 11){ cal.m = 0; cal.y++; }
      render();
      return;
    }
    var day = t.getAttribute && t.getAttribute('data-day');
    if(day){
      input.value = isoToDMY(cal.y + '-' + pad2(cal.m + 1) + '-' + pad2(+day));
      close();
      applyKeyDateText(input.value);
    }
  });
  popup.addEventListener('change', function(e){
    e.stopPropagation();
    var t = e.target, which = t.getAttribute('data-cal');
    if(which === 'm') cal.m = parseInt(t.value, 10);
    if(which === 'y') cal.y = parseInt(t.value, 10);
    render();
  });
}

// PAI: date validation (month end only) -> live reload when valid
function applyKeyDateText(text){
  var field = byId('field-keyDate'), err = byId('err-keyDate');
  var raw = String(text || '').trim();
  var msg = '';
  var iso = null;
  if(!raw) msg = 'Key Date is required.';
  else {
    iso = dmyToISO(raw);
    if(!iso) msg = 'Enter a valid date (DD-MM-YYYY).';
    else if(!isMonthEndISO(iso)) msg = 'Key Date should be Month End Date only.';
  }
  state.keyDateText = raw;
  state.keyDateError = msg;
  field.classList.toggle('has-error', !!msg);
  err.textContent = msg;
  if(!msg) state.keyIso = iso;
  reloadAndRender();
}

/* =========================================================
   10. EVENT WIRING
   ========================================================= */
var controls = {};
var draggedKey = null;

function buildControls(){
  controls.company = createMultiSelect('ms-company', {
    items: mockCompanies.map(function(c){ return { value:c.bukrs, label:c.name }; }),
    value: state.companies,
    onChange:function(list){
      state.companies = list;
      byId('field-company').classList.toggle('has-error', list.length === 0);
      reloadAndRender();
    }
  });
  var bpItems = [{ value:'', label:'All' }].concat(mockPartners.map(function(p){ return { value:p.id, label:p.name, secondary:p.id }; }));
  controls.bp = createDropdown('dd-bp', { items:bpItems, searchable:true, onChange:function(v){ state.bp = v; reloadAndRender(); } });
  var pairItems = [{ value:'', label:'All' }].concat(mockCurrencyPairs.map(function(p){ return { value:p.pair, label:p.pair }; }));
  controls.pair = createDropdown('dd-pair', { items:pairItems, onChange:function(v){ state.pair = v; reloadAndRender(); } });
  controls.layout = createDropdown('dd-layout', { items:layoutVariants, onChange:function(v){ state.layout = v; state.page = 1; renderTable(); } });
  initKeyDatePicker();
}

function syncControlsFromState(){
  byId('input-keyDate').value = state.keyDateText;
  byId('field-keyDate').classList.toggle('has-error', !!state.keyDateError);
  byId('err-keyDate').textContent = state.keyDateError;
  byId('field-company').classList.toggle('has-error', state.companies.length === 0);
  controls.company.setValue(state.companies);
  byId('input-rfha').value = state.rfhaText;
  controls.bp.setValue(state.bp);
  controls.pair.setValue(state.pair);
  controls.layout.setValue(state.layout);
  setSegmented('seg-dealType', state.dealType);
  setSegmented('seg-postingType', state.postingType);
  byId('tableSearch').value = state.search;
  byId('pageSizeSelect').value = String(state.pageSize);
}

// Reset: filters / search / sort / paging / selection back to the initial screen state (data kept)
function resetFilters(){
  var keepPageSize = state.pageSize;
  var d = defaultState();
  state.keyDateText = d.keyDateText; state.keyIso = d.keyIso; state.keyDateError = '';
  state.companies = d.companies; state.rfhaText = ''; state.bp = ''; state.pair = '';
  state.dealType = 'ALL'; state.postingType = 'VIEW'; state.layout = '';
  state.search = ''; state.sort = { field:'', dir:'asc' }; state.page = 1; state.pageSize = keepPageSize;
  state.selectedKey = null;
  syncControlsFromState();
  loadRows();
  renderTable();
}

// Refresh: restore the whole demo (data mutations included)
function refreshAll(){
  db = createMockDb();
  closeAllModals();
  state = defaultState();
  syncControlsFromState();
  loadRows();
  renderTable();
}

function selectRow(key, toggle){
  state.selectedKey = (toggle && state.selectedKey === key) ? null : key;
  applySelection();
  updateActions();
}

function wireEvents(){
  byId('btnRefresh').addEventListener('click', refreshAll);
  byId('btnResetFilters').addEventListener('click', resetFilters);
  byId('btnPost').addEventListener('click', actionPostDocument);
  byId('btnExecute').addEventListener('click', actionExecutePosting);

  byId('tableSearch').addEventListener('input', function(e){ state.search = e.target.value; state.page = 1; renderTable(); });

  var keyInput = byId('input-keyDate');
  keyInput.addEventListener('input', function(){
    var v = keyInput.value;
    if(/^\d{8}$/.test(v)){ keyInput.value = v.slice(0,2) + '-' + v.slice(2,4) + '-' + v.slice(4); v = keyInput.value; }
    if(v.length === 10) applyKeyDateText(v);
  });
  keyInput.addEventListener('change', function(){ applyKeyDateText(keyInput.value); });
  keyInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ applyKeyDateText(keyInput.value); } });

  var rfhaTimer = null;
  byId('input-rfha').addEventListener('input', function(e){
    state.rfhaText = e.target.value;
    clearTimeout(rfhaTimer);
    rfhaTimer = setTimeout(reloadAndRender, 150);
  });

  bindSegmented('seg-dealType', function(v){ state.dealType = v; reloadAndRender(); });
  bindSegmented('seg-postingType', function(v){ state.postingType = v; updateActions(); });

  byId('pageSizeSelect').addEventListener('change', function(e){ state.pageSize = parseInt(e.target.value, 10); state.page = 1; renderTable(); });

  // header sorting (delegated; header is re-rendered)
  byId('tableHead').addEventListener('click', function(e){
    var th = e.target;
    while(th && th.tagName !== 'TH'){ th = th.parentNode; }
    if(!th || !th.getAttribute('data-sort')) return;
    var key = th.getAttribute('data-sort');
    if(state.sort.field === key) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort.field = key; state.sort.dir = 'asc'; }
    renderTable();
  });

  // row selection + hotspots (delegated)
  var tbody = byId('tableBody');
  tbody.addEventListener('click', function(e){
    var t = e.target;
    var link = t.getAttribute && t.getAttribute('data-link') ? t : null;
    var tr = t;
    while(tr && tr !== tbody && tr.tagName !== 'TR'){ tr = tr.parentNode; }
    if(!tr || tr === tbody) return;
    var key = tr.getAttribute('data-key');
    if(t.classList && t.classList.contains('row-select-checkbox')){ selectRow(key, true); return; }
    selectRow(key, false);
    if(link){
      var row = null;
      state.rows.forEach(function(r){ if(r.key === key) row = r; });
      if(!row) return;
      var kind = link.getAttribute('data-link');
      if(kind === 'rfha') openTransactionDetails(row);
      else if(kind === 'mtm' && row.mtmDoc) openDocument(row, 'mtm');
      else if(kind === 'rev' && row.revDoc) openDocument(row, 'rev');
    }
  });
  tbody.addEventListener('keydown', function(e){
    if((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-link')){
      e.preventDefault(); e.target.click();
    }
  });

  // drag a row onto "Post Document" == select row + click the button
  tbody.addEventListener('dragstart', function(e){
    var tr = e.target;
    while(tr && tr !== tbody && tr.tagName !== 'TR'){ tr = tr.parentNode; }
    if(!tr || tr === tbody) return;
    draggedKey = tr.getAttribute('data-key');
    state.selectedKey = draggedKey;
    applySelection(); updateActions();
    tr.classList.add('dragging');
    var row = getSelectedRow();
    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = row ? row.rfha + ' \u2014 ' + row.cpair : 'Transaction';
    document.body.appendChild(ghost);
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'copy';
      try{ e.dataTransfer.setData('text/plain', draggedKey); }catch(err){}
      if(e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(ghost, 12, 14);
    }
    setTimeout(function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
    if(isPostable(row)) byId('dropPost').classList.add('drop-ready');
  });
  tbody.addEventListener('dragend', function(){
    draggedKey = null;
    var rows = tbody.querySelectorAll('tr.dragging');
    for(var i = 0; i < rows.length; i++) rows[i].classList.remove('dragging');
    byId('dropPost').classList.remove('drop-ready');
    byId('btnPost').classList.remove('drag-over');
  });
  var drop = byId('dropPost');
  drop.addEventListener('dragover', function(e){
    if(!draggedKey) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    if(isPostable(getSelectedRow())) byId('btnPost').classList.add('drag-over');
  });
  drop.addEventListener('dragleave', function(){ byId('btnPost').classList.remove('drag-over'); });
  drop.addEventListener('drop', function(e){
    e.preventDefault();
    byId('btnPost').classList.remove('drag-over');
    drop.classList.remove('drop-ready');
    if(!draggedKey) return;
    if(isPostable(getSelectedRow())) actionPostDocument();
    else showToast('This transaction is already posted or has no valuation gain/loss.', true);
  });

  // modal close buttons + overlay click + Esc
  var closers = document.querySelectorAll('[data-close]');
  for(var i = 0; i < closers.length; i++){
    (function(el){ el.addEventListener('click', function(){ closeModal(el.getAttribute('data-close')); }); })(closers[i]);
  }
  ['msgLogModal','docModal','txnModal'].forEach(function(id){
    byId(id).addEventListener('mousedown', function(e){ if(e.target === byId(id)) closeModal(id); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    var anyOpen = false;
    openPanels.forEach(function(p){ if(p.root.classList.contains('open') || (p.root.querySelector && p.root.querySelector('.date-popup.open'))) anyOpen = true; });
    closeAllPanels(null);
    if(anyOpen) return;
    ['docModal','txnModal','msgLogModal'].forEach(function(id){ closeModal(id); });
  });
  document.addEventListener('click', function(){ closeAllPanels(null); });
}

/* =========================================================
   11. INITIALISATION
   ========================================================= */
function init(){
  db = createMockDb();
  state = defaultState();
  buildControls();
  wireEvents();
  syncControlsFromState();
  loadRows();
  renderTable();
}
init();

})();
