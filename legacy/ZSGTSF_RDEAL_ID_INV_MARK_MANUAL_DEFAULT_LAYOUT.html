}

.modal-overlay {

}
.modal {

}
.modal-head {

.modal-title-row {

}
.modal-title {

}
.modal-close {

.info-grid {

  flex-wrap: wrap;
  margin: -5px;
}
.info-item {
  width: 33.333%;
  padding: 5px;
}
.info-card {

}
.info-label {

}
.info-value {
  color: #20384f;
  font-size: 13px;
  font-weight: 600;

  word-break: break-word;
}
.modal-foot {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 17px;
  border-top: 1px solid #e1e7ed;
  background: #fbfcfd;
}
.toast-stack {
  position: fixed;
  right: 18px;
  top: 72px;
  z-index: 80;
}
.toast {
  min-width: 315px;
  max-width: 430px;
  gap: 10px;
  margin-bottom: 8px;
  padding: 11px 13px;
  border-radius: 6px;
  border: 1px solid #b9ddca;
  background: #f1fbf5;
  color: #205c3b;
  box-shadow: 0 7px 22px rgba(31, 65, 48, 0.14);
  animation: toastIn 180ms ease-out;
}
.toast.info {
  border-color: #bfd6ec;
  background: #f3f8fd;
  color: #245475;
}
.toast.warn {
  border-color: #f0d5ad;
  background: #fff8ec;
  color: #7c551b;
}
.toast-icon {
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  border-radius: 50%;
  background: #27ae60;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.toast.info .toast-icon {
  background: #2d81c4;
}
.toast.warn .toast-icon {
  background: #e39a2b;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-5px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 1100px) {
  .brand-code {
    display: none;
  }
  .filter-toolbar {
    align-items: flex-end;
  }
  .table-scroll {
    max-height: none;
  }
}
@media (max-width: 760px) {
  .topbar {
    padding-left: 10px;
    padding-right: 10px;
  }
  .top-left {
    gap: 8px;
  }
  .brand-title {
    font-size: 16px;
  }
  .live-dot {
    display: none;
  }
  .header-btn span {
    display: none;
  }
  .header-btn {
    width: 38px;
    padding: 0;
  }
  .header-btn svg {
    margin: 0;
  }
  .main {
    padding: 9px;
  }
  .table-title-row {
    align-items: stretch;
    flex-direction: column;
  }
  .table-tools,
  .search-wrap {
    width: 100%;
  }
  .search-wrap {
    flex: 1;
  }
  .legend {
    overflow-x: auto;
  }
  .info-item {
    width: 50%;
  }
}

/* Embedded ZSGTSF_RVIEW_DEAL workspace opened from Deal ID hotspot. */
.modal-deal {
  width: 1440px;
  max-width: 97vw;
  max-height: 92vh;
}
.modal-deal .modal-body {
  max-height: calc(92vh - 108px);
  padding: 12px 14px 14px;
  background: #f5f8fb;
}
.modal-deal .modal-foot {
  background: #ffffff;
}
.deal-workspace {
  min-width: 0;
}
.deal-actionbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 10px;
}
.deal-action-btn {
  height: 34px;
  padding: 0 12px;
  border: 1px solid #aebdcc;
  border-radius: 5px;
  background: #ffffff;
  color: #405b74;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.deal-action-btn:hover {
  border-color: #7799b8;
  background: #f6f9fc;
}
.deal-action-btn.primary-action {
  border-color: #1269bd;
  background: #0f6fcf;
  color: #ffffff;
}
.deal-section {
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid #d9e2ea;
  border-radius: 7px;
  background: #ffffff;
  box-shadow: 0 1px 3px rgba(28, 52, 75, 0.04);
}
.deal-section:first-child {
  margin-top: 0;
}
.deal-section-head {
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 12px;
  border-bottom: 1px solid #e1e7ed;
  color: #263d54;
  font-size: 13px;
  font-weight: 750;
}
.deal-section-meta {
  color: #75899c;
  font-size: 11px;
  font-weight: 500;
}
.deal-basic-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px 12px;
  padding: 12px;
}
.deal-field {
  min-width: 0;
}
.deal-field.wide {
  grid-column: span 2;
}
.deal-field-label {
  display: block;
  margin-bottom: 4px;
  color: #60788f;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.2px;
}
.deal-field-box {
  min-height: 35px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  overflow: hidden;
  border: 1px solid #cfd9e2;

  function deepCopyRows(rows) {
    var out = [];
    var i;
    for (i = 0; i < rows.length; i += 1) {
      out.push(copyObject(rows[i]));
    }
    return out;
  }

  function copyObject(obj) {
    var target = {};
    var key;
    for (key in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) {
        target[key] = obj[key];
      }
    }
    return target;
  }

  function parseDate(value) {
    var match;
    var day;
    var month;
    var year;
    var d;
    if (!value) {
      return null;
    }
    match = /^(\d{2})-(\d{2})-(\d{4})$/.exec(value);
    if (!match) {
      return null;
    }
    day = parseInt(match[1], 10);
    month = parseInt(match[2], 10) - 1;
    year = parseInt(match[3], 10);
    d = new Date(year, month, day);
    if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) {
      return null;
    }
    return d;
  }

  function formatDate(date) {
    var d = date.getDate();
    var m = date.getMonth() + 1;
    return pad2(d) + '-' + pad2(m) + '-' + date.getFullYear();
  }

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function addDays(dateValue, days) {
    var d = parseDate(dateValue);
    if (!d) {
      return '';
    }
    d.setDate(d.getDate() + days);
    return formatDate(d);
  }

  function dateDiff(dateValue, baseDate) {
    var d = parseDate(dateValue);
    var oneDay = 86400000;
    if (!d) {
      return 0;
    }
    return Math.round((d.getTime() - baseDate.getTime()) / oneDay);
  }

  function enrichRow(row) {
    row.earliestStart = addDays(row.dealEnd, -270);
    row.daysShip = dateDiff(row.shipStart, TODAY);
    row.daysEnd = dateDiff(row.dealEnd, TODAY);
    row.daysStart = dateDiff(row.dealStart, TODAY);
    return row;
  }

  function enrichAll(rows) {
    var i;
    for (i = 0; i < rows.length; i += 1) {
      enrichRow(rows[i]);
    }
  }

  function init() {
    initialData = buildInitialData();
    enrichAll(initialData);
    data = deepCopyRows(initialData);
    populateFilterOptions();
    renderAll();
    bindEvents();
  }

  function populateFilterOptions() {
    populateSelect('originFilter', uniqueValues(initialData, 'origin'));
    populateSelect('regionFilter', uniqueValues(initialData, 'region'));
    populateSelect('modelFilter', uniqueValues(initialData, 'model'));
  }

  function uniqueValues(rows, key) {
    var seen = {};
    var values = [];
    var i;
    var value;
    for (i = 0; i < rows.length; i += 1) {
      value = rows[i][key];
      if (!seen[value]) {
        seen[value] = true;
        values.push(value);
      }
    }
    values.sort();
    return values;
  }

  function populateSelect(id, values) {
    var select = document.getElementById(id);
    var i;
    var option;
    for (i = 0; i < values.length; i += 1) {
      option = document.createElement('option');
      option.value = values[i];
      option.text = values[i];
      select.appendChild(option);
    }
  }

  function bindEvents() {
    var liveIds = [
      'searchInput', 'dateFrom', 'dateTo', 'originFilter', 'regionFilter', 'modelFilter'
    ];
    var i;
    var el;
    var triggers;
    for (i = 0; i < liveIds.length; i += 1) {
      el = document.getElementById(liveIds[i]);
      el.oninput = filterChanged;
      el.onchange = filterChanged;
    }
    document.getElementById('resetBtn').onclick = resetFilters;
    document.getElementById('refreshBtn').onclick = refreshWorkbench;
    document.getElementById('markBtn').onclick = markSelected;
    document.getElementById('modeManual').onclick = function () { setMode('manual'); };
    document.getElementById('downloadBtn').onclick = downloadCsv;
    document.getElementById('backBtn').onclick = function () {
      showToast('Back navigation is represented in this standalone demo.', 'info');
    };
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalCloseFooter').onclick = closeModal;
    document.getElementById('subModalClose').onclick = closeSubModal;
    document.getElementById('subModalCloseFooter').onclick = closeSubModal;
    document.getElementById('detailOverlay').onclick = function (event) {
      if (event.target === this) {
        closeModal();
      }
    };
    document.getElementById('subOverlay').onclick = function (event) {
      if (event.target === this) {
        closeSubModal();
      }
    };
    document.onkeydown = function (event) {
      event = event || window.event;
      if (event.keyCode === 27) {
        if (document.getElementById('subOverlay').className.indexOf('show') >= 0) {
          closeSubModal();
        } else {
          closeModal();
        }
        closeCalendar();
      }
    };
    document.onclick = handleDocumentClick;
    triggers = document.getElementsByClassName('calendar-trigger');
    for (i = 0; i < triggers.length; i += 1) {
      triggers[i].onclick = openCalendarFromButton;
    }
  }

  function handleDocumentClick(event) {
    var pop = document.getElementById('calendarPopover');
    var target = event.target || event.srcElement;
    if (!pop.className.match(/show/)) {
      return;
    }
    if (isInside(target, pop) || hasClassUp(target, 'calendar-trigger')) {
      return;
    }
    closeCalendar();
  }

  function isInside(node, parent) {
    while (node) {
      if (node === parent) {
        return true;
      }
      node = node.parentNode;
    }
    return false;
  }

  function hasClassUp(node, className) {
    while (node && node !== document.body) {
      if ((' ' + node.className + ' ').indexOf(' ' + className + ' ') >= 0) {
        return true;
      }
      node = node.parentNode;
    }
    return false;
  }

  function filterChanged() {
    currentPage = 1;
    selected = {};
    renderAll();
  }

  function setMode(nextMode) {
    if (nextMode !== 'manual' || nextMode === mode) {
      return;
    }
    mode = 'manual';
    selected = {};
    currentPage = 1;
    updateModeButtons();
    renderAll();
  }

  function updateModeButtons() {
    document.getElementById('modeManual').className = 'mode-btn active';
    document.getElementById('markBtn').style.display = '';
  }

  function readFilters(validateDates) {
    var fromValue = trim(document.getElementById('dateFrom').value);
    var toValue = trim(document.getElementById('dateTo').value);
    var fromDate = parseDate(fromValue);
    var toDate = parseDate(toValue);
    var valid = true;
    if (validateDates !== false) {
      valid = !!fromDate && !!toDate && fromDate.getTime() <= toDate.getTime();
      setDateValidity('dateFrom', !!fromDate && (!toDate || fromDate.getTime() <= toDate.getTime()));
      setDateValidity('dateTo', !!toDate && (!fromDate || fromDate.getTime() <= toDate.getTime()));
    }
    return {
      search: trim(document.getElementById('searchInput').value).toLowerCase(),
      fromDate: fromDate,
      toDate: toDate,
      origin: document.getElementById('originFilter').value,
      region: document.getElementById('regionFilter').value,
      model: document.getElementById('modelFilter').value,
      validDates: valid
    };
  }

  function setDateValidity(id, valid) {
    var el = document.getElementById(id);
    el.style.borderColor = valid ? '' : '#d74a42';
    el.title = valid ? '' : 'Use a valid dd-mm-yyyy date range';
  }

  function trim(value) {
    return String(value || '').replace(/^\s+|\s+$/g, '');
  }

  function getFilteredRows() {
    var filters = readFilters(true);
    var rows = [];
    var i;
    if (!filters.validDates) {
      return rows;
    }
    for (i = 0; i < data.length; i += 1) {
      if (matchesMode(data[i]) && matchesSimpleFilters(data[i], filters, true)) {
        rows.push(data[i]);
      }
    }
    rows.sort(rowSorter);
    return rows;
  }

  function matchesMode(row) {
    return row.status === '02';
  }

  function matchesSimpleFilters(row, filters, includeDateRange) {
    var shipStart;
    var shipEnd;
    if (filters.origin && row.origin !== filters.origin) {
      return false;
    }
    if (filters.region && row.region !== filters.region) {
      return false;
    }
    if (filters.model && row.model !== filters.model) {
      return false;
    }
    if (includeDateRange && mode === 'manual') {
      shipStart = parseDate(row.shipStart);
      shipEnd = parseDate(row.shipEnd);
      if (!shipStart || !shipEnd) {
        return false;
      }
      if (filters.fromDate && shipStart.getTime() < filters.fromDate.getTime()) {
        return false;
      }
      if (filters.toDate && shipEnd.getTime() < filters.toDate.getTime()) {
        return false;
      }
    }
    if (filters.search && searchableText(row).indexOf(filters.search) < 0) {
      return false;
    }
    return true;
  }

  function searchableText(row) {
    var parts = [];
    var i;
    var key;
    for (i = 0; i < columns.length; i += 1) {
      key = columns[i].key;
      if (key !== 'check') {
        parts.push(formatRaw(row[key], columns[i].type));
      }
    }
    return parts.join(' ').toLowerCase();
  }

  function formatRaw(value, type) {
    if (type === 'amount') {
      return formatAmount(value);
    }
    return value === undefined || value === null ? '' : String(value);
  }

  function rowSorter(a, b) {
    var av = a[sortKey];
    var bv = b[sortKey];
    var cmp = 0;
    if (sortKey === 'amount' || sortKey.indexOf('days') === 0) {
      av = Number(av);
      bv = Number(bv);
      cmp = av === bv ? 0 : (av < bv ? -1 : 1);
    } else if (isDateKey(sortKey)) {
      av = parseDate(av);
      bv = parseDate(bv);
      av = av ? av.getTime() : 0;
      bv = bv ? bv.getTime() : 0;
      cmp = av === bv ? 0 : (av < bv ? -1 : 1);
    } else {
      av = String(av || '').toLowerCase();
      bv = String(bv || '').toLowerCase();
      cmp = av === bv ? 0 : (av < bv ? -1 : 1);
    }
    return cmp * sortDir;
  }

  function isDateKey(key) {
    return key === 'dealStart' || key === 'dealEnd' || key === 'earliestStart' ||
      key === 'shipStart' || key === 'shipEnd';
  }

  function getVisibleColumns() {
    var keys = layouts['default'];
    var result = [];
    var i;
    var j;
    for (i = 0; i < keys.length; i += 1) {
      for (j = 0; j < columns.length; j += 1) {
        if (columns[j].key === keys[i]) {
          result.push(columns[j]);
          break;
        }
      }
    }
    return result;
  }

  function renderAll() {
    var rows = getFilteredRows();
    var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) {
      currentPage = totalPages;
    }
    renderHead(rows);
    renderBody(rows);
    renderFooter(rows, totalPages);
    updateActionState();
    document.getElementById('recordCount').innerHTML = rows.length + ' records';
    updateModeButtons();
  }

  function renderHead(rows) {
    var head = document.getElementById('tableHead');
    var cols = getVisibleColumns();
    var html = '';
    var i;
    var arrow;
    for (i = 0; i < cols.length; i += 1) {
      if (cols[i].type === 'check') {
        html += '<th class="check-col"><input id="checkAll" type="checkbox" aria-label="Select all visible deals"></th>';
      } else {
        arrow = sortKey === cols[i].key ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
        html += '<th class="sortable ' + (cols[i].type === 'deal' ? 'deal-col' : '') + '" data-key="' +
          escapeHtml(cols[i].key) + '" style="min-width:' + escapeHtml(cols[i].width || '90px') + '">' +
          escapeHtml(cols[i].label) + '<span class="sort-arrow">' + arrow + '</span></th>';
      }
    }
    head.innerHTML = html;
    bindHeadEvents(rows);
  }

  function bindHeadEvents(rows) {
    var sortHeaders = document.getElementsByClassName('sortable');
    var i;
    var checkAll = document.getElementById('checkAll');
    for (i = 0; i < sortHeaders.length; i += 1) {
      sortHeaders[i].onclick = sortClick;
    }
    if (checkAll) {
      checkAll.disabled = mode !== 'manual' || rows.length === 0;
      checkAll.onclick = function (event) {
        event = event || window.event;
        if (event.stopPropagation) {
          event.stopPropagation();
        }
        toggleAllFiltered(rows, this.checked);
      };
      checkAll.checked = allRowsSelected(rows);
    }
  }

  function sortClick() {
    var key = this.getAttribute('data-key');
    if (sortKey === key) {
      sortDir = sortDir * -1;
    } else {
      sortKey = key;
      sortDir = 1;
    }
    renderAll();
  }

  function allRowsSelected(rows) {
    var i;
    if (rows.length === 0 || mode !== 'manual') {
      return false;
    }
    for (i = 0; i < rows.length; i += 1) {
      if (!selected[rows[i].dealId]) {
        return false;
      }
    }
    return true;
  }

  function toggleAllFiltered(rows, checked) {
    var i;
    if (mode !== 'manual') {
      return;
    }
    for (i = 0; i < rows.length; i += 1) {
      if (checked) {
        selected[rows[i].dealId] = true;
      } else {
        delete selected[rows[i].dealId];
      }
    }
    renderAll();
  }

  function renderBody(rows) {
    var body = document.getElementById('tableBody');
    var empty = document.getElementById('emptyState');
    var cols = getVisibleColumns();
    var start = (currentPage - 1) * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, rows.length);
    var html = '';
    var i;
    var j;
    var row;
    var selectedClass;
    for (i = start; i < end; i += 1) {
      row = rows[i];
      selectedClass = selected[row.dealId] ? ' row-selected' : '';
      html += '<tr class="deal-row' + selectedClass + '" draggable="' + (mode === 'manual' ? 'true' : 'false') +
        '" data-id="' + escapeHtml(row.dealId) + '">';
      for (j = 0; j < cols.length; j += 1) {
        html += renderCell(row, cols[j]);
      }
      html += '</tr>';
    }
    body.innerHTML = html;
    empty.className = rows.length === 0 ? 'empty-state show' : 'empty-state';
    document.getElementById('dealTable').style.display = rows.length === 0 ? 'none' : 'table';
    bindBodyEvents();
  }

  function renderCell(row, col) {
    var value = row[col.key];
    var classes = [];
    var content = '';
    if (col.type === 'check') {
      return '<td class="check-col"><input class="row-check" type="checkbox" data-id="' +
        escapeHtml(row.dealId) + '" ' + (selected[row.dealId] ? 'checked' : '') +
        (mode !== 'manual' ? ' disabled' : '') + ' aria-label="Select ' + escapeHtml(row.dealId) + '"></td>';
    }
    if (col.type === 'deal') {
      classes.push('deal-col');
      content = '<button type="button" class="hotspot hotspot-deal" data-action="deal" data-id="' +
        escapeHtml(row.dealId) + '">' + escapeHtml(value) + '</button>';
    } else if (col.type === 'mc') {
      content = '<button type="button" class="hotspot hotspot-mc" data-action="mc" data-id="' +
        escapeHtml(row.dealId) + '">' + escapeHtml(value) + '</button>';
    } else if (col.type === 'amount') {
      classes.push('amount');
      content = escapeHtml(formatAmount(value));
    } else if (col.type === 'num') {
      classes.push('num');
      classes.push(Number(value) < 0 ? 'days-negative' : 'days-positive');
      content = Number(value) === 0 ? '' : escapeHtml(String(value));
    } else if (col.type === 'status') {
      classes.push(row.status === '03' ? 'status-marked' : 'status-ready');
      content = escapeHtml(value);
    } else {
      content = escapeHtml(value);
    }
    return '<td class="' + classes.join(' ') + '">' + content + '</td>';
  }

  function bindBodyEvents() {
    var rows = document.getElementsByClassName('deal-row');
    var checks = document.getElementsByClassName('row-check');
    var hotspots = document.getElementsByClassName('hotspot');
    var i;
    for (i = 0; i < rows.length; i += 1) {
      rows[i].onclick = rowClick;
      rows[i].ondragstart = rowDragStart;
      rows[i].ondragend = rowDragEnd;
    }
    for (i = 0; i < checks.length; i += 1) {
      checks[i].onclick = checkClick;
    }
    for (i = 0; i < hotspots.length; i += 1) {
      hotspots[i].onclick = hotspotClick;
    }
    bindDropTarget();
  }

  function rowClick(event) {
    var target = event.target || event.srcElement;
    var id = this.getAttribute('data-id');
    if (hasClassUp(target, 'hotspot') || hasClassUp(target, 'row-check')) {
      return;
    }
    if (mode !== 'manual') {
      return;
    }
    toggleSelection(id);
  }

  function checkClick(event) {
    event = event || window.event;
    if (event.stopPropagation) {
      event.stopPropagation();
    }
    if (mode !== 'manual') {
      return;
    }
    setSelection(this.getAttribute('data-id'), this.checked);
  }

  function hotspotClick(event) {
    event = event || window.event;
    if (event.stopPropagation) {
      event.stopPropagation();
    }
    openDetails(this.getAttribute('data-id'), this.getAttribute('data-action'));
  }

  function toggleSelection(id) {
    if (selected[id]) {
      delete selected[id];
    } else {
      selected[id] = true;
    }
    renderAll();
  }

  function setSelection(id, value) {
    if (value) {
      selected[id] = true;
    } else {
      delete selected[id];
    }
    renderAll();
  }

  function selectedCount() {
    var count = 0;
    var key;
    for (key in selected) {
      if (Object.prototype.hasOwnProperty.call(selected, key) && selected[key]) {
        count += 1;
      }
    }
    return count;
  }

  function updateActionState() {
    var count = selectedCount();
    var btn = document.getElementById('markBtn');
    btn.disabled = mode !== 'manual' || count === 0;
    btn.title = count === 0 ? 'Select one or more deals first' : 'Mark ' + count + ' selected deal(s) for invoicing';
  }

  function markSelected() {
    var count = 0;
    var i;
    if (mode !== 'manual') {
      return;
    }
    for (i = 0; i < data.length; i += 1) {
      if (selected[data[i].dealId] && data[i].status === '02') {
        data[i].status = '03';
        data[i].statusDesc = 'Deal ID Marked for Invoicing';
        data[i].manualMarked = true;
        count += 1;
      }
    }

  function rowDragStart(event) {
    var id = this.getAttribute('data-id');
    if (mode !== 'manual') {
      if (event.preventDefault) {
        event.preventDefault();
      }
      return false;
    }
    addClass(this, 'dragging');
    selected[id] = true;
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', id);
    }
    addClass(document.getElementById('markBtn'), 'drop-ready');
    updateActionState();
    return true;
  }

  function rowDragEnd() {
    removeClass(this, 'dragging');
    removeClass(document.getElementById('markBtn'), 'drop-ready');
    removeClass(document.getElementById('markBtn'), 'drop-over');
    renderAll();
  }

  function bindDropTarget() {
    var btn = document.getElementById('markBtn');
    btn.ondragover = function (event) {
      if (mode !== 'manual') {
        return;
      }
      event = event || window.event;
      if (event.preventDefault) {
        event.preventDefault();
      }
      addClass(btn, 'drop-over');
      if (event.dataTransfer) {
        event.dataTransfer.dropEffect = 'move';
      }
      return false;
    };
    btn.ondragleave = function () {
      removeClass(btn, 'drop-over');
    };
    btn.ondrop = function (event) {
      var id;
      event = event || window.event;
      if (event.preventDefault) {
        event.preventDefault();
      }
      removeClass(btn, 'drop-over');
      removeClass(btn, 'drop-ready');
      if (mode !== 'manual') {
        return false;
      }
      if (event.dataTransfer) {
        id = event.dataTransfer.getData('text/plain');
        if (id) {
          selected[id] = true;
        }
      }
      markSelected();
      return false;
    };
  }

  function addClass(el, cls) {
    if ((' ' + el.className + ' ').indexOf(' ' + cls + ' ') < 0) {
      el.className += ' ' + cls;
    }
  }

  function removeClass(el, cls) {
    var re = new RegExp('(^|\\s)' + cls + '(?=\\s|$)', 'g');
    el.className = el.className.replace(re, ' ').replace(/^\s+|\s+$/g, '');
  }

  function renderFooter(rows, totalPages) {
    var start = rows.length === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(currentPage * PAGE_SIZE, rows.length);
    var pagination = document.getElementById('pagination');
    var html = '';
    var p;
    document.getElementById('footerCopy').innerHTML = 'Showing ' + start + '–' + end + ' of ' + rows.length;
    html += '<button class="page-btn" data-page="prev" ' + (currentPage <= 1 ? 'disabled' : '') + '>&lsaquo;</button>';
    for (p = 1; p <= totalPages; p += 1) {
      if (totalPages <= 5 || p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
        html += '<button class="page-btn ' + (p === currentPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
      }
    }
    html += '<button class="page-btn" data-page="next" ' + (currentPage >= totalPages ? 'disabled' : '') + '>&rsaquo;</button>';
    pagination.innerHTML = html;
    bindPagination(totalPages);
  }

  function bindPagination(totalPages) {
    var buttons = document.getElementsByClassName('page-btn');
    var i;
    for (i = 0; i < buttons.length; i += 1) {
      buttons[i].onclick = function () {
        var target = this.getAttribute('data-page');
        if (target === 'prev' && currentPage > 1) {
          currentPage -= 1;
        } else if (target === 'next' && currentPage < totalPages) {
          currentPage += 1;
        } else if (/^\d+$/.test(target)) {
          currentPage = parseInt(target, 10);
        }
        renderAll();
        document.getElementById('tableScroll').scrollTop = 0;
      };
    }
  }

  function buildViewDealData(row) {
    var codeMap = { OGA: 'AE13', DMCC: 'AE13', OSIPL: 'IN11', SEDA: 'ES12', PAN: 'IN11' };
    var entityMap = {
      OGA: 'OGA-DMCC-PAN', DMCC: 'DMCC-OGA-PAN', OSIPL: 'OSIPL-OGA-PAN',
      SEDA: 'SEDA-DMCC-OGA', PAN: 'PAN-OGA-DMCC'
    };
    var currencyMap = { APAC: 'USD-INR', MEA: 'USD-AED', EUR: 'USD-EUR' };
    var traderCode = parseInt(row.dealId.slice(-1), 10) % 2 === 0 ? 'OGA' : 'OTL';
    var traderDesc = traderCode === 'OGA' ? 'Olam Global Agri' : 'Olam Treasury Limited';
    return {
      companyCode: codeMap[row.origin] || 'AE13',
      dealRef: row.dealDesc,
      mcDate: addDays(row.shipStart, -20),
      mcDesc: row.commodity + ' Master Contract',
      entityString: entityMap[row.origin] || (row.origin + '-OGA-PAN'),
      currencyString: currencyMap[row.region] || 'USD-INR',
      traderCode: traderCode,
      traderDesc: traderDesc,
      statusText: row.status + ' - ' + row.statusDesc,
      fxRows: buildFxRows(row, codeMap[row.origin] || 'AE13'),
      invoiceRows: buildInvoiceRows(row)
    };
  }

  function buildFxRows(row, companyCode) {
    var regionRate = row.region === 'MEA' ? 3.6725 : (row.region === 'EUR' ? 0.9345 : 83.1200);
    var targetCurr = row.region === 'MEA' ? 'AED' : (row.region === 'EUR' ? 'EUR' : 'INR');
    var rfha = '20' + row.dealId.slice(-5);
    var amount2 = row.amount * regionRate;
    var rows = [{
      bukrs: companyCode,
      dealType: 'FX Forward',
      rfha: rfha,
      start: row.dealStart,
      end: row.dealEnd,
      text: row.commodity + ' hedge',
      entity: row.origin,
      side1: 'Buy',
      curr1: 'USD',
      amt1: row.amount,
      side2: 'Sell',
      curr2: targetCurr,
      amt2: amount2,
      spot: regionRate,
      swap: 0.0125,
      allIn: regionRate + 0.0125,
      strike: '',
      mcRef: row.mcRef,
      txnStatus: 'Active',
      premium: '',
      premiumCurr: ''
    }];
    if (row.model === 'MIXED') {
      rows.push({
        bukrs: companyCode,
        dealType: 'FX Option',
        rfha: String(parseInt(rfha, 10) + 1),
        start: row.dealStart,
        end: row.dealEnd,
        text: row.commodity + ' option leg',
        entity: row.origin,
        side1: 'Buy',
        curr1: 'USD',
        amt1: row.amount * 0.35,
        side2: 'Sell',
        curr2: targetCurr,
        amt2: row.amount * 0.35 * regionRate,
        spot: '',
        swap: '',
        allIn: '',
        strike: regionRate + 0.11,
        mcRef: row.mcRef,
        txnStatus: 'Active',
        premium: row.amount * 0.0015,
        premiumCurr: 'USD'
      });
    }
    return rows;
  }

  function buildInvoiceRows(row) {
    var localCurr = row.region === 'MEA' ? 'AED' : (row.region === 'EUR' ? 'EUR' : 'INR');
    var rate = row.region === 'MEA' ? 3.6725 : (row.region === 'EUR' ? 0.9345 : 83.1200);
    var shares = [0.4, 0.35, 0.25];
    var rows = [];
    var i;
    var amount;
    for (i = 0; i < shares.length; i += 1) {
      amount = row.amount * shares[i];
      rows.push({
        ref: 'INV' + row.dealId.slice(-5) + '-' + pad2(i + 1),
        tradeType: 'T' + (i + 1),
        dealType: i === 0 ? 'Purchase' : (i === 1 ? 'Sale' : 'Adjustment'),
        sell: i === 1 ? row.origin : 'OGA',
        buy: i === 1 ? 'OGA' : row.origin,
        curr: localCurr,
        mcPrimary: row.mcRef,
        mcSecondary: i === 2 ? row.mcRef + '-S' : '',
        usdAmount: amount,
        localAmount: amount * rate,
        exchangeRate: rate
      });
    }
    return rows;
  }

  function buildPlannedPnlRows(row) {
    var rate = row.region === 'MEA' ? 3.6725 : (row.region === 'EUR' ? 0.9345 : 83.1200);
    var localCurr = row.region === 'MEA' ? 'AED' : (row.region === 'EUR' ? 'EUR' : 'INR');
    var purchase = row.amount * 0.976;
    var premiumIn = row.model === 'MIXED' ? row.amount * 0.0024 : 0;
    var premiumOut = row.model === 'MIXED' ? row.amount * -0.0014 : 0;
    var ndfAdj = row.model === 'FWD' ? row.amount * 0.0008 : 0;
    var total = row.amount - purchase + premiumIn + premiumOut + ndfAdj;
    return {
      localCurr: localCurr,
      rows: [
        { type: 'Sale', usd: row.amount, local: row.amount * rate },
        { type: 'Purchase', usd: -purchase, local: -purchase * rate },
        { type: 'Option Premium Income', usd: premiumIn, local: premiumIn * rate },
        { type: 'Option Premium Expense', usd: premiumOut, local: premiumOut * rate },
        { type: 'NDF Fixing-Profit Adj', usd: ndfAdj, local: ndfAdj * rate },
        { type: 'Total P&L', usd: total, local: total * rate, total: true }
      ]
    };
  }

  function recalcInvoiceTable() {
    var rows = document.querySelectorAll('#invoiceAdjustTable tbody tr');
    var i;

    var price;
    var rate;
    var amount;
    for (i = 0; i < rows.length; i += 1) {
      qty = parseFloat(rows[i].querySelector('[data-calc="qty"]').value) || 0;
      price = parseFloat(rows[i].querySelector('[data-calc="price"]').value) || 0;
      rate = parseFloat(rows[i].querySelector('[data-calc="rate"]').value) || 0;
      amount = qty * price;
      rows[i].querySelector('.invoice-usd').innerHTML = formatAmount(amount);
      rows[i].querySelector('.invoice-final').innerHTML = formatAmount(amount * (rate ? 1 : 1));
    }
  }

    html += '<button class="deal-action-btn" data-set-action="diff" type="button">FX-Invoice Difference</button>';
    html += '<button class="deal-action-btn" data-set-action="pnl" type="button">View P&amp;L</button>';
    html += '<button class="deal-action-btn" data-set-action="amend" type="button">Amend End Date</button>';
    html += '<button class="deal-action-btn" data-set-action="complete" type="button" disabled>Execution Complete</button>';
    html += '<span class="workflow-spacer"></span><span class="workflow-status" id="settlementStatus">Ready</span>';
    html += '<button class="deal-action-btn" data-set-action="refresh" type="button">Refresh</button>';
    html += '</div>';
    html += renderWorkflowBasic(row, 'Settlement');
    html += '<section class="workflow-section"><div class="workflow-section-head"><span>FX Deal Settlement</span>';
    html += '<span class="workflow-section-meta">RFHA hotspot enabled</span></div>';
    html += renderWorkflowFxTable(row, true) + '</section>';
    html += '<section class="workflow-section"><div class="workflow-section-head"><span>Trade Invoice Settlement</span>';
    html += '<span class="workflow-section-meta">Settlement and FI Posting controls</span></div>';
    html += renderSettlementInvoiceTable(row) + '</section>';
    html += '<div class="workflow-extra" id="workflowExtraPanel"></div></div>';
    return html;
  }

  function openSettlement(row) {
    openWorkflowModal('MO: Execute Settlement for Deal ID — ' + row.dealId, renderSettlementWorkspace(row));
    bindSettlement(row);
  }

  function bindSettlement(row) {
    var buttons = document.querySelectorAll('#subModalBody [data-set-action]');
    var checks = document.querySelectorAll('#subModalBody .settlement-check');
    var i;
    bindWorkflowRfha(row);
    for (i = 0; i < checks.length; i += 1) {
      checks[i].onchange = updateSettlementCompleteState;
    }
    for (i = 0; i < buttons.length; i += 1) {
      buttons[i].onclick = function () {
        var action = this.getAttribute('data-set-action');
        if (action === 'refresh') {
          openSettlement(row);
        } else if (action === 'init') {
          document.getElementById('settlementStatus').innerHTML = 'Settlement Initiated';
          showToast('Settlement initiated in the demo.', 'success');
        } else if (action === 'invoice') {
          setWorkflowExtra('View Trade Invoice', renderPlannedInvoiceTable(row));
        } else if (action === 'diff') {
          setWorkflowExtra('Invoice Difference', renderInvoiceDifferenceTable(row));
        } else if (action === 'pnl') {
          setWorkflowExtra('View P&L Amount', renderSettlementPnl(row));
        } else if (action === 'amend') {
          showSettlementEndDate(row);
        } else if (action === 'complete') {
          document.getElementById('settlementStatus').innerHTML = 'Execution Complete';
          showToast('Settlement execution completed in the demo.', 'success');
        }
      };
    }
    updateSettlementCompleteState();
  }

  function updateSettlementCompleteState() {
    var checks = document.querySelectorAll('#subModalBody .settlement-check');
    var button = document.querySelector('#subModalBody [data-set-action="complete"]');
    var all = checks.length > 0;
    var i;
    for (i = 0; i < checks.length; i += 1) {
      if (!checks[i].checked) {
        all = false;
      }
    }
    if (button) {
      button.disabled = !all;
    }
  }

  function showSettlementEndDate(row) {
    var html = '<div class="workflow-form-row">';
    html += '<label><span class="workflow-label">Deal ID</span><input class="workflow-input" value="' + escapeHtml(row.dealId) + '" disabled></label>';
    html += '<label><span class="workflow-label">Deal End Date</span><input class="workflow-input" id="settlementEndDate" value="' + escapeHtml(row.dealEnd) + '"></label>';
    html += '<div class="workflow-form-actions"><button class="primary-btn" id="settlementEndUpdate" type="button">Update Deal End Date</button></div>';
    html += '</div>';
    setWorkflowExtra('Amend Deal End Date', html);
    document.getElementById('settlementEndUpdate').onclick = function () {
      var value = document.getElementById('settlementEndDate').value;
      if (!parseDate(value)) {
        showToast('Enter the date in dd-mm-yyyy format.', 'error');
        return;
      }
      showToast('Deal end date updated to ' + value + ' in the demo.', 'success');
    };
  }

  function openBlList(row) {
    var rows = buildBlRows(row);
    var html = '<div class="deal-table-scroll"><table class="deal-table"><thead><tr>';
    var headers = [
      'TF No', 'TF Split', 'BL No', 'BL Split', 'BL Date', 'Invoice Commodity', 'TRM Commodity ID',
      'Incoterm', 'Invoice Date', 'Quantity', 'Unit', 'Price', 'Trade Value'
    ];
    var i;
    for (i = 0; i < headers.length; i += 1) {
      html += '<th>' + escapeHtml(headers[i]) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (i = 0; i < rows.length; i += 1) {
      html += '<tr><td>' + escapeHtml(rows[i].tfNo) + '</td><td>' + escapeHtml(rows[i].tfSplit) + '</td>';
      html += '<td>' + escapeHtml(rows[i].blNo) + '</td><td>' + escapeHtml(rows[i].blSplit) + '</td>';
      html += '<td>' + escapeHtml(rows[i].blDate) + '</td><td>' + escapeHtml(rows[i].commodity) + '</td>';
      html += '<td>' + escapeHtml(rows[i].commodityId) + '</td><td>' + escapeHtml(rows[i].incoterm) + '</td>';
      html += '<td>' + escapeHtml(rows[i].invoiceDate) + '</td><td class="num">' + formatAmount(rows[i].qty) + '</td>';
      html += '<td>' + escapeHtml(rows[i].unit) + '</td><td class="num">' + formatAmount(rows[i].price) + '</td>';
      html += '<td class="num">' + formatAmount(rows[i].tradeValue) + '</td></tr>';
    }
    html += '</tbody></table></div>';
    openSubModal('View List of BLs — ' + row.dealId, html, false);
  }

  function buildBlRows(row) {
    var rows = [];
    var weights = [0.34, 0.33, 0.33];
    var i;
    var qty;
    var price = 975.25;
    for (i = 0; i < weights.length; i += 1) {
      qty = Math.round((row.amount / price) * weights[i]);
      rows.push({
        tfNo: 'TF' + row.dealId.slice(-5),
        tfSplit: String(i + 1),
        blNo: 'BL' + row.dealId.slice(-5) + pad2(i + 1),
        blSplit: '01',
        blDate: addDays(row.shipStart, i * 6),
        commodity: row.commodity,
        commodityId: row.commodity.substring(0, 3).toUpperCase(),
        incoterm: i === 0 ? 'CIF' : 'FOB',
        invoiceDate: addDays(row.shipStart, 12 + i * 4),
        qty: qty,
        unit: 'MT',
        price: price,
        tradeValue: qty * price
      });
    }
    return rows;
  }

  function openTreasuryTransaction(row, rfha) {
    var detail = buildViewDealData(row);
    var fxRows = detail.fxRows;
    var fx = fxRows[0];
    var i;
    for (i = 0; i < fxRows.length; i += 1) {
      if (fxRows[i].rfha === rfha) {
        fx = fxRows[i];
        break;
      }
    }
    var fields = [
      ['Company Code', fx.bukrs], ['Transaction No', fx.rfha], ['Deal Type', fx.dealType],
      ['Product', fx.text], ['Start Date', fx.start], ['End Date', fx.end],
      ['Currency 1', fx.curr1], ['Amount 1', formatAmount(fx.amt1)],
      ['Currency 2', fx.curr2], ['Amount 2', formatAmount(fx.amt2)],
      ['All in Rate', formatRate(fx.allIn || fx.strike)], ['Transaction Status', fx.txnStatus]
    ];
    var html = '<div class="txn-grid">';
    for (i = 0; i < fields.length; i += 1) {
      html += '<div class="txn-card"><div class="txn-label">' + escapeHtml(fields[i][0]) + '</div>';
      html += '<div class="txn-value">' + escapeHtml(fields[i][1]) + '</div></div>';
    }
    html += '</div>';
    openSubModal('Treasury Transaction Display', html, true);
  }

  function openSubModal(title, bodyHtml, small) {
    var modal = document.getElementById('subModal');
    modal.className = small ? 'sub-modal small' : 'sub-modal';
    document.getElementById('subModalTitle').innerHTML = escapeHtml(title);
    document.getElementById('subModalBody').innerHTML = bodyHtml;
    document.getElementById('subOverlay').className = 'sub-modal-overlay show';
    document.getElementById('subOverlay').setAttribute('aria-hidden', 'false');
  }

  function closeSubModal() {
    var overlay = document.getElementById('subOverlay');
    overlay.className = 'sub-modal-overlay';
    overlay.setAttribute('aria-hidden', 'true');
  }

  function renderInfoGrid(fields) {
    var html = '<div class="info-grid">';
    var i;
    for (i = 0; i < fields.length; i += 1) {
      html += '<div class="info-item"><div class="info-card"><div class="info-label">' +
        escapeHtml(fields[i][0]) + '</div><div class="info-value">' + escapeHtml(fields[i][1]) +
        '</div></div></div>';
    }
    html += '</div>';
    return html;
  }

  function closeModal() {
    var overlay = document.getElementById('detailOverlay');
    closeSubModal();
    overlay.className = 'modal-overlay';
    overlay.setAttribute('aria-hidden', 'true');
  }

  function findRow(id) {
    var i;
    for (i = 0; i < data.length; i += 1) {
      if (data[i].dealId === id) {
        return data[i];
      }
    }
    return null;
  }

  function downloadCsv() {
    var rows = getFilteredRows();
    var cols = getVisibleColumns();
    var csv = [];
    var header = [];
    var i;
    var j;
    var row;
    var line;
    for (i = 0; i < cols.length; i += 1) {
      if (cols[i].key !== 'check') {
        header.push(csvQuote(cols[i].label));
      }
    }
    csv.push(header.join(','));
    for (i = 0; i < rows.length; i += 1) {
      row = rows[i];
      line = [];
      for (j = 0; j < cols.length; j += 1) {
        if (cols[j].key !== 'check') {
          line.push(csvQuote(formatRaw(row[cols[j].key], cols[j].type)));
        }
      }
      csv.push(line.join(','));
    }
    saveTextFile('deal_id_invoice_marking.csv', csv.join('\r\n'));
  }

  function csvQuote(value) {
    return '"' + String(value === undefined ? '' : value).replace(/"/g, '""') + '"';
  }

  function saveTextFile(filename, content) {
    var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url;
    if (window.navigator && window.navigator.msSaveBlob) {
      window.navigator.msSaveBlob(blob, filename);
      return;
    }
    url = window.URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.setTimeout(function () {
      window.URL.revokeObjectURL(url);
    }, 0);
  }

  function formatAmount(value) {
    var num = Number(value || 0);
    var parts = num.toFixed(2).split('.');
    var integer = parts[0];
    var result = '';
    var count = 0;
    var i;
    for (i = integer.length - 1; i >= 0; i -= 1) {
      result = integer.charAt(i) + result;
      count += 1;
      if (count === 3 && i !== 0) {
        result = ',' + result;
        count = 0;
      }
    }
    return result + '.' + parts[1];
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(message, kind) {
    var stack = document.getElementById('toastStack');
    var toast = document.createElement('div');
    var icon = kind === 'warn' ? '!' : (kind === 'info' ? 'i' : '&#10003;');
    toast.className = 'toast' + (kind && kind !== 'success' ? ' ' + kind : '');
    toast.innerHTML = '<span class="toast-icon">' + icon + '</span><span>' + escapeHtml(message) + '</span>';
    stack.appendChild(toast);
    window.setTimeout(function () {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 3600);
  }

  function openCalendarFromButton(event) {
    var button = event.currentTarget || event.srcElement;
    var inputId = button.getAttribute('data-for');
    var input = document.getElementById(inputId);
    var parsed = parseDate(input.value);
    var pop = document.getElementById('calendarPopover');
    var rect;
    if (parsed) {
      calendarState.year = parsed.getFullYear();
      calendarState.month = parsed.getMonth();
    } else {
      calendarState.year = TODAY.getFullYear();
      calendarState.month = TODAY.getMonth();
    }
    calendarState.inputId = inputId;
    renderCalendar();
    rect = button.getBoundingClientRect();
    pop.style.left = Math.max(8, rect.left - 245 + rect.width) + window.pageXOffset + 'px';
    pop.style.top = rect.bottom + 5 + window.pageYOffset + 'px';
    pop.className = 'calendar-popover show';
    pop.setAttribute('aria-hidden', 'false');
    if (event.stopPropagation) {
      event.stopPropagation();
    }
  }

  function closeCalendar() {
    var pop = document.getElementById('calendarPopover');
    pop.className = 'calendar-popover';
    pop.setAttribute('aria-hidden', 'true');
    calendarState.inputId = null;
  }

  function renderCalendar() {
    var pop = document.getElementById('calendarPopover');
    var monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    var dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    var html = '<div class="calendar-head">';
    var i;
    var first;
    var start;
    var cell;
    var cellDate;
    var inputValue;
    var selectedDate;
    html += '<button type="button" class="cal-nav" id="calPrev">&lsaquo;</button>';
    html += '<select class="cal-select cal-month" id="calMonth">';
    for (i = 0; i < 12; i += 1) {
      html += '<option value="' + i + '"' + (i === calendarState.month ? ' selected' : '') + '>' +
        monthNames[i] + '</option>';
    }
    html += '</select>';
    html += '<select class="cal-select cal-year" id="calYear">';
    for (i = calendarState.year - 5; i <= calendarState.year + 5; i += 1) {
      html += '<option value="' + i + '"' + (i === calendarState.year ? ' selected' : '') + '>' + i + '</option>';
    }
    html += '</select>';
    html += '<button type="button" class="cal-nav" id="calNext">&rsaquo;</button>';
    html += '</div><div class="cal-grid">';
    for (i = 0; i < dayNames.length; i += 1) {
      html += '<div class="cal-dow">' + dayNames[i] + '</div>';
    }
    first = new Date(calendarState.year, calendarState.month, 1);
    start = new Date(calendarState.year, calendarState.month, 1 - first.getDay());
    inputValue = calendarState.inputId ? document.getElementById(calendarState.inputId).value : '';
    selectedDate = parseDate(inputValue);
    for (cell = 0; cell < 42; cell += 1) {
      cellDate = new Date(start.getFullYear(), start.getMonth(), start.getDate() + cell);
      html += '<button type="button" class="cal-day' +
        (cellDate.getMonth() !== calendarState.month ? ' muted' : '') +
        (sameDate(cellDate, TODAY) ? ' today' : '') +
        (selectedDate && sameDate(cellDate, selectedDate) ? ' selected' : '') +
        '" data-date="' + formatDate(cellDate) + '">' + cellDate.getDate() + '</button>';
    }
    html += '</div>';
    pop.innerHTML = html;
    bindCalendarEvents();
  }

  function bindCalendarEvents() {
    var days = document.getElementsByClassName('cal-day');
    var i;
    document.getElementById('calPrev').onclick = function (event) {
      changeCalendarMonth(-1);
      stopEvent(event);
    };
    document.getElementById('calNext').onclick = function (event) {
      changeCalendarMonth(1);
      stopEvent(event);
    };
    document.getElementById('calMonth').onchange = function (event) {
      calendarState.month = parseInt(this.value, 10);
      renderCalendar();
      stopEvent(event);
    };
    document.getElementById('calYear').onchange = function (event) {
      calendarState.year = parseInt(this.value, 10);
      renderCalendar();
      stopEvent(event);
    };
    for (i = 0; i < days.length; i += 1) {
      days[i].onclick = selectCalendarDay;
    }
  }

  function changeCalendarMonth(delta) {
    calendarState.month += delta;
    if (calendarState.month < 0) {
      calendarState.month = 11;
      calendarState.year -= 1;
    } else if (calendarState.month > 11) {
      calendarState.month = 0;
      calendarState.year += 1;
    }
    renderCalendar();
  }

  function selectCalendarDay(event) {
    var value = this.getAttribute('data-date');
    var input;
    var d = parseDate(value);
    if (!calendarState.inputId) {
      return;
    }
    input = document.getElementById(calendarState.inputId);
    input.value = value;
    if (d) {
      calendarState.year = d.getFullYear();
      calendarState.month = d.getMonth();
    }
    closeCalendar();
    filterChanged();
    stopEvent(event);
  }

  function stopEvent(event) {
    event = event || window.event;
    if (event.stopPropagation) {
      event.stopPropagation();
    }
  }

  function sameDate(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  init();
}());
</script>
