<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX NDF Settlement</title>
<style>
/* =========================================================
   Design system
   ========================================================= */
:root{
  --bg:#F4F8FC;
  --card:#FFFFFF;
  --text:#1D2D3E;
  --text-muted:#5C7085;
  --text-faint:#8CA0B3;
  --border:#E1E9F2;
  --border-strong:#CBD9E8;
  --primary:#1F6FEB;
  --primary-dark:#1657C4;
  --primary-light:#6FA8FF;
  --primary-tint:#EAF2FF;
  --success:#27AE60;
  --success-tint:#E8F8EF;
  --warning:#FF8A00;
  --warning-tint:#FFF3E4;
  --error:#E74C3C;
  --error-tint:#FDEAE8;
  --teal:#17BEBB;
  --teal-tint:#E7FAF9;
  --purple:#8E44AD;
  --purple-tint:#F5EAFA;
  --gray-tint:#EEF2F6;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(22,39,64,0.04), 0 4px 14px rgba(22,39,64,0.06);
  --shadow-pop:0 8px 28px rgba(22,39,64,0.16);
  --font:'Inter',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:12.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);}
input,select,textarea{font-family:var(--font);}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#C7D4E2;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   Layout
   ========================================================= */
.app{
  max-width:100%;
  margin:0;
  padding:0.3rem 0.2rem 0.5rem;
}

.table-col{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 210px);
}
.table-col > .card{
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  min-height:0;
  margin-bottom:0;
}
.table-col .table-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
}
@media (max-width:1080px){
  .table-col{
    max-height:none;
  }
  .table-col .table-scroll{max-height:520px;}
}

.page-actions-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px;
}

/* KPI cards */
.kpi-row{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.kpi-card{
  flex:1 1 180px;
  min-width:170px;
  background:var(--card);
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  min-height:64px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-left-color .18s ease;
}
.kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(22,39,64,0.08), 0 10px 22px rgba(22,39,64,0.09);
  border-left-color:var(--primary-dark);
}
.kpi-card .kpi-value{
  font-size:30px;
  font-weight:700;
  color:var(--primary-dark);
  line-height:1.15;
}
.kpi-card .kpi-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
}

.create-card{border-left-color:var(--primary);}
.create-card .create-icon-circle{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  font-weight:700;
  line-height:1;
  transition:background .18s ease, transform .18s ease;
}
.create-card .kpi-label{color:var(--text);font-weight:700;font-size:13px;}
.create-card:hover .create-icon-circle{
  background:var(--primary-dark);
  transform:scale(1.08);
}
.create-card:hover{border-left-color:var(--primary-dark);}

/* Header */
.page-header{
  margin-bottom:12px;
  background:#EAF3FF;
  border:1px solid #D7E9FF;
  border-radius:var(--radius-md);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}
.page-header .logo-img{
  height:40px;
  width:auto;
  max-width:120px;
  object-fit:contain;
  flex:none;
}
.page-header .logo-placeholder{
  height:36px;
  width:36px;
  flex:none;
  border-radius:8px;
  border:1px dashed var(--border-strong);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--text-faint);
}
.page-header .header-text{display:flex;flex-direction:column;}

/* Compact form rows with variable-width fields */
.form-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  margin-bottom:12px;
}
.form-row:last-child{margin-bottom:0;}
.form-row > .field{flex:1 1 160px;min-width:0;}
.field.w-sm{flex:0 1 100px;}
.field.w-sm-md{flex:0 1 124px;}
.field.w-md{flex:0 1 154px;}
.field.w-md-wide{flex:0 1 184px;}
.field.w-wide{flex:1 1 190px;min-width:165px;}
.field.w-date{flex:0 0 156px;min-width:156px;}
.form-row.no-wrap{flex-wrap:nowrap;}
.form-row.no-wrap > .field{min-width:0;}
.field.fx-field{flex:1 1 0;min-width:130px;}

/* 12-column responsive grid for the Create Master Contract modal.
   Each field gets a span sized to what its value actually needs,
   rather than forcing every field to equal width. */
.form-grid-12{
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:10px 12px;
  margin-bottom:14px;
}
.form-grid-12:last-child{margin-bottom:0;}
.form-grid-12 > .field{min-width:0;}
.gc-3{grid-column:span 3;}
.gc-4{grid-column:span 4;}
.gc-5{grid-column:span 5;}
.gc-6{grid-column:span 6;}
.gc-7{grid-column:span 7;}
@media (max-width:700px){
  .form-grid-12{grid-template-columns:repeat(6, 1fr);}
  .gc-3{grid-column:span 3;}
  .gc-4{grid-column:span 3;}
  .gc-5{grid-column:span 6;}
  .gc-6{grid-column:span 6;}
  .gc-7{grid-column:span 6;}
}
@media (max-width:460px){
  .form-grid-12{grid-template-columns:1fr;}
  .gc-3, .gc-4, .gc-5, .gc-6, .gc-7{grid-column:span 1;}
}
.page-header h1{
  font-size:19px;
  font-weight:700;
  margin:0 0 3px;
  letter-spacing:-0.2px;
}
.page-header p{
  margin:0;
  color:var(--text-muted);
  font-size:12.5px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  margin-bottom:12px;
  overflow:visible;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:700;
  color:var(--primary-dark);
  letter-spacing:0.3px;
}
.section-title .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;
}
.section-body{
  padding:12px 16px 14px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px 14px;
}
.form-grid.cols-1{grid-template-columns:1fr;}
.form-grid.cols-2{grid-template-columns:repeat(2,1fr);}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.field label{
  font-size:11.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  line-height:1.2;
}
.field label .req{color:var(--error);margin-left:2px;}
.field .hint{font-size:11px;color:var(--text-faint);}
.field .error-msg{
  font-size:11px;
  color:var(--error);
  display:none;
  margin-top:-2px;
}
.field.has-error .error-msg{display:block;}
.field.has-error input,
.field.has-error .select-display,
.field.has-error .dd-input{
  border-color:var(--error) !important;
  background:var(--error-tint);
}

.control{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 11px;
  font-size:12.5px;
  color:var(--text);
  background:#fff;
  width:100%;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.control::placeholder{color:var(--text-faint);}
.control:hover{border-color:#AFC2D8;}
.control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-tint);
}
.control[readonly]{
  background:var(--gray-tint);
  color:var(--text-muted);
  cursor:default;
}
.control:disabled{
  background:var(--gray-tint);
  color:var(--text-faint);
  cursor:not-allowed;
}

.input-with-suffix{
  position:relative;
  display:flex;
  align-items:center;
}
.input-with-suffix .control{padding-right:58px;}
.input-with-suffix .suffix{
  position:absolute;
  right:8px;
  font-size:11px;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-tint);
  padding:3px 7px;
  border-radius:6px;
  pointer-events:none;
  white-space:nowrap;
}

/* Searchable dropdown */
.dd{position:relative;}
.dd-input{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 32px 0 11px;
  font-size:12.5px;
  width:100%;
  outline:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%235C7085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
  cursor:pointer;
  transition:border-color .15s, box-shadow .15s;
}
.dd-input::placeholder{color:var(--text-faint);}
.dd-input:hover{border-color:#AFC2D8;}
.dd-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.dd.disabled .dd-input{background-color:var(--gray-tint);color:var(--text-faint);cursor:not-allowed;}

.dd-panel{
  position:absolute;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  min-width:200px;
  max-height:240px;
  overflow-y:auto;
  z-index:210;
  display:none;
  padding:6px;
}
.dd.open .dd-panel{display:block;}
.dd-item{
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.dd-item:hover, .dd-item.active{background:var(--primary-tint);}
.dd-item .primary-line{font-weight:600;font-size:12.5px;color:var(--text);}
.dd-item .secondary-line{font-size:11px;color:var(--text-muted);}
.dd-empty{padding:14px 10px;text-align:center;color:var(--text-faint);font-size:11.5px;}

/* Date field */
.date-field{position:relative;}
.date-field .control{padding-right:34px;}
.date-icon{
  position:absolute;
  right:6px;top:50%;
  transform:translateY(-50%);
  width:24px;height:24px;
  border:none;background:transparent;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--text-muted);
  font-size:13px;
}
.date-icon:hover{background:var(--primary-tint);color:var(--primary);}
.date-popup{
  position:absolute;
  width:250px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  z-index:210;
  padding:10px;
  display:none;
}
.date-popup.open{display:block;}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.cal-head button{
  width:24px;height:24px;border:none;background:var(--gray-tint);
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);
}
.cal-head button:hover{background:var(--primary-tint);color:var(--primary);}
.cal-head .cal-title{font-weight:700;font-size:12px;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal-grid .dow{
  text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding:4px 0;
}
.cal-grid .day{
  text-align:center;
  font-size:11.5px;
  padding:6px 0;
  border-radius:6px;
  cursor:pointer;
  color:var(--text);
}
.cal-grid .day:hover{background:var(--primary-tint);}
.cal-grid .day.muted{color:var(--text-faint);}
.cal-grid .day.selected{background:var(--primary);color:#fff;font-weight:700;}
.cal-grid .day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--primary-light);}

/* Buttons */
.btn{
  height:32px;
  padding:0 16px;
  border-radius:var(--radius-sm);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, box-shadow .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(31,111,235,0.25);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 1px 4px rgba(22,39,64,0.08);}
.btn-danger{background:#fff;color:var(--error);border-color:#F3C6C0;}
.btn-danger:hover{background:var(--error-tint);}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:0 6px;height:auto;}
.btn-ghost:hover{text-decoration:underline;}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px;}

.actions-row{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:12px 16px;
}

/* Success banner */
.success-banner{
  display:none;
  align-items:center;
  gap:10px;
  margin:0 0 12px;
  padding:9px 14px;
  background:var(--success-tint);
  border:1px solid #BFE8D0;
  border-radius:var(--radius-md);
  color:#1E7A46;
  font-size:12px;
}
.success-banner.show{display:flex;}
.success-banner b{font-weight:700;}
.success-banner .spacer{flex:1;}

/* =========================================================
   Master Contracts table section
   ========================================================= */
.table-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 16px 10px;
  flex-wrap:wrap;
  flex:0 0 auto;
}
.search-box{
  position:relative;
  flex:1 1 260px;
  min-width:200px;
}
.search-box input{
  height:32px;
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 12px 0 30px;
  font-size:12.5px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-box .icon{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-faint);font-size:13px;
}
.toolbar-spacer{flex:1 0 8px;}
.result-count{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}

.filter-select{
  flex:0 1 122px;
  min-width:88px;
  height:32px;
  cursor:pointer;
}

.table-scroll{
  overflow-x:auto;
}
table.mc-table{
  width:100%;
  border-collapse:collapse;
  min-width:1060px;
}
table.mc-table thead th{
  position:sticky;top:0;
  background:#F7FAFD;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color:var(--text-muted);
  font-weight:700;
  padding:10px 14px;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  z-index:5;
}
table.mc-table thead th:hover{color:var(--primary-dark);}
table.mc-table thead th.no-sort{cursor:default;}
table.mc-table thead th.no-sort:hover{color:var(--text-muted);}
table.mc-table thead th.action-col, table.mc-table td.action-col{
  width:40px;
  text-align:center;
  padding-left:10px;
  padding-right:10px;
}
.row-select-checkbox{
  width:14px;height:14px;
  accent-color:var(--primary);
  cursor:pointer;
  vertical-align:middle;
}
table.mc-table thead th .sort-ind{
  display:inline-block;
  margin-left:4px;
  font-size:9px;
  color:var(--text-faint);
}
table.mc-table thead th.sorted .sort-ind{color:var(--primary);}
table.mc-table thead th.num,
table.mc-table td.num{text-align:right;}
table.mc-table tbody td{
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  white-space:nowrap;
}
table.mc-table tbody tr{cursor:pointer;transition:background .18s ease;}
table.mc-table tbody tr:hover{background:#F7FAFD;}
table.mc-table tbody tr:hover .mc-link{color:var(--primary);}
table.mc-table tbody tr.selected{background:var(--primary-tint);}
table.mc-table tbody tr.row-new{animation:flashNew 1.8s ease-out;}
@keyframes flashNew{
  0%{background:#DFF3E6;}
  100%{background:transparent;}
}
.mc-link{color:var(--primary-dark);font-weight:700;cursor:pointer;transition:color .15s ease;}
.mc-link:hover{text-decoration:underline;color:var(--primary);}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.status-pill .status-dot{width:6px;height:6px;border-radius:50%;}
.status-in-use{background:var(--success-tint);color:#1E7A46;}
.status-in-use .status-dot{background:var(--success);}
.status-confirmed{background:var(--primary-tint);color:var(--primary-dark);}
.status-confirmed .status-dot{background:var(--primary);}
.status-draft{background:var(--gray-tint);color:var(--text-muted);}
.status-draft .status-dot{background:var(--text-faint);}
.status-pending{background:var(--warning-tint);color:#9A5300;}
.status-pending .status-dot{background:var(--warning);}
.status-rejected{background:var(--error-tint);color:#B4362A;}
.status-rejected .status-dot{background:var(--error);}
.status-settled{background:var(--teal-tint);color:#0E8785;}
.status-settled .status-dot{background:var(--teal);}
.status-matured{background:var(--purple-tint);color:#6C3488;}
.status-matured .status-dot{background:var(--purple);}

/* Plain-text status presentation (Master Contracts table) */
.status-text{font-weight:600;font-size:12px;white-space:nowrap;}
.status-text-in-use{color:var(--success);}
.status-text-confirmed{color:var(--primary);}
.status-text-draft{color:var(--text-muted);}
.status-text-pending{color:var(--warning);}
.status-text-rejected{color:var(--error);}
.status-text-settled{color:var(--teal);}
.status-text-matured{color:var(--purple);}

.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.empty-state .big{font-size:28px;margin-bottom:6px;}

.table-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  flex-wrap:wrap;
  gap:10px;
  flex:0 0 auto;
  border-top:1px solid var(--border);
}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.page-size-select select{height:28px;border:1px solid var(--border-strong);border-radius:6px;font-size:11.5px;padding:0 6px;}

.pagination{display:flex;align-items:center;gap:4px;}
.pagination button{
  min-width:28px;height:28px;
  border:1px solid var(--border-strong);
  background:#fff;
  border-radius:6px;
  font-size:11.5px;
  cursor:pointer;
  color:var(--text);
  transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
.pagination button:active:not(:disabled){transform:translateY(1px);}

.hotspot{color:var(--primary-dark);font-weight:700;cursor:pointer;background:none;border:none;padding:0;font:inherit;font-weight:700;}
.hotspot:hover{text-decoration:underline;color:var(--primary);}
.cell-muted{color:var(--text-faint);}
.status-text-fixed{color:var(--purple);}
.status-text-posted{color:var(--success);}
.neg{color:var(--error);}
.btn.drop-ready{border-style:dashed;border-color:var(--primary-light);}
.table-footer .showing{font-size:11.5px;color:var(--text-muted);margin-left:14px;}
.table-footer .left{display:flex;align-items:center;}

/* Modals */
.modal.w-sm{width:440px;}
.modal.w-md{width:min(760px, calc(100vw - 40px));}
.modal.w-lg{width:min(920px, calc(100vw - 40px));}
.modal .modal-sub{margin:-6px 0 12px;font-size:12px;color:var(--text-muted);}
.modal .modal-actions{justify-content:flex-end;}
.modal .modal-actions .btn{flex:0 0 auto;min-width:96px;}
.modal p.confirm-body{margin:0 0 6px;color:var(--text);font-size:13px;line-height:1.55;}
.modal .param-table{width:100%;border-collapse:collapse;margin-bottom:12px;}
.modal .param-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-size:12.5px;}
.modal .param-table td:first-child{color:var(--text-muted);width:38%;}
.modal .param-table td:last-child{font-weight:600;}
.run-note{margin-top:10px;padding:8px 10px;background:var(--primary-tint);border:1px solid #BEE0F7;border-radius:var(--radius-sm);font-size:11.5px;color:var(--text-muted);}
.run-summary{display:flex;gap:16px;margin:0 0 10px;font-size:12.5px;}
.run-summary b{font-weight:700;}
.res-ok{color:var(--success);font-weight:600;}
.res-info{color:var(--primary);font-weight:600;}
.res-warn{color:var(--warning);font-weight:600;}
.popup-table-wrap{max-height:300px;}
table.popup-table{min-width:0;}

/* Bank settlement letter (screen 9001) */
.letter{border:1px solid var(--border);border-radius:var(--radius-md);background:#fff;padding:18px 22px;font-size:13px;line-height:1.55;}
.letter .l-date{text-align:right;color:var(--text-muted);margin-bottom:10px;}
.letter .l-bank{font-weight:700;}
.letter .l-attn{font-weight:700;margin-top:8px;}
.letter .l-re{margin-top:12px;}
.letter .l-re b{margin-right:6px;}
.letter .l-vdate{font-weight:700;margin-bottom:12px;}
.letter .l-grid{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px;}
.letter table.popup-table{width:100%;}
.letter .l-sign{margin-top:18px;}
.letter .l-sign .l-auth{font-weight:600;}
.letter .l-sign .l-faith{margin-top:26px;}
.letter .l-sign .l-co{font-weight:700;margin-top:4px;}

/* Hover lift without scaling so pinned (sticky) columns stay pixel-aligned */
table.mc-table tbody tr:hover{transform:translateY(-1px);}

</style>

    <div class="header-text">
      <h1>FX NDF Settlement</h1>
      <p>Bank settlement of TSF NDF deals</p>
    </div>
    <button class="btn btn-secondary" id="btnRefresh" title="Reload deals from the database">↻ Refresh</button>
  </div>

  <div class="table-col">
  <div class="card">
    <div class="section-title"><span class="dot"></span>NDF Deals for Bank Settlement</div>

    <div class="table-toolbar" id="toolbar">
      <div class="tb-field tb-search">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input id="tableSearch" placeholder="Search deals..." autocomplete="off" aria-label="Search deals">
        </div>
      </div>

      <div class="tb-field tb-w-co" id="field-bukrs">
        <label>Company Code<span class="req">*</span></label>
        <div class="ms" id="ms-bukrs">
          <button type="button" class="ms-trigger" id="msTrigger" aria-haspopup="listbox"><span class="ms-text" id="msText"></span><span class="caret"></span></button>
          <div class="ms-panel" id="msPanel" role="listbox"></div>
        </div>
      </div>

      <div class="tb-field tb-w-date" id="field-dateFrom">
        <label>Value Date From<span class="req">*</span></label>
        <div class="date-field">
          <input class="control" id="input-dateFrom" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off">
          <button type="button" class="date-icon" data-target="dateFrom" aria-label="Pick From date">📅</button>
          <div class="date-popup" id="popup-dateFrom"></div>
        </div>
      </div>

      <div class="tb-field tb-w-date" id="field-dateTo">
        <label>Value Date To<span class="opt">optional</span></label>
        <div class="date-field">
          <input class="control" id="input-dateTo" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off">
          <button type="button" class="date-icon" data-target="dateTo" aria-label="Pick To date">📅</button>
          <div class="date-popup" id="popup-dateTo"></div>
        </div>
      </div>

      <div class="tb-field tb-w-rfha" id="field-rfha">
        <label>Transaction No<span class="opt">optional</span></label>
        <div class="dd" id="dd-rfha">
          <input class="dd-input" id="input-rfha" placeholder="Select ..." autocomplete="off">
          <div class="dd-panel tb-panel" id="panel-rfha"></div>
        </div>
      </div>

      <div class="tb-field" id="field-posting">
        <label>Posting Type</label>
        <div class="seg" id="segPosting" role="radiogroup" aria-label="Posting Type">
          <button type="button" data-mode="view" role="radio" class="active">View Only</button>
          <button type="button" data-mode="post" role="radio">View With Posting</button>
        </div>
      </div>

      <div class="tb-field" id="field-execute" style="display:none;">
        <label>&nbsp;</label>
        <button class="btn btn-primary" id="btnExecute" title="Post all deals in the current selection, then reload the list">Execute</button>
      </div>

      <div class="tb-field tb-w-layout" id="field-layout">
        <label>Layout</label>
        <div class="dd" id="dd-layout">
          <input class="dd-input" id="input-layout" placeholder="Select ..." readonly autocomplete="off">
          <div class="dd-panel tb-panel" id="panel-layout"></div>
        </div>
      </div>

      <div class="tb-field">
        <label>&nbsp;</label>
        <button class="btn btn-secondary" id="btnReset" title="Restore the default selection, search, sort and page">Reset</button>
      </div>

      <div class="tb-actions" id="actionBar">
        <button class="btn btn-secondary" id="btnPreview" data-action="preview" disabled title="Preview the bank settlement letter for the selected deal">Preview Document</button>
        <button class="btn btn-secondary" id="btnPdf" data-action="pdf" disabled title="Generate the bank settlement letter as PDF">PDF</button>
        <button class="btn btn-secondary" id="btnTest" data-action="test" disabled title="Posting run in test mode for the selected deal">TBB1 Test Run</button>
        <button class="btn btn-primary" id="btnPost" data-action="post" disabled title="Posting run (update) for the selected deal">TBB1 Post</button>
      </div>
    </div>

    <div class="criteria-error" id="criteriaError" role="alert"></div>

    <div class="table-scroll">
      <table class="mc-table" id="dealTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="big">📄</div>
      <span id="emptyText">No NDF deals match the current selection.</span>
    </div>

    <div class="table-footer">
      <div class="left">
        <div class="page-size-select">
          Rows per page
          <select id="pageSizeSelect">
            <option value="8">8</option>
            <option value="12">12</option>
            <option value="20" selected>20</option>
          </select>
        </div>
        <span class="showing" id="showingText"></span>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  </div>

</div>

<!-- Transaction details (hotspot: Transaction No) -->
<div class="modal-overlay" id="dealModal">
  <div class="modal modal-left modal-scrollable w-md">
    <div class="modal-head-row"><h2>Transaction Details</h2><button type="button" class="modal-close-btn" data-close="dealModal" aria-label="Close">×</button></div>
    <div class="modal-sub" id="dealModalSub"></div>
    <div class="modal-body-scroll" id="dealModalBody"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-close="dealModal">Close</button></div>
  </div>
</div>

<!-- FI document (hotspot: FI Document) -->
<div class="modal-overlay" id="fiModal">
  <div class="modal modal-left modal-scrollable w-sm">
    <div class="modal-head-row"><h2>FI Document</h2><button type="button" class="modal-close-btn" data-close="fiModal" aria-label="Close">×</button></div>
    <div class="modal-body-scroll" id="fiModalBody"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-close="fiModal">Close</button></div>
  </div>
</div>

<!-- Bank settlement letter (screen 9001) -->
<div class="modal-overlay" id="letterModal">
  <div class="modal modal-left modal-scrollable w-lg">
    <div class="modal-head-row"><h2>Bank Settlement</h2><button type="button" class="modal-close-btn" data-close="letterModal" aria-label="Close">×</button></div>
    <div class="modal-body-scroll" id="letterBody"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-close="letterModal">Close</button></div>
  </div>
</div>

<!-- Posting run result -->
<div class="modal-overlay" id="runModal">
  <div class="modal modal-left modal-scrollable w-md">
    <div class="modal-head-row"><h2 id="runModalTitle">Posting Run</h2><button type="button" class="modal-close-btn" data-close="runModal" aria-label="Close">×</button></div>
    <div class="modal-body-scroll" id="runModalBody"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-close="runModal">Close</button></div>
  </div>

function esc(s){
  return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){ return (n<10?'0':'')+n; }
function isoToDate(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dateToIso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoToDmy(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function addDays(iso,n){ var d=isoToDate(iso); d.setDate(d.getDate()+n); return dateToIso(d); }
function rollBackWeekend(iso){ var d=isoToDate(iso); while(d.getDay()===0||d.getDay()===6){ d.setDate(d.getDate()-1); } return dateToIso(d); }
function prevBusinessDay(iso,n){
  var d=isoToDate(iso), c=0;
  while(c<n){ d.setDate(d.getDate()-1); var w=d.getDay(); if(w!==0&&w!==6) c++; }
  return dateToIso(d);
}
/* Lenient date parser: dd-mm-yyyy (also / . separators or ddmmyyyy) -> ISO or null */
function parseDateInput(str){
  var s=String(str||'').replace(/^\s+|\s+$/g,'');
  if(!s) return null;
  var m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s);
  if(!m) m=/^(\d{2})(\d{2})(\d{4})$/.exec(s);
  if(!m) return null;
  var d=+m[1], mo=+m[2], y=+m[3];
  var dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return y+'-'+pad2(mo)+'-'+pad2(d);
}
function formatAmount(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function formatRate(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:6,maximumFractionDigits:6}); }
function round(n,dec){ var f=Math.pow(10,dec); return Math.round(n*f)/f; }
function padLeft(s,len,ch){ s=String(s); while(s.length<len) s=ch+s; return s; }

/* Net NDF settlement in USD: Buy USD = N*(F-K)/F, Sell USD = opposite sign */
function calcNdfCashAmount(bs, notionalUsd, contractRate, fixingRate){
  var amt = notionalUsd * (fixingRate - contractRate) / fixingRate;
  if(bs==='S') amt = -amt;
  return round(amt,2);
}

  var trader = traders[seed[13]];
  var tradeDate = rollBackWeekend(addDays(vdate,-tenor));

/* Valid FI document of a deal: BKPF type TR, ref key 2 'TSF', not reversed / not a reversal */
function matchesFiDoc(b, rfha, cashCurr, dateFrom, dateTo){
  return b.waers===cashCurr && b.xblnr===rfha && b.blart==='TR' && b.xref2_hd==='TSF' &&
         b.xreversal!=='2' && b.xreversing!=='X' && b.budat>=dateFrom && b.budat<=dateTo;
}

/* FORM GET_DATA: selection + the report's own deletions + FI document lookup */
function getData(c, db){
  var from = c.dateFrom, to = c.dateTo || c.dateFrom;     /* S_DATE without HIGH behaves as EQ */
  var rows = [];
  db.vtbfha.forEach(function(r){
    if(c.bukrs.indexOf(r.bukrs)<0) return;                 /* bukrs IN s_bukrs */
    if(r.sgsart!=='12D') return;                           /* sgsart = '12D'   */
    if(c.rfha && String(r.rfha).indexOf(c.rfha)<0) return; /* rfha IN s_rfha   */
    if(r.delfz<from || r.delfz>to) return;                 /* delfz IN s_date  */
    if(r.saktiv==='3') return;                             /* saktiv <> 3      */
    rows.push(clone(r));
  });
  rows = rows.filter(function(r){ return !(r.txn_status < '07'); });
  rows = rows.filter(function(r){ return r.txn_status !== '08'; });
  /* sgsart+2(1) = 'D' AND txn_status <> '13'  -> only status 13 survives */
  rows = rows.filter(function(r){ return !(r.sgsart.charAt(2)==='D' && r.txn_status!=='13'); });
  rows.forEach(function(r){
    var hit = db.bkpf.filter(function(b){ return matchesFiDoc(b, r.rfha, r.cash_curr, from, to); })[0];
    r.fi_doc = hit ? hit.belnr : '';
    r.fi_gjahr = hit ? hit.gjahr : '';
  });
  return rows;
}

/* Standard posting run RFTBBB00 (simulated). Creates FI documents + flow rows unless test mode. */
function submitPostingRun(deals, keyDate, test){
  var results = [];
  deals.forEach(function(d){
    var existing = mockDb.bkpf.filter(function(b){ return matchesFiDoc(b, d.rfha, d.cash_curr, '0000-01-01', '9999-12-31'); })[0];
    if(existing){
      if(!test && !mockDb.vtbfhapo.some(function(p){return p.bukrs===d.bukrs && p.rfha===d.rfha;}))
        mockDb.vtbfhapo.push({bukrs:d.bukrs,rfha:d.rfha,rfhazu:d.rfhazul,sbewebe:'2'});   /* posted flow exists with the FI document */
      results.push({bukrs:d.bukrs, rfha:d.rfha, keyDate:keyDate, result:'Already posted', cls:'res-info', fiDoc:existing.belnr});
    } else if(test){
      results.push({bukrs:d.bukrs, rfha:d.rfha, keyDate:keyDate, result:'Would be posted', cls:'res-warn', fiDoc:''});
    } else {
      var belnr = String(mockDb.nextDocNo++);
      mockDb.bkpf.push({bukrs:d.bukrs,belnr:belnr,gjahr:d.delfz.substr(0,4),xblnr:d.rfha,waers:d.cash_curr,blart:'TR',budat:d.delfz,xref2_hd:'TSF',xreversal:'',xreversing:''});
      mockDb.vtbfhapo.push({bukrs:d.bukrs,rfha:d.rfha,rfhazu:d.rfhazul,sbewebe:'2'});
      results.push({bukrs:d.bukrs, rfha:d.rfha, keyDate:keyDate, result:'Posted', cls:'res-ok', fiDoc:belnr});
    }
  });
  return results;
}
/* After TBB1: where a posted flow exists (VTBFHAPO, sbewebe = '2') set VTBFHA-TXN_STATUS = '50' */
function updateStatusAfterPosting(deal){
  var hits = mockDb.vtbfhapo.filter(function(p){ return p.bukrs===deal.bukrs && p.rfha===deal.rfha && p.rfhazu===deal.rfhazul && p.sbewebe==='2'; });

/* =========================================================
   Table: column values, search, sort
   ========================================================= */
function cellValue(key, row){
  var col = columnCatalog[key], v = row[key];
  if(key==='txn_status'){ var m = txnStatusMeta[v]; return v+' - '+(m?m.text:v); }
  if(key==='fi_doc') return v||'';
  if(col.type==='date') return isoToDmy(v);
  if(col.type==='amount') return formatAmount(v);
  if(col.type==='rate') return formatRate(v);
  return v===undefined||v===null?'':String(v);
}
function cellHtml(key, row){
  var col = columnCatalog[key], v = row[key], txt = cellValue(key,row);
  if(key==='rfha') return '<button type="button" class="hotspot mono" data-hot="rfha" title="Display transaction">'+esc(txt)+'</button>';
  if(key==='fi_doc'){
    return v ? '<button type="button" class="hotspot mono" data-hot="fidoc" title="Display FI document">'+esc(txt)+'</button>' : '<span class="cell-muted">—</span>';
  }
  if(key==='txn_status'){ var m = txnStatusMeta[v] || {cls:'status-text-draft'}; return '<span class="status-text '+m.cls+'">'+esc(txt)+'</span>'; }
  if(col.type==='amount') return '<span class="'+(Number(v)<0?'neg':'')+'">'+esc(txt)+'</span>';
  return esc(txt);
}
function sortValue(key,row){
  var col = columnCatalog[key], v = row[key];
  if(col.type==='amount' || col.type==='rate') return Number(v);
  if(col.type==='date') return v||'';
  return String(key==='fi_doc'||key==='txn_status' ? v : cellValue(key,row)).toLowerCase();
}
function getVisibleRows(){
  var cols = findLayout(state.layout).cols;
  var list = state.rows.slice();
  var q = state.search.replace(/^\s+|\s+$/g,'').toLowerCase();
  if(q){
    var terms = q.split(/\s+/);
    list = list.filter(function(r){
      var hay = cols.map(function(k){ return cellValue(k,r); }).join(' | ').toLowerCase();
      return terms.every(function(t){ return hay.indexOf(t)>=0; });
    });
  }
  if(state.sort.field){
    var f = state.sort.field, dir = state.sort.dir==='asc'?1:-1;
    list.sort(function(a,b){
      var x = sortValue(f,a), y = sortValue(f,b);
      if(x<y) return -1*dir; if(x>y) return 1*dir; return 0;
    });
  }
  return list;
}
function getSelectedRow(){
  if(!state.selectedId) return null;
  return state.rows.filter(function(r){ return rowId(r)===state.selectedId; })[0] || null;

function renderTable(){
  var layout = findLayout(state.layout);
  var cols = layout.cols;
  var list = getVisibleRows();
  var total = list.length;
  var pageCount = Math.max(1, Math.ceil(total/state.pageSize));
  if(state.page>pageCount) state.page = pageCount;
  var start = (state.page-1)*state.pageSize;
  var pageRows = list.slice(start, start+state.pageSize);

  /* header */
  var h = '<tr><th class="no-sort action-col sticky-a"></th>';
  cols.forEach(function(k){
    var c = columnCatalog[k];
    var cls = [];
    if(c.type==='amount'||c.type==='rate') cls.push('num');
    if(k==='rfha') cls.push('sticky-b');
    if(state.sort.field===k) cls.push('sorted');
    h += '<th class="'+cls.join(' ')+'" data-sort="'+k+'" title="Click to sort">'+esc(c.label)+'<span class="sort-ind">'+(state.sort.field===k?(state.sort.dir==='asc'?'▲':'▼'):'')+'</span></th>';
  });
  h += '</tr>';
  document.getElementById('tableHead').innerHTML = h;

  /* body */
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  var empty = document.getElementById('emptyState');
  var tableEl = document.getElementById('dealTable');
  if(total===0){
    empty.style.display='block'; tableEl.style.display='none';
    document.getElementById('emptyText').textContent = state.errors.length
      ? 'Complete the required selection criteria to list NDF deals.'
      : (state.search ? 'No NDF deals match your search.' : 'No NDF deals match the current selection.');
  } else { empty.style.display='none'; tableEl.style.display='table'; }

  pageRows.forEach(function(r){
    var id = rowId(r);
    var tr = document.createElement('tr');
    tr.setAttribute('data-id', id);
    tr.tabIndex = 0;
    tr.draggable = true;
    tr.title = 'Click to select · drag onto an action button to run it';
    if(state.selectedId===id) tr.classList.add('selected');
    var html = '<td class="action-col sticky-a"><input type="checkbox" class="row-select-checkbox" aria-label="Select transaction '+esc(r.rfha)+'"'+(state.selectedId===id?' checked':'')+'></td>';
    cols.forEach(function(k){
      var c = columnCatalog[k], cls=[];
      if(c.type==='amount'||c.type==='rate') cls.push('num','mono');
      else if(c.type==='date'||k==='rfha'||k==='fi_doc'||k==='kontrh') cls.push('mono');
      if(k==='rfha') cls.push('sticky-b');
      html += '<td class="'+cls.join(' ')+'">'+cellHtml(k,r)+'</td>';
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });

  /* footer */
  document.getElementById('showingText').textContent = total ? ('Showing '+(start+1)+'–'+(start+pageRows.length)+' of '+total) : 'Showing 0 of 0';
  renderPagination(pageCount);
  renderToolbarState();
}
function renderPagination(pageCount){
  var el = document.getElementById('pagination');
  el.innerHTML = '';
  function mk(label, disabled, active, fn){
    var b = document.createElement('button');
    b.type='button'; b.textContent = label; b.disabled = disabled;
    if(active) b.classList.add('active');
    b.addEventListener('click', fn);
    el.appendChild(b);
  }
  mk('‹', state.page<=1, false, function(){ state.page--; renderTable(); });
  for(var p=1;p<=pageCount;p++){ (function(p){ mk(String(p), false, p===state.page, function(){ state.page=p; renderTable(); }); })(p); }
  mk('›', state.page>=pageCount, false, function(){ state.page++; renderTable(); });
}

/* Minimal single-page PDF writer (Helvetica, ASCII only) */
function pdfEscape(s){ return String(s).replace(/[^\x20-\x7E]/g,'-').replace(/([\\()])/g,'\\$1'); }
function buildPdf(items){
  var ops = '';
  items.forEach(function(it){
    if(it.rule){ ops += '0.8 G 50 '+it.y+' m 545 '+it.y+' l S\n'; return; }
    ops += 'BT /'+(it.bold?'F2':'F1')+' '+(it.size||10)+' Tf '+(it.x||50)+' '+it.y+' Td ('+pdfEscape(it.t)+') Tj ET\n';
  });
  var objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>',
    '<< /Length '+ops.length+' >>\nstream\n'+ops+'endstream',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'
  ];
  var out = '%PDF-1.4\n', offsets = [];
  objs.forEach(function(o,i){ offsets.push(out.length); out += (i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  var xref = out.length;
  out += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(function(o){ out += padLeft(o,10,'0')+' 00000 n \n'; });
  out += 'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  var bytes = new Uint8Array(out.length);
  for(var i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 255;
  return new Blob([bytes], {type:'application/pdf'});
}
function downloadBlob(filename, blob){
  if(window.navigator && window.navigator.msSaveBlob){ window.navigator.msSaveBlob(blob, filename); return; }
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function generatePdf(row){
  var m = buildLetterModel(row), a = m.addr, r = row, y = 790, items = [];
  function line(t, o){ o = o||{}; items.push({t:t, y:y, bold:o.bold, size:o.size, x:o.x}); y -= (o.gap||15); }
  line(a.zdate, {x:480});
  y -= 6;
  line(a.zbank, {bold:true, size:11});
  line(a.zaddr1); line(a.zaddr2); line(a.zaddr3);
  y -= 4; line(a.zattn, {bold:true});
  y -= 8; line('RE: '+m.reg, {bold:true, size:11});
  line(a.zvdate, {bold:true});
  y -= 4; items.push({rule:true, y:y}); y -= 18;
  [['Transaction No', r.rfha],['Company Code', r.bukrs],['Company Name', m.company],['Business Partner', r.kontrh+'  '+r.bp_name],
   ['Trade Date', isoToDmy(r.dblfz)],['Value Date', isoToDmy(r.delfz)],['Fixing Date', isoToDmy(r.ndf_date)],
   ['NDF Rate', formatRate(r.ndf_rate)],['Cash Amount', r.cash_curr+' '+formatAmount(r.zcash_amt)]].forEach(function(p){
    items.push({t:p[0]+':', y:y, bold:true, x:50}); items.push({t:p[1], y:y, x:170}); y -= 16;
  });
  y -= 2; items.push({rule:true, y:y}); y -= 18;
  m.lines.forEach(function(l){ line(l); });
  y -= 30; line('Authorized Signatories', {bold:true});
  y -= 34; line('Yours Faithfully');
  line(m.company, {bold:true});
  var name = 'NDF_Bank_Settlement_'+r.rfha+'.pdf';
  downloadBlob(name, buildPdf(items));
  showToast('PDF generated: '+name);
}

/* =========================================================
   TEST / TBB1: posting run (RFTBBB00)
   ========================================================= */
function showRunResult(title, params, results, notes){
  document.getElementById('runModalTitle').textContent = title;
  var posted = results.filter(function(r){return r.result==='Posted';}).length;
  var already = results.filter(function(r){return r.result==='Already posted';}).length;
  var would = results.filter(function(r){return r.result==='Would be posted';}).length;
  var html = '<table class="param-table">'+params.map(function(p){ return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>'; }).join('')+'</table>';
  html += '<div class="run-summary">'+
    (would?'<span><b>'+would+'</b> would be posted</span>':'')+
    (posted?'<span><b>'+posted+'</b> posted</span>':'')+
    (already?'<span><b>'+already+'</b> already posted</span>':'')+'</div>';
  html += '<div class="popup-table-wrap"><table class="popup-table"><thead><tr><th>Company Code</th><th>Transaction No</th><th>Key Date</th><th>Result</th><th>FI Document</th></tr></thead><tbody>'+
    results.map(function(r){
      return '<tr><td>'+esc(r.bukrs)+'</td><td class="mono">'+esc(r.rfha)+'</td><td class="mono">'+esc(isoToDmy(r.keyDate))+'</td><td><span class="'+r.cls+'">'+esc(r.result)+'</span></td><td class="mono">'+(r.fiDoc?esc(r.fiDoc):'<span class="cell-muted">—</span>')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  html += '<div class="run-note">'+notes+'</div>';
  document.getElementById('runModalBody').innerHTML = html;
  openModal('runModal');
}
function runSingleTest(row){
  var res = submitPostingRun([row], row.delfz, true);
  showRunResult('TBB1 Test Run', [
    ['Company Code',row.bukrs],['Transaction No',row.rfha],['Key Date (Value Date)',isoToDmy(row.delfz)],['Run mode','Test run – no update']
  ], res, 'Demo simulation of the standard posting run (RFTBBB00) in test mode. No documents are created and no status is changed.');
}
function confirmSinglePost(row){
  showConfirm('TBB1 Post',
    '<p class="confirm-body">Post transaction <b>'+esc(row.rfha)+'</b> ('+esc(row.bukrs)+') with key date <b>'+esc(isoToDmy(row.delfz))+'</b>?</p>'+
    '<p class="confirm-body" style="color:var(--text-muted);font-size:12px;">This runs the posting update and cannot be undone.</p>',
    'Post', function(){ runSinglePost(row); });
}
function runSinglePost(row){
  var res = submitPostingRun([row], row.delfz, false);
  var updated = updateStatusAfterPosting(row);
  reloadDbView(); refreshView();            /* posted deals drop out of the list straight away */
  showRunResult('TBB1 Post', [
    ['Company Code',row.bukrs],['Transaction No',row.rfha],['Key Date (Value Date)',isoToDmy(row.delfz)],['Run mode','Update run']
  ], res, 'Demo simulation of the standard posting run (RFTBBB00).'+
     (updated ? ' Transaction status set to 50 and removed from the list.' : ' No posted flow found, so the transaction remains in the list.'));
}
/* View With Posting + Execute: START-OF-SELECTION -> ALL_POSTING for every deal in the selection */
function confirmPostAll(){
  if(state.errors.length || !state.rows.length) return;
  var keyDate = state.criteria.dateTo || state.criteria.dateFrom;
  showConfirm('Execute with Posting',
    '<p class="confirm-body">Post all <b>'+state.rows.length+'</b> deal(s) in the current selection with key date <b>'+esc(isoToDmy(keyDate))+'</b>, then reload the list?</p>'+
    '<p class="confirm-body" style="color:var(--text-muted);font-size:12px;">This runs the posting update and cannot be undone.</p>',
    'Post All', function(){ runPostAll(keyDate); });
}
function runPostAll(keyDate){
  var deals = state.rows.slice();
  var res = submitPostingRun(deals, keyDate, false);
  deals.forEach(function(d){ updateStatusAfterPosting(d); });   /* posted deals leave the list */
  reloadDbView();               /* ALL_POSTING ends with GET_DATA */
  refreshView();
  showRunResult('Execute with Posting', [
    ['Company Code', state.criteria.bukrs.join(', ')],
    ['Value Date', isoToDmy(state.criteria.dateFrom)+(state.criteria.dateTo?' to '+isoToDmy(state.criteria.dateTo):'')],
    ['Key Date', isoToDmy(keyDate)], ['Run mode','Update run – all deals in selection']
  ], res, 'Demo simulation of the standard posting run (RFTBBB00). Posted transactions now carry status 50 and have been removed from the list.');
}

/* =========================================================
   Actions (toolbar buttons AND drag-and-drop share the same handler)
   ========================================================= */
var actionHandlers = {
  preview:function(row){ openLetterPreview(row); },
  pdf:function(row){ generatePdf(row); },
  test:function(row){ runSingleTest(row); },
  post:function(row){ confirmSinglePost(row); }
};
function invokeAction(name){
  var row = getSelectedRow();
  if(!row){ showToast('Select a transaction first.', true); return; }
  actionHandlers[name](row);
}

/* =========================================================
   Controls: date pickers (custom inline calendar)
   ========================================================= */
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function closeAllPickers(except){
  document.querySelectorAll('.date-popup.open').forEach(function(p){ if(p!==except) p.classList.remove('open'); });
  document.querySelectorAll('.ms.open,.dd.open').forEach(function(p){ p.classList.remove('open'); });
}
function positionPopup(wrap, popup){
  popup.style.position='fixed';
  var r = wrap.getBoundingClientRect(), pw = popup.offsetWidth, ph = popup.offsetHeight, m = 8;
  var left = Math.min(Math.max(m, r.left), window.innerWidth - pw - m);
  var top = r.bottom + 6;
  if(top + ph > window.innerHeight - m) top = Math.max(m, r.top - 6 - ph);
  popup.style.left = left+'px'; popup.style.top = top+'px';
}

function initDatePicker(key){
  var input = document.getElementById('input-'+key);
  var btn = document.querySelector('.date-icon[data-target="'+key+'"]');
  var popup = document.getElementById('popup-'+key);
  var wrap = input.closest('.date-field');
  var which = key==='dateFrom' ? 'from' : 'to';
  var view = {y:2026, m:9};    /* only (re)initialised when the calendar opens */

  function currentIso(){ return state.criteria[key]; }

  function render(){
    var sel = currentIso();
    var first = new Date(view.y, view.m, 1), startOffset = first.getDay();
    var dim = new Date(view.y, view.m+1, 0).getDate(), dpm = new Date(view.y, view.m, 0).getDate();
    var html = '<div class="cal-head"><button type="button" data-nav="-1" aria-label="Previous month">‹</button><div class="cal-sel">'+
      '<select class="cal-month" aria-label="Month">'+MONTHS.map(function(n,i){ return '<option value="'+i+'"'+(i===view.m?' selected':'')+'>'+n+'</option>'; }).join('')+'</select>'+
      '<select class="cal-year" aria-label="Year">';
    for(var y=2020;y<=2035;y++) html += '<option value="'+y+'"'+(y===view.y?' selected':'')+'>'+y+'</option>';
    html += '</select></div><button type="button" data-nav="1" aria-label="Next month">›</button></div><div class="cal-grid">';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){ html += '<div class="dow">'+d+'</div>'; });
    var i, iso;
    for(i=0;i<startOffset;i++){
      var pd = dpm - startOffset + 1 + i;
      iso = dateToIso(new Date(view.y, view.m-1, pd));
      html += '<div class="day muted" data-iso="'+iso+'">'+pd+'</div>';
    }
    for(var d=1; d<=dim; d++){
      iso = view.y+'-'+pad2(view.m+1)+'-'+pad2(d);
      var cls = 'day'+(iso===sel?' selected':'')+(iso===AS_OF?' today':'');
      html += '<div class="'+cls+'" data-iso="'+iso+'">'+d+'</div>';
    }
    var trailing = (7 - ((startOffset+dim) % 7)) % 7;
    for(i=1;i<=trailing;i++){
      iso = dateToIso(new Date(view.y, view.m+1, i));
      html += '<div class="day muted" data-iso="'+iso+'">'+i+'</div>';
    }
    html += '</div>';
    popup.innerHTML = html;

    popup.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var d2 = new Date(view.y, view.m + parseInt(b.getAttribute('data-nav'),10), 1);
        view.y = d2.getFullYear(); view.m = d2.getMonth();
        render(); positionPopup(wrap, popup);
      });
    });
    popup.querySelector('.cal-month').addEventListener('change', function(e){ view.m = parseInt(e.target.value,10); render(); positionPopup(wrap, popup); });
    popup.querySelector('.cal-year').addEventListener('change', function(e){ view.y = parseInt(e.target.value,10); render(); positionPopup(wrap, popup); });
    popup.querySelector('.cal-head').addEventListener('click', function(e){ e.stopPropagation(); });
    popup.querySelectorAll('.day').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        setDate(el.getAttribute('data-iso'));
        popup.classList.remove('open');
      });
    });
  }
  function setDate(iso){
    state.dateErr[which] = '';
    state.criteria[key] = iso;
    input.value = isoToDmy(iso);
    state.page = 1;
    refreshView();
  }
  function openPopup(){
    closeAllPickers(popup);
    var base = currentIso() || AS_OF;
    var p = base.split('-'); view.y = +p[0]; view.m = +p[1]-1;     /* initialise month ONLY on open */
    render();
    popup.classList.add('open');
    positionPopup(wrap, popup);
  }
  function togglePopup(e){ if(e) e.stopPropagation(); if(popup.classList.contains('open')) popup.classList.remove('open'); else openPopup(); }

  /* manual typing */
  function commitTyped(final){
    var raw = input.value;
    if(!raw.replace(/\s/g,'')){
      state.dateErr[which]=''; state.criteria[key]=''; state.page=1; refreshView(); return;
    }
    var iso = parseDateInput(raw);
    if(iso){
      state.dateErr[which]=''; state.criteria[key]=iso;
      if(final) input.value = isoToDmy(iso);
      state.page=1; refreshView();
    } else if(final){
      state.dateErr[which]='x'; state.criteria[key]=''; state.page=1; refreshView();
    }
  }
  input.addEventListener('input', function(){ if(/^\d{2}-\d{2}-\d{4}$/.test(input.value)) commitTyped(false); });
  input.addEventListener('blur', function(){ commitTyped(true); });
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commitTyped(true); popup.classList.remove('open'); } if(e.key==='Escape'){ popup.classList.remove('open'); } });
  btn.addEventListener('click', togglePopup);
  popup.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) popup.classList.remove('open'); });
  document.addEventListener('scroll', function(e){ if(popup.classList.contains('open') && !popup.contains(e.target)) popup.classList.remove('open'); }, true);
  window.addEventListener('resize', function(){ if(popup.classList.contains('open')) positionPopup(wrap, popup); });
}

/* =========================================================
   Controls: Company Code multi-select (S_BUKRS)
   ========================================================= */
function initCompanySelect(){
  var wrap = document.getElementById('ms-bukrs'), trig = document.getElementById('msTrigger'), panel = document.getElementById('msPanel');
  panel.innerHTML = companies.map(function(c){
    return '<label class="ms-item"><input type="checkbox" value="'+c.code+'"><span class="ms-code">'+c.code+'</span><span class="ms-name">'+esc(c.name)+'</span></label>';
  }).join('') + '<div class="ms-foot"><button type="button" class="btn btn-ghost" data-ms="all">Select all</button><button type="button" class="btn btn-ghost" data-ms="none">Clear</button></div>';
  function apply(list){ state.criteria.bukrs = list; state.page = 1; refreshView(); }
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var was = wrap.classList.contains('open');
    closeAllPickers();
    if(!was){
      wrap.classList.add('open');
      var r = trig.getBoundingClientRect();
      panel.classList.toggle('align-right', r.left + 270 > window.innerWidth);
    }
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  panel.addEventListener('change', function(e){
    if(e.target.type!=='checkbox') return;
    var list = [];
    panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){ if(cb.checked) list.push(cb.value); });
    apply(list);
  });
  panel.querySelectorAll('[data-ms]').forEach(function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-ms')==='all' ? companies.map(function(c){return c.code;}) : []); });
  });
}

/* =========================================================
   Controls: searchable dropdowns (Transaction No, Layout variant)
   ========================================================= */
function initDropdown(cfg){
  var wrap = document.getElementById('dd-'+cfg.key), input = document.getElementById('input-'+cfg.key), panel = document.getElementById('panel-'+cfg.key);
  function renderPanel(filter){
    var items = cfg.items(filter||'');
    if(!items.length){ panel.innerHTML = '<div class="dd-empty">No matches</div>'; return; }
    panel.innerHTML = items.map(function(it, i){
      return '<div class="dd-item'+(it.selected?' selected-item active':'')+'" data-i="'+i+'"><span class="primary-line">'+esc(it.primary)+'</span>'+(it.secondary?'<span class="secondary-line">'+esc(it.secondary)+'</span>':'')+'</div>';
    }).join('');
    panel.querySelectorAll('.dd-item').forEach(function(el){
      el.addEventListener('mousedown', function(e){ e.preventDefault(); });
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var it = items[parseInt(el.getAttribute('data-i'),10)];
        input.value = it.value; wrap.classList.remove('open'); cfg.onSelect(it.value);
      });
    });
  }
  function open(filter){
    closeAllPickers();
    renderPanel(filter);
    var r = input.getBoundingClientRect();
    panel.classList.toggle('align-right', r.left + 260 > window.innerWidth);
    wrap.classList.add('open');
  }
  input.addEventListener('click', function(e){ e.stopPropagation(); if(wrap.classList.contains('open')) wrap.classList.remove('open'); else open(cfg.typing ? '' : ''); });
  input.addEventListener('focus', function(){ if(cfg.typing && !wrap.classList.contains('open')) open(''); });
  if(cfg.typing){
    input.addEventListener('input', function(){
      renderPanel(input.value); wrap.classList.add('open');
      cfg.onType(input.value);
    });
    input.addEventListener('keydown', function(e){ if(e.key==='Escape') wrap.classList.remove('open'); });
  }
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
}

/* =========================================================
   Event wiring
   ========================================================= */
function initEvents(){
  /* search across every rendered column */
  document.getElementById('tableSearch').addEventListener('input', function(e){ state.search = e.target.value; state.page = 1; renderTable(); });

  /* posting type (radio group) */
  document.querySelectorAll('#segPosting button').forEach(function(b){
    b.addEventListener('click', function(){ state.postingType = b.getAttribute('data-mode'); renderToolbarState(); });
  });
  document.getElementById('btnExecute').addEventListener('click', confirmPostAll);

  /* Reset: back to the initial screen state */
  document.getElementById('btnReset').addEventListener('click', resetScreen);
  /* Refresh (REF): re-read the database */
  document.getElementById('btnRefresh').addEventListener('click', function(){
    closeAllModals();
    state.search=''; document.getElementById('tableSearch').value='';
    state.sort={field:null,dir:'asc'}; state.page=1; state.selectedId=null;
    reloadDbView(); refreshView();
    showToast('Deals reloaded from the database.');
  });

  /* table: sort, select, hotspots */
  document.getElementById('tableHead').addEventListener('click', function(e){
    var th = e.target.closest('th[data-sort]'); if(!th) return;
    var k = th.getAttribute('data-sort');
    if(state.sort.field===k) state.sort.dir = state.sort.dir==='asc'?'desc':'asc'; else { state.sort.field=k; state.sort.dir='asc'; }
    renderTable();
  });
  var tbody = document.getElementById('tableBody');
  tbody.addEventListener('click', function(e){
    var tr = e.target.closest('tr'); if(!tr) return;
    var id = tr.getAttribute('data-id');
    var hot = e.target.closest('[data-hot]');
    var row = state.rows.filter(function(r){ return rowId(r)===id; })[0];
    if(e.target.classList.contains('row-select-checkbox')){
      e.stopPropagation();
      if(e.target.checked) selectRow(id); else deselectRow();
      return;
    }
    selectRow(id);
    if(hot && row){
      if(hot.getAttribute('data-hot')==='rfha') openTransactionDetail(row); else openFiDocument(row);
    }
  });
  tbody.addEventListener('keydown', function(e){
    if((e.key==='Enter'||e.key===' ') && e.target.tagName==='TR'){ e.preventDefault(); selectRow(e.target.getAttribute('data-id')); }
  });
  document.getElementById('pageSizeSelect').addEventListener('change', function(e){ state.pageSize = parseInt(e.target.value,10); state.page = 1; renderTable(); });

  /* action buttons */
  document.querySelectorAll('#actionBar .btn').forEach(function(b){
    b.addEventListener('click', function(){ invokeAction(b.getAttribute('data-action')); });
  });

  /* drag a selected row onto an action button = same handler as the button */
  tbody.addEventListener('dragstart', function(e){
    var tr = e.target.closest ? e.target.closest('tr') : null; if(!tr){ return; }
    var id = tr.getAttribute('data-id');
    selectRow(id);
    state.draggedId = id;
    tr.classList.add('dragging');
    var row = getSelectedRow();
    var ghost = document.createElement('div'); ghost.className='drag-ghost'; ghost.textContent = row ? (row.rfha+' — '+row.bp_name) : id;
    document.body.appendChild(ghost);
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed='copy';
      try{ e.dataTransfer.setData('text/plain', id); }catch(err){}
      if(e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(ghost, 12, 14);
    }
    setTimeout(function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
    document.querySelectorAll('#actionBar .btn').forEach(function(b){ b.classList.add('drop-ready'); });
  });
  tbody.addEventListener('dragend', function(){ endDrag(); });
  document.querySelectorAll('#actionBar .btn').forEach(function(b){
    b.addEventListener('dragover', function(e){ if(!state.draggedId) return; e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy'; b.classList.add('drag-over'); });
    b.addEventListener('dragleave', function(){ b.classList.remove('drag-over'); });
    b.addEventListener('drop', function(e){
      e.preventDefault(); b.classList.remove('drag-over');
      var had = state.draggedId; endDrag();
      if(!had){ showToast('This action requires a transaction row.', true); return; }
      invokeAction(b.getAttribute('data-action'));
    });
  });

  /* modals */
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ closeModal(b.getAttribute('data-close')); }); });
  document.querySelectorAll('.modal-overlay').forEach(function(o){
    o.addEventListener('mousedown', function(e){ if(e.target===o && o.id!=='confirmModal') closeModal(o.id); });
  });
  document.getElementById('btnConfirmOk').addEventListener('click', function(){
    var fn = state.confirmAction; state.confirmAction = null;
    closeModal('confirmModal');
    if(fn) setTimeout(fn, 170);
  });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    var open = document.querySelectorAll('.modal-overlay.open');
    if(open.length) closeModal(open[open.length-1].id);
  });

  /* click outside closes dropdown panels */
  document.addEventListener('click', function(){ document.querySelectorAll('.ms.open,.dd.open').forEach(function(p){ p.classList.remove('open'); }); });
}
function endDrag(){
  state.draggedId = null;
  document.querySelectorAll('#tableBody tr.dragging').forEach(function(t){ t.classList.remove('dragging'); });
  document.querySelectorAll('#actionBar .btn').forEach(function(b){ b.classList.remove('drag-over'); b.classList.remove('drop-ready'); });
}

/* Reset: restores selection criteria, search, sort, page, layout, posting type and row selection */
function resetScreen(){
  closeAllPickers(); closeAllModals();
  state.criteria = {bukrs:DEFAULTS.bukrs.slice(), dateFrom:DEFAULTS.dateFrom, dateTo:DEFAULTS.dateTo, rfha:DEFAULTS.rfha};
  state.dateErr = {from:'', to:''};
  state.postingType = DEFAULTS.postingType; state.layout = DEFAULTS.layout;
  state.search=''; state.sort={field:null,dir:'asc'}; state.page=1; state.selectedId=null;
  state.pageSize = DEFAULTS.pageSize;
  syncInputs();
  refreshView();
}
function syncInputs(){
  document.getElementById('tableSearch').value = state.search;
  document.getElementById('input-dateFrom').value = isoToDmy(state.criteria.dateFrom);
  document.getElementById('input-dateTo').value = isoToDmy(state.criteria.dateTo);
  document.getElementById('input-rfha').value = state.criteria.rfha;
  document.getElementById('input-layout').value = state.layout;
  document.getElementById('pageSizeSelect').value = String(state.pageSize);
}

/* =========================================================
   Initialisation
   ========================================================= */
function init(){
  reloadDbView();
  initCompanySelect();
  initDatePicker('dateFrom'); initDatePicker('dateTo');
  initDropdown({
    key:'rfha', typing:true,
    items:function(filter){
      /* deals that pass the report's own selection (company / dates), listed by transaction number */
      var probe = {bukrs:state.criteria.bukrs, dateFrom:state.criteria.dateFrom||'0000-01-01', dateTo:state.criteria.dateTo||state.criteria.dateFrom||'9999-12-31', rfha:''};
      var list = state.errors.some(function(e){return e.key==='bukrs';}) ? [] : getData(probe, state.dbView);
      var f = String(filter||'').toLowerCase();
      return list.filter(function(r){ return !f || r.rfha.indexOf(f)>=0 || r.bp_name.toLowerCase().indexOf(f)>=0; })
                 .map(function(r){ return {value:r.rfha, primary:r.rfha, secondary:r.bukrs+' · '+r.bp_name, selected:r.rfha===state.criteria.rfha}; });
    },
    onType:function(txt){ state.criteria.rfha = txt.replace(/^\s+|\s+$/g,''); state.page=1; refreshView(); },
    onSelect:function(v){ state.criteria.rfha = v; state.page=1; refreshView(); }
  });
  initDropdown({
    key:'layout', typing:false,
    items:function(){ return layoutVariants.map(function(l){ return {value:l.id, primary:l.id, secondary:l.text, selected:l.id===state.layout}; }); },
    onSelect:function(v){ state.layout = v; state.sort={field:null,dir:'asc'}; renderTable(); }
  });
  initEvents();
  syncInputs();
  refreshView();
}
init();
