<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Workbench</title>
<style>
/* =========================================================
   Design system
   ========================================================= */
:root{
  --bg:#F4F8FC;
  --card:#FFFFFF;
  --text:#1D2D3E;
  --text-muted:#5C7085;
  --text-faint:#8CA0B3;
  --border:#E1E9F2;
  --border-strong:#CBD9E8;
  --primary:#1F6FEB;
  --primary-dark:#1657C4;
  --primary-light:#6FA8FF;
  --primary-tint:#EAF2FF;
  --success:#27AE60;
  --success-tint:#E8F8EF;
  --warning:#FF8A00;
  --warning-tint:#FFF3E4;
  --error:#E74C3C;
  --error-tint:#FDEAE8;
  --teal:#17BEBB;
  --teal-tint:#E7FAF9;
  --purple:#8E44AD;
  --purple-tint:#F5EAFA;
  --gray-tint:#EEF2F6;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(22,39,64,0.04), 0 4px 14px rgba(22,39,64,0.06);
  --shadow-pop:0 8px 28px rgba(22,39,64,0.16);
  --font:'Inter',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:12.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);}
input,select,textarea{font-family:var(--font);}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#C7D4E2;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   Layout
   ========================================================= */
.app{
  max-width:100%;
  margin:0;
  padding:0.3rem 0.2rem 0.5rem;
}

.table-col{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 210px);
}
.table-col > .card{
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  min-height:0;
  margin-bottom:0;
}
.table-col .table-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
}
@media (max-width:1080px){
  .table-col{
    max-height:none;
  }
  .table-col .table-scroll{max-height:520px;}
}

.page-actions-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px;
}

/* KPI cards */
.kpi-row{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.kpi-card{
  flex:1 1 180px;
  min-width:170px;
  background:var(--card);
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  min-height:64px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-left-color .18s ease;
}
.kpi-card:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(22,39,64,0.08), 0 10px 22px rgba(22,39,64,0.09);
  border-left-color:var(--primary-dark);
}
.kpi-card .kpi-value{
  font-size:30px;
  font-weight:700;
  color:var(--primary-dark);
  line-height:1.15;
}
.kpi-card .kpi-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
}

.create-card{border-left-color:var(--primary);}
.create-card .create-icon-circle{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  font-weight:700;
  line-height:1;
  transition:background .18s ease, transform .18s ease;
}
.create-card .kpi-label{color:var(--text);font-weight:700;font-size:13px;}
.create-card:hover .create-icon-circle{
  background:var(--primary-dark);
  transform:scale(1.08);
}
.create-card:hover{border-left-color:var(--primary-dark);}

/* Header */
.page-header{
  margin-bottom:12px;
  background:#EAF3FF;
  border:1px solid #D7E9FF;
  border-radius:var(--radius-md);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}
.page-header .logo-img{
  height:40px;
  width:auto;
  max-width:120px;
  object-fit:contain;
  flex:none;
}
.page-header .logo-placeholder{
  height:36px;
  width:36px;
  flex:none;
  border-radius:8px;
  border:1px dashed var(--border-strong);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--text-faint);
}
.page-header .header-text{display:flex;flex-direction:column;}

/* Compact form rows with variable-width fields */
.form-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  margin-bottom:12px;
}
.form-row:last-child{margin-bottom:0;}
.form-row > .field{flex:1 1 160px;min-width:0;}
.field.w-sm{flex:0 1 100px;}
.field.w-sm-md{flex:0 1 124px;}
.field.w-md{flex:0 1 154px;}
.field.w-md-wide{flex:0 1 184px;}
.field.w-wide{flex:1 1 190px;min-width:165px;}
.field.w-date{flex:0 0 156px;min-width:156px;}
.form-row.no-wrap{flex-wrap:nowrap;}
.form-row.no-wrap > .field{min-width:0;}
.field.fx-field{flex:1 1 0;min-width:130px;}

/* 12-column responsive grid for the Create Master Contract modal.
   Each field gets a span sized to what its value actually needs,
   rather than forcing every field to equal width. */
.form-grid-12{
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:10px 12px;
  margin-bottom:14px;
}
.form-grid-12:last-child{margin-bottom:0;}
.form-grid-12 > .field{min-width:0;}
.gc-3{grid-column:span 3;}
.gc-4{grid-column:span 4;}
.gc-5{grid-column:span 5;}
.gc-6{grid-column:span 6;}
.gc-7{grid-column:span 7;}
@media (max-width:700px){
  .form-grid-12{grid-template-columns:repeat(6, 1fr);}
  .gc-3{grid-column:span 3;}
  .gc-4{grid-column:span 3;}
  .gc-5{grid-column:span 6;}
  .gc-6{grid-column:span 6;}
  .gc-7{grid-column:span 6;}
}
@media (max-width:460px){
  .form-grid-12{grid-template-columns:1fr;}
  .gc-3, .gc-4, .gc-5, .gc-6, .gc-7{grid-column:span 1;}
}
.page-header h1{
  font-size:19px;
  font-weight:700;
  margin:0 0 3px;
  letter-spacing:-0.2px;
}
.page-header p{
  margin:0;
  color:var(--text-muted);
  font-size:12.5px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  margin-bottom:12px;
  overflow:visible;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:700;
  color:var(--primary-dark);
  letter-spacing:0.3px;
}
.section-title .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;
}
.section-body{
  padding:12px 16px 14px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px 14px;
}
.form-grid.cols-1{grid-template-columns:1fr;}
.form-grid.cols-2{grid-template-columns:repeat(2,1fr);}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.field label{
  font-size:11.5px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  line-height:1.2;
}
.field label .req{color:var(--error);margin-left:2px;}
.field .hint{font-size:11px;color:var(--text-faint);}
.field .error-msg{
  font-size:11px;
  color:var(--error);
  display:none;
  margin-top:-2px;
}
.field.has-error .error-msg{display:block;}
.field.has-error input,
.field.has-error .select-display,
.field.has-error .dd-input{
  border-color:var(--error) !important;
  background:var(--error-tint);
}

.control{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 11px;
  font-size:12.5px;
  color:var(--text);
  background:#fff;
  width:100%;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.control::placeholder{color:var(--text-faint);}
.control:hover{border-color:#AFC2D8;}
.control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-tint);
}
.control[readonly]{
  background:var(--gray-tint);
  color:var(--text-muted);
  cursor:default;
}
.control:disabled{
  background:var(--gray-tint);
  color:var(--text-faint);
  cursor:not-allowed;
}

.input-with-suffix{
  position:relative;
  display:flex;
  align-items:center;
}
.input-with-suffix .control{padding-right:58px;}
.input-with-suffix .suffix{
  position:absolute;
  right:8px;
  font-size:11px;
  font-weight:700;
  color:var(--primary-dark);
  background:var(--primary-tint);
  padding:3px 7px;
  border-radius:6px;
  pointer-events:none;
  white-space:nowrap;
}

/* Searchable dropdown */
.dd{position:relative;}
.dd-input{
  height:36px;
  min-width:0;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 32px 0 11px;
  font-size:12.5px;
  width:100%;
  outline:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%235C7085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
  cursor:pointer;
  transition:border-color .15s, box-shadow .15s;
}
.dd-input::placeholder{color:var(--text-faint);}
.dd-input:hover{border-color:#AFC2D8;}
.dd-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.dd.disabled .dd-input{background-color:var(--gray-tint);color:var(--text-faint);cursor:not-allowed;}

.dd-panel{
  position:absolute;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  min-width:200px;
  max-height:240px;
  overflow-y:auto;
  z-index:210;
  display:none;
  padding:6px;
}
.dd.open .dd-panel{display:block;}
.dd-item{
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.dd-item:hover, .dd-item.active{background:var(--primary-tint);}
.dd-item .primary-line{font-weight:600;font-size:12.5px;color:var(--text);}
.dd-item .secondary-line{font-size:11px;color:var(--text-muted);}
.dd-empty{padding:14px 10px;text-align:center;color:var(--text-faint);font-size:11.5px;}

/* Date field */
.date-field{position:relative;}
.date-field .control{padding-right:34px;}
.date-icon{
  position:absolute;
  right:6px;top:50%;
  transform:translateY(-50%);
  width:24px;height:24px;
  border:none;background:transparent;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--text-muted);
  font-size:13px;
}
.date-icon:hover{background:var(--primary-tint);color:var(--primary);}
.date-popup{
  position:absolute;
  width:250px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  z-index:210;
  padding:10px;
  display:none;
}
.date-popup.open{display:block;}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.cal-head button{
  width:24px;height:24px;border:none;background:var(--gray-tint);
  border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);
}
.cal-head button:hover{background:var(--primary-tint);color:var(--primary);}
.cal-head .cal-title{font-weight:700;font-size:12px;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal-grid .dow{
  text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding:4px 0;
}
.cal-grid .day{
  text-align:center;
  font-size:11.5px;
  padding:6px 0;
  border-radius:6px;
  cursor:pointer;
  color:var(--text);
}
.cal-grid .day:hover{background:var(--primary-tint);}
.cal-grid .day.muted{color:var(--text-faint);}
.cal-grid .day.selected{background:var(--primary);color:#fff;font-weight:700;}
.cal-grid .day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--primary-light);}

/* Buttons */
.btn{
  height:32px;
  padding:0 16px;
  border-radius:var(--radius-sm);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, box-shadow .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(31,111,235,0.25);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 1px 4px rgba(22,39,64,0.08);}
.btn-danger{background:#fff;color:var(--error);border-color:#F3C6C0;}
.btn-danger:hover{background:var(--error-tint);}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:0 6px;height:auto;}
.btn-ghost:hover{text-decoration:underline;}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px;}

.actions-row{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:12px 16px;
}

/* Success banner */
.success-banner{
  display:none;
  align-items:center;
  gap:10px;
  margin:0 0 12px;
  padding:9px 14px;
  background:var(--success-tint);
  border:1px solid #BFE8D0;
  border-radius:var(--radius-md);
  color:#1E7A46;
  font-size:12px;
}
.success-banner.show{display:flex;}
.success-banner b{font-weight:700;}
.success-banner .spacer{flex:1;}

/* =========================================================
   Master Contracts table section
   ========================================================= */
.table-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 16px 10px;
  flex-wrap:wrap;
  flex:0 0 auto;
}
.search-box{
  position:relative;
  flex:1 1 260px;
  min-width:200px;
}
.search-box input{
  height:32px;
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:0 12px 0 30px;
  font-size:12.5px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.search-box .icon{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-faint);font-size:13px;
}
.toolbar-spacer{flex:1 0 8px;}
.result-count{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}

.filter-select{
  flex:0 1 122px;
  min-width:88px;
  height:32px;
  cursor:pointer;
}

.table-scroll{
  overflow-x:auto;
}
table.mc-table{
  width:100%;
  border-collapse:collapse;
  min-width:1060px;
}
table.mc-table thead th{
  position:sticky;top:0;
  background:#F7FAFD;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  color:var(--text-muted);
  font-weight:700;
  padding:10px 14px;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  z-index:5;
}
table.mc-table thead th:hover{color:var(--primary-dark);}
table.mc-table thead th.no-sort{cursor:default;}
table.mc-table thead th.no-sort:hover{color:var(--text-muted);}
table.mc-table thead th.action-col, table.mc-table td.action-col{
  width:40px;
  text-align:center;
  padding-left:10px;
  padding-right:10px;
}
.row-select-checkbox{
  width:14px;height:14px;
  accent-color:var(--primary);
  cursor:pointer;
  vertical-align:middle;
}
table.mc-table thead th .sort-ind{
  display:inline-block;
  margin-left:4px;
  font-size:9px;
  color:var(--text-faint);
}
table.mc-table thead th.sorted .sort-ind{color:var(--primary);}
table.mc-table thead th.num,
table.mc-table td.num{text-align:right;}
table.mc-table tbody td{
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  white-space:nowrap;
}
table.mc-table tbody tr{cursor:pointer;transition:background .18s ease;}
table.mc-table tbody tr:hover{background:#F7FAFD;}
table.mc-table tbody tr:hover .mc-link{color:var(--primary);}
table.mc-table tbody tr.selected{background:var(--primary-tint);}
table.mc-table tbody tr.row-new{animation:flashNew 1.8s ease-out;}
@keyframes flashNew{
  0%{background:#DFF3E6;}
  100%{background:transparent;}
}
.mc-link{color:var(--primary-dark);font-weight:700;cursor:pointer;transition:color .15s ease;}
.mc-link:hover{text-decoration:underline;color:var(--primary);}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.status-pill .status-dot{width:6px;height:6px;border-radius:50%;}
.status-in-use{background:var(--success-tint);color:#1E7A46;}
.status-in-use .status-dot{background:var(--success);}
.status-confirmed{background:var(--primary-tint);color:var(--primary-dark);}
.status-confirmed .status-dot{background:var(--primary);}
.status-draft{background:var(--gray-tint);color:var(--text-muted);}
.status-draft .status-dot{background:var(--text-faint);}
.status-pending{background:var(--warning-tint);color:#9A5300;}
.status-pending .status-dot{background:var(--warning);}
.status-rejected{background:var(--error-tint);color:#B4362A;}
.status-rejected .status-dot{background:var(--error);}
.status-settled{background:var(--teal-tint);color:#0E8785;}
.status-settled .status-dot{background:var(--teal);}
.status-matured{background:var(--purple-tint);color:#6C3488;}
.status-matured .status-dot{background:var(--purple);}

/* Plain-text status presentation (Master Contracts table) */
.status-text{font-weight:600;font-size:12px;white-space:nowrap;}
.status-text-in-use{color:var(--success);}
.status-text-confirmed{color:var(--primary);}
.status-text-draft{color:var(--text-muted);}
.status-text-pending{color:var(--warning);}
.status-text-rejected{color:var(--error);}
.status-text-settled{color:var(--teal);}
.status-text-matured{color:var(--purple);}

.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.empty-state .big{font-size:28px;margin-bottom:6px;}

.table-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  flex-wrap:wrap;
  gap:10px;
  flex:0 0 auto;
  border-top:1px solid var(--border);
}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.page-size-select select{height:28px;border:1px solid var(--border-strong);border-radius:6px;font-size:11.5px;padding:0 6px;}

.pagination{display:flex;align-items:center;gap:4px;}
.pagination button{
  min-width:28px;height:28px;
  border:1px solid var(--border-strong);
  background:#fff;
  border-radius:6px;
  font-size:11.5px;
  cursor:pointer;
  color:var(--text);
  transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
.pagination button:active:not(:disabled){transform:translateY(1px);}

.field .unit{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);padding:3px 7px;border-radius:6px;pointer-events:none;}
.field.has-unit .control{padding-right:60px;}
.inline-msg{display:none;margin:0 0 12px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;}
.inline-msg.show{display:block;}
.inline-msg.error{background:var(--error-tint);border:1px solid #F3C6C0;color:#8F0000;}
.inline-msg.info{background:var(--primary-tint);border:1px solid #BEE0F7;color:var(--primary-dark);}
.pf-block-title{font-size:13px;font-weight:700;color:var(--primary-dark);margin:2px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.dd-panel{z-index:420;}
.date-popup{z-index:420;}
.control.calc{background:var(--gray-tint);}
.confirm-modal p{margin:6px 0 16px;color:var(--text);font-size:13.5px;}
.confirm-modal h2{margin-bottom:2px;}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;}
@media (max-width:760px){.kv-grid{grid-template-columns:1fr 1fr;} .pf-row.leg{grid-template-columns:1fr 1fr;}}
.toast.success{background:#0E6B34;}
.toast{max-width:min(720px,92vw);}
.cal-sel{border:1px solid var(--border-strong);border-radius:4px;font-size:12px;padding:2px 2px;background:#fff;color:var(--text);cursor:pointer;}
.date-field.bad-date .control{border-color:var(--error) !important;background:var(--error-tint);}

/* ---- KPI strip (reference .kpi-card pattern, compact) ---- */
.kpi-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.kpi-card{flex:1 1 150px;min-width:150px;padding:10px 14px 10px;gap:2px;min-height:0;justify-content:flex-start;outline:none;}
.kpi-card:focus-visible{box-shadow:0 0 0 2px var(--primary-light);}
.kpi-card .kpi-label{order:1;font-size:12px;}
.kpi-card .kpi-value{order:2;font-size:24px;line-height:1.2;}
.kpi-card .kpi-description{order:3;position:static;max-width:none;text-align:left;font-size:11.5px;color:var(--text-muted);}
.kpi-card.tone-warn{border-left-color:var(--warning);}
.kpi-card.tone-bad{border-left-color:var(--error);}
.kpi-card.tone-good{border-left-color:var(--success);}
.kpi-card .kpi-value.kpi-pos{color:var(--success);}
.kpi-card .kpi-value.kpi-neg{color:var(--error);}
.table-col{max-height:calc(100vh - 180px);}
/* breakdown bars */
.kpi-bars{display:flex;flex-direction:column;gap:6px;}
.kpi-bar-row{display:grid;grid-template-columns:minmax(120px,230px) 1fr minmax(70px,auto);gap:10px;align-items:center;font-size:12.5px;}
.kpi-bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:600;}
.kpi-bar-track{height:10px;background:var(--gray-tint);border-radius:5px;overflow:hidden;}
.kpi-bar-fill{height:100%;background:var(--primary);border-radius:5px;}
.kpi-bar-fill.pos{background:var(--success);}
.kpi-bar-fill.neg{background:var(--error);}
.kpi-bar-val{text-align:right;font-weight:700;font-family:Consolas,"Courier New",monospace;color:var(--text);}
.kpi-bar-val.pos{color:var(--success);}
.kpi-bar-val.neg{color:var(--error);}
.kpi-empty{padding:12px;color:var(--text-muted);font-size:12.5px;background:var(--gray-tint);border-radius:var(--radius-sm);}
.kpi-note{margin-top:8px;font-size:12px;color:var(--text-muted);}
</style>

/* =========================================================
   Formatting / parsing helpers
   ========================================================= */
function esc(v){
  return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseDMY(str){
  if(!str) return null;
  var m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(String(str).trim());
  if(!m) return null;
  var d = parseInt(m[1],10), mo = parseInt(m[2],10)-1, y = parseInt(m[3],10);
  var dt = new Date(y, mo, d);
  if(dt.getDate()!==d || dt.getMonth()!==mo || dt.getFullYear()!==y) return null;
  return dt;
}
function pad2(n){ return (n<10?'0':'')+n; }
function formatDMY(date){ return pad2(date.getDate())+'-'+pad2(date.getMonth()+1)+'-'+date.getFullYear(); }
function isoToDMY(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function dmyToIso(dmy){ var d=parseDMY(dmy); return d ? d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()) : ''; }
function formatAmount(n, dec){
  if(n===undefined||n===null||n==='') return '';
  dec = dec===undefined ? 2 : dec;
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function formatRate(n){ return (n===undefined||n===null||n===''||Number(n)===0) ? '' : Number(n).toLocaleString('en-US',{minimumFractionDigits:4, maximumFractionDigits:4}); }
function parseNum(str){
  if(typeof str==='number') return str;
  var s = String(str||'').replace(/,/g,'').trim();
  if(s==='' || isNaN(Number(s))) return NaN;
  return Number(s);
}
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

/* ---- lookups ---- */
function findIn(arr, key, val){ for(var i=0;i<arr.length;i++){ if(arr[i][key]===val) return arr[i]; } return null; }
function modelDesc(id){ var m=findIn(LOOKUPS.models,'id',id); return m?m.desc:''; }
function dealStatusInfo(code){ return findIn(LOOKUPS.dealStatus,'code',code) || {code:code,desc:code,cls:'status-text-draft'}; }
function txnStatusInfo(code){ return LOOKUPS.txnStatus[code] || {desc:code,cls:'status-text-draft'}; }
function companyName(code){ var c=findIn(LOOKUPS.companies,'code',code); return c?c.name:''; }
function bpName(bp){ for(var i=0;i<LOOKUPS.bps.length;i++){ if(LOOKUPS.bps[i].bp===bp) return LOOKUPS.bps[i].name; } return bp; }

/* ZSGTRMFM_LEAD_CURR — lead / following currency of a pair (ranking is an assumption) */
function leadCurr(c1, c2){
  var r = LOOKUPS.leadRank, i1 = r.indexOf(c1), i2 = r.indexOf(c2);
  if(i1<0) i1 = 99; if(i2<0) i2 = 99;
  if(i1<=i2) return {lead:c1, follow:c2};
  return {lead:c2, follow:c1};
}
/* convert an amount using a rate quoted lead -> following */
function convertViaRate(amt, from, to, rate){
  if(!rate) return 0;
  var lc = leadCurr(from,to);
  return lc.lead===from ? amt*rate : amt/rate;
}
function spotRateFor(a,b){
  var lc = leadCurr(a,b);
  return LOOKUPS.spotRates[lc.lead+'-'+lc.follow] || 0;
}
function marketRate(txn){
  /* TCURR kurst M, first row with date >= expiry date */
  var lc = leadCurr(txn.curr1, txn.curr2);
  var rows = LOOKUPS.marketRates[lc.lead+'-'+lc.follow] || [];
  for(var i=0;i<rows.length;i++){ if(rows[i].d >= txn.eDate) return rows[i].r; }
  return 0;
}

/* FETCH_DEAL_DETAILS — selection logic of the ABAP report */
function fetchDeals(f){
  var from = dmyToIso(f.from), to = dmyToIso(f.to);
  if(!from || !to || from > to) return [];
  return appData.deals.filter(function(d){
    if(d.status === '30') return false;                         /* DELETE ... zdeal_stat = '30' */
    if(f.status && d.status !== f.status) return false;          /* S_STAT */
    if(f.deal && d.id !== f.deal) return false;                  /* S_DEAL */
    if(d.end > to) return false;                                 /* ze_date <= s_date-high */
    if(d.end < from && d.ss !== 'X') return false;               /* DELETE ze_date < s_date-low AND zss <> 'X' */
    if(f.model && d.model !== f.model) return false;            /* S_MOD */
    return true;
  });
}

/* FETCH_TXN_DATA — transactions of one deal + settlement-spot columns (SS rows only, as in the ABAP) */
function fetchTransactions(dealId){
  var out = [];
  appData.txns.forEach(function(t){
    if(t.dealId !== dealId) return;
    var row = deepClone(t);
    row.sdAmt = ''; row.sdCurr = ''; row.sdPending = false; row.sdDone = false;
    var ss = null;
    appData.inSpot.forEach(function(s){
      if(!ss && s.dealId===dealId && s.dealType===t.dealType && s.dssType!=='') ss = s;
    });
    if(ss){
      row.sdAmt = ss.dAmt; row.sdCurr = ss.curr;
      if(ss.spotCreate==='') row.sdPending = true; else row.sdDone = true;
    }
    if(row.sfhaart==='605'){ /* kept as in ABAP: only 605 derives cash amount from amounts */ }
    out.push(row);
  });
  out.sort(function(a,b){ return a.sfhaart < b.sfhaart ? -1 : a.sfhaart > b.sfhaart ? 1 : 0; });
  return out;
}

    };
  });

  if(rule === 'FX1') items = items.filter(function(i){ return i.dealType !== 'DS1'; });

  function textFor(sf, code){
    for(var i=0;i<LOOKUPS.actionTexts.length;i++){
      var a = LOOKUPS.actionTexts[i];
      if(a.sf===sf && a.code===code) return a;
    }
    return null;
  }
  var has64524 = items.some(function(i){ return i.sfhaart==='645' && i.status==='24'; });
  var diffs = appData.inSpot.filter(function(s){ return s.dealId===deal.id; });

  items.forEach(function(it){
    var a = textFor(it.sfhaart, it.status==='34' ? '02' : '01');
    if(a){ it.text = a.text; it.textCode = a.code; }
    if(has64524 && (it.dealType==='DS1' || it.dealType==='DS2')){
      var b = textFor('619','01');
      if(b){ it.text = b.text; it.textCode = b.code; }
    }
    if(deal.ss === 'X'){
      var c = textFor(it.sfhaart,'03');
      if(c){ it.text = c.text; it.textCode = c.code; }
    }
    var d = null, spotDone = false;
    diffs.forEach(function(s){
      if(s.dealType===it.dealType){ if(!d) d = s; if(s.spotCreate==='X') spotDone = true; }
    });
    if(d){
      it.invAmt = d.fAmt; it.invCurr = d.curr; it.bs = d.bs; it.diffAmt = d.dAmt;
    }
    /* COLOR_CODE_ACTION_ITEMS */
    if(it.status > '07'){ it.state = 'done'; }
    else if(!spotDone){
      it.state = 'pending'; it.button = true;
      if(deal.ss==='X' && (it.dealType==='' || it.dealType==='00')){
        var covered = items.some(function(o){ return o.coverTxn === it.rfha; });
        if(covered){ it.state = 'done'; it.button = false; }

    } else { it.state = 'done'; }

  return items.filter(function(i){ return i.textCode !== ''; });

/* =========================================================
   Business calculations (isolated from UI)
   ========================================================= */
/* Exercise / expire decision (class ZSGTSFCL_GET_OPT_EXP_CALC is not part of the export — assumption:
   a call is exercised when market > strike, a put when market < strike) */
function decideExercise(txn, rate){
  if(!rate) return '';
  if(txn.pc1==='Call') return rate > txn.strike ? 'Exercise' : 'Expire';
  return rate < txn.strike ? 'Exercise' : 'Expire';
}
/* CASH_SETTLEMENT */
function calcCashSettlement(txn, rate){
  if(!rate) return 0;
  var lc = leadCurr(txn.curr1, txn.curr2), cs;
  if(lc.lead==='USD'){
    cs = (lc.lead===txn.curr1) ? (txn.amt2/rate) - txn.amt1 : (txn.amt1/rate) - txn.amt2;
  } else {
    cs = (lc.lead===txn.curr1) ? (rate*txn.amt1) - txn.amt2 : (rate*txn.amt2) - txn.amt1;
  }
  cs = Math.abs(cs);
  if(txn.sfhaart==='648') cs = cs * -1;     /* pay leg */
  return cs;
}
/* CHECK_RATE — scale the fixing rate with the TCURF factors */
function scaledRate(txn, rate){
  var f = LOOKUPS.tcurf[txn.curr1+'>'+txn.curr2];
  if(f && f.ffact !== f.tfact){
    if(f.ffact !== 1) return rate * f.ffact;
    if(f.tfact !== 1) return rate * f.tfact;
  }
  return rate;
}
/* CASH_SETTELMENT (screen 9010) */
function calcNdfSettlement(txn, fixRate){
  var res = {ndf:0, dndf:0, scurr:'', scurr2:''};
  var lr = scaledRate(txn, fixRate);
  var lc = leadCurr(txn.curr1, txn.curr2);
  var special = (lc.follow==='IDR' || lc.follow==='VND' || lc.follow==='TWD');
  res.scurr = (txn.curr1==='USD' || txn.curr2==='USD') ? 'USD' : lc.follow;
  if(fixRate && lr){
    if(txn.curr1 === lc.follow){
      res.ndf = special ? txn.amt2 + ((txn.amt1*100)/lr) : txn.amt2 + (txn.amt1/lr);
    } else {
      res.ndf = special ? txn.amt1 + ((txn.amt2*100)/lr) : txn.amt1 + (txn.amt2/lr);
    }
  }
  if(txn.sfhaart==='632' && lr){
    var lamt;
    if(txn.curr1 !== 'USD'){ lamt = Math.abs(txn.amt2) * lr; res.dndf = Math.abs(txn.amt1*100) - lamt; }
    else { lamt = Math.abs(txn.amt1) * lr; res.dndf = Math.abs(txn.amt2*100) - lamt; }
  }
  res.dndf = Math.abs(res.dndf) / 100;
  res.scurr2 = lc.follow;
  return res;
}
/* RBI default fixing rate: only for pair USD:INR on the fixing date */
function defaultFixingRate(txn){
  if(txn.cpair !== 'USD:INR') return 0;
  return LOOKUPS.rbiRates[txn.ndfDate] || 0;
}
/* PROCESS_NDO_SPOT / NDO_SPOT — default values for the "Create Spot" popup */
function buildNdoSpot(txn, ctx){
  var s = { bukrs:'', curr1:'', bs1:'', amt1:0, curr2:'', bs2:'', amt2:0, rate:0, bp:txn.cpty, invText1:'', invText2:'', tradeDate:'', base:1 };
  var inv = ctx.invoice;                     /* in_spot record with invoice amount (or null) */
  s.rate = txn.strike || ctx.rate || 0;
  if(!inv){
    var typ;
    var sf = txn.sfhaart;
    if(sf==='645' || sf==='647') typ = (txn.pc1==='Put') ? '2' : '1';
    else typ = (txn.pc1==='Put') ? '1' : '2';
    var lc = leadCurr(txn.curr1, txn.curr2);
    s.curr1 = lc.lead; s.curr2 = lc.follow;
    if(typ==='1'){ s.bs1='Buy'; s.bs2='Sell'; }
    else if(lc.lead === txn.curr2){ s.bs1='Buy'; s.bs2='Sell'; }
    else { s.bs1='Sell'; s.bs2='Buy'; }
    s.amt1 = txn.curr1==='USD' ? txn.amt1 : txn.amt2;
    s.amt2 = s.curr1==='USD' ? s.amt1*s.rate : (s.rate ? s.amt1/s.rate : 0);
  } else {
    var amtAbs = Math.abs(inv.fAmt);
    s.bs1 = 'Buy'; s.bs2 = 'Sell';
    if(inv.bs === 'Buy'){
      s.curr1 = inv.curr; s.curr2 = (txn.curr1===inv.curr) ? txn.curr2 : txn.curr1;
      s.amt1 = amtAbs; s.invText1 = 'Invoice Value'; s.base = 1;
      recalcSpotAmounts(s);
    } else {
      s.curr1 = (txn.curr1===inv.curr) ? txn.curr2 : txn.curr1; s.curr2 = inv.curr;
      s.amt2 = amtAbs; s.invText2 = 'Invoice Value'; s.base = 2;
      recalcSpotAmounts(s);
    }
  }
  var comp = LOOKUPS.companies.filter(function(c){ return c.entity===txn.entity; })[0];
  s.bukrs = comp ? comp.code : txn.bukrs;
  return s;
}
/* Recalculate dependent amount when the rate is edited (same rules as the PBO modules) */
function recalcSpotAmounts(s){
  if(!s.rate){ if(s.base===2) s.amt1 = 0; else s.amt2 = 0; return; }
  if(s.base===2){ s.amt1 = (s.curr2==='USD') ? s.amt2*s.rate : s.amt2/s.rate; }
  else { s.amt2 = (s.curr1==='USD') ? s.amt1*s.rate : s.amt1/s.rate; }
}

var modalStack = [];
function openModal(opts){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.style.zIndex = 200 + modalStack.length * 10;
  var modal = document.createElement('div');
  modal.className = 'modal modal-left modal-scrollable ' + (opts.cls || 'md-modal');
  modal.setAttribute('role','dialog');
  modal.setAttribute('aria-modal','true');
  modal.innerHTML =
    '<div class="modal-head-row"><h2>'+esc(opts.title)+'</h2>'+
    '<button type="button" class="modal-close-btn" aria-label="Close">\u00d7</button></div>'+
    (opts.sub ? '<div class="modal-sub">'+esc(opts.sub)+'</div>' : '')+
    '<div class="modal-body-scroll"></div>'+
    '<div class="modal-actions"></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  var api = {
    overlay:overlay, modal:modal,
    body: modal.querySelector('.modal-body-scroll'),
    footer: modal.querySelector('.modal-actions'),
    closed:false,
    close:function(){
      if(api.closed) return;
      api.closed = true;
      overlay.classList.add('closing');
      setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 150);
      var i = modalStack.indexOf(api); if(i>=0) modalStack.splice(i,1);
      if(opts.onClose) opts.onClose();
    },
    addButton:function(label, cls, handler, id){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + cls; b.textContent = label;
      if(id) b.id = id;
      b.addEventListener('click', handler);
      api.footer.appendChild(b);
      return b;
    }
  };
  modal.querySelector('.modal-close-btn').addEventListener('click', api.close);
  overlay.addEventListener('mousedown', function(e){ if(e.target===overlay && opts.backdropClose!==false){ /* keep open: avoid losing entries */ } });
  modalStack.push(api);
  return api;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && modalStack.length){ modalStack[modalStack.length-1].close(); }
});

}

/* ---- floating panel positioning (same approach as the reference) ---- */
function positionFloatingPanel(triggerEl, panelEl, opts){
  opts = opts || {};
  var margin = 8, gap = opts.gap===undefined ? 6 : opts.gap;
  var tr = triggerEl.getBoundingClientRect();
  var bounds = { left:0, right:window.innerWidth, top:0, bottom:window.innerHeight };
  if(opts.matchWidth){ panelEl.style.width = Math.max(tr.width, 200) + 'px'; }
  var pr = panelEl.getBoundingClientRect();
  var bl = bounds.left+margin, br = bounds.right-margin, bt = bounds.top+margin, bb = bounds.bottom-margin;
  var left = opts.alignRight ? (tr.right - pr.width) : tr.left;
  var maxLeft = br - pr.width;
  if(maxLeft < bl) left = bl; else { if(left>maxLeft) left = maxLeft; if(left<bl) left = bl; }
  var desired = tr.bottom + gap, top;
  if(desired + pr.height <= bb){ top = desired; }
  else { var above = tr.top - gap - pr.height; top = above >= bt ? above : Math.max(bt, bb - pr.height); }
  panelEl.style.position='fixed'; panelEl.style.left=left+'px'; panelEl.style.top=top+'px';
  panelEl.style.right='auto'; panelEl.style.bottom='auto';
}

/* ---- searchable dropdown (opens on click anywhere in the field) ----
   cfg: {items, value, placeholder, emptyLabel, valueOf, primary, secondary, display, search, onChange, disabled} */
var allDropdowns = [];
function createDropdown(host, cfg){
  host.classList.add('dd');
  host.innerHTML = '<input class="dd-input" autocomplete="off"><div class="dd-panel"></div>';
  var input = host.querySelector('.dd-input'), panel = host.querySelector('.dd-panel');
  input.placeholder = cfg.placeholder || 'Select ...';
  var current = cfg.value || '';
  var api = {};

  function itemByValue(v){
    for(var i=0;i<cfg.items.length;i++){ if(cfg.valueOf(cfg.items[i])===v) return cfg.items[i]; }
    return null;
  }
  function setDisplay(){
    var it = itemByValue(current);
    input.value = it ? cfg.display(it) : '';
    input.title = input.value;
  }
  function renderPanel(filter){
    var ft = (filter||'').toLowerCase();
    panel.innerHTML = '';
    var shown = 0;
    if(cfg.emptyLabel && ft===''){
      var e = document.createElement('div');
      e.className = 'dd-item' + (current===''?' active':'');
      e.innerHTML = '<span class="primary-line" style="font-weight:500;color:var(--text-muted)">'+esc(cfg.emptyLabel)+'</span>';
      e.addEventListener('mousedown', function(ev){ ev.preventDefault(); choose(''); });
      panel.appendChild(e); shown++;
    }
    cfg.items.forEach(function(it){
      if(ft && cfg.search(it).toLowerCase().indexOf(ft)===-1) return;
      var el = document.createElement('div');
      el.className = 'dd-item' + (cfg.valueOf(it)===current ? ' active' : '');
      el.innerHTML = '<span class="primary-line">'+esc(cfg.primary(it))+'</span>' +
        (cfg.secondary ? '<span class="secondary-line">'+esc(cfg.secondary(it))+'</span>' : '');
      el.addEventListener('mousedown', function(ev){ ev.preventDefault(); choose(cfg.valueOf(it)); });
      panel.appendChild(el); shown++;
    });
    if(!shown){ panel.innerHTML = '<div class="dd-empty">No matches found</div>'; }
  }
  function open(filter){
    if(host.classList.contains('disabled')) return;
    allDropdowns.forEach(function(d){ if(d!==api) d.close(); });
    renderPanel(filter||'');
    host.classList.add('open');
    positionFloatingPanel(host, panel, {matchWidth:true, gap:4});
  }
  function close(){ host.classList.remove('open'); setDisplay(); }
  function choose(v){
    current = v; host.classList.remove('open'); setDisplay();
    if(cfg.onChange) cfg.onChange(v);
  }
  input.addEventListener('focus', function(){ input.select(); open(''); });
  input.addEventListener('click', function(){ if(!host.classList.contains('open')) open(''); });
  input.addEventListener('input', function(){ open(input.value); });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var first = panel.querySelector('.dd-item');
      if(first){ var ev = document.createEvent('MouseEvents'); ev.initEvent('mousedown',true,true); first.dispatchEvent(ev); }
      e.preventDefault();
    } else if(e.key==='Escape'){ close(); input.blur(); }
  });
  document.addEventListener('mousedown', function(e){
    if(host.classList.contains('open') && !host.contains(e.target)) close();
  });
  document.addEventListener('scroll', function(e){
    if(host.classList.contains('open') && !panel.contains(e.target)) close();
  }, true);
  window.addEventListener('resize', function(){ if(host.classList.contains('open')) close(); });

  api.get = function(){ return current; };
  api.set = function(v){ current = v || ''; setDisplay(); };
  api.setItems = function(items){ cfg.items = items; setDisplay(); };
  api.setDisabled = function(d){ host.classList.toggle('disabled', !!d); input.disabled = !!d; };
  api.close = close;
  api.input = input;
  setDisplay();
  if(cfg.disabled) api.setDisabled(true);
  allDropdowns.push(api);
  return api;
}

    var html = '<div class="cal-head"><button type="button" data-nav="-1">\u2039</button>'+
      '<span class="cal-title"><select class="cal-sel" data-role="month">'+mopts+'</select> <select class="cal-sel" data-role="year">'+yopts+'</select></span>'+
      '<button type="button" data-nav="1">\u203a</button></div><div class="cal-grid">';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){ html += '<div class="dow">'+d+'</div>'; });
    for(var i=0;i<off;i++){ html += '<div class="day muted">'+(dprev-off+1+i)+'</div>'; }
    for(var d2=1; d2<=dim; d2++){
      var cls = 'day', dt = new Date(year, month, d2);
      if(selected && dt.getTime()===new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()).getTime()) cls += ' selected';
      if(dt.toDateString()===today.toDateString()) cls += ' today';
      html += '<div class="'+cls+'" data-day="'+d2+'">'+d2+'</div>';
    }
    var trailing = (7 - ((off+dim) % 7)) % 7;
    for(var k=1;k<=trailing;k++){ html += '<div class="day muted">'+k+'</div>'; }
    html += '</div>';
    popup.innerHTML = html;
    Array.prototype.forEach.call(popup.querySelectorAll('[data-nav]'), function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        viewDate = new Date(year, month + parseInt(b.getAttribute('data-nav'),10), 1);
        render(); place();
      });
    });
    Array.prototype.forEach.call(popup.querySelectorAll('.cal-sel'), function(s){
      s.addEventListener('click', function(e){ e.stopPropagation(); });
      s.addEventListener('change', function(e){
        e.stopPropagation();
        var mm = parseInt(popup.querySelector('[data-role="month"]').value,10);
        var yy = parseInt(popup.querySelector('[data-role="year"]').value,10);
        viewDate = new Date(yy, mm, 1); render(); place();
      });
    });
    Array.prototype.forEach.call(popup.querySelectorAll('.day:not(.muted)'), function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        input.value = formatDMY(new Date(year, month, parseInt(el.getAttribute('data-day'),10)));
        close(); commit();
      });
    });
  }
  function place(){ positionFloatingPanel(host, popup, {alignRight:true, gap:6}); }
  function open(){
    openDatePopups.forEach(function(p){ if(p!==close) p(); });
    var sel = parseDMY(input.value);
    viewDate = sel ? new Date(sel.getFullYear(), sel.getMonth(), 1) : new Date();   /* initialised on open only */
    render(); popup.classList.add('open'); place();
  }
  function close(){ popup.classList.remove('open'); }
  openDatePopups.push(close);
  function commit(){
    var v = input.value.trim();
    var ok = v==='' || !!parseDMY(v);
    host.classList.toggle('bad-date', !ok);
    if(cfg.onChange) cfg.onChange(v, ok);
  }
  btn.addEventListener('click', function(e){ e.stopPropagation(); popup.classList.contains('open') ? close() : open(); });
  input.addEventListener('click', function(e){ e.stopPropagation(); if(!popup.classList.contains('open')) open(); });
  input.addEventListener('input', function(e){
    var v = input.value.replace(/[^0-9-]/g,'');
    if(e && e.inputType && e.inputType.indexOf('insert')===0 && (v.length===2 || v.length===5)) v += '-';
    input.value = v;
    if(v.length===10) commit();
  });
  input.addEventListener('change', commit);
  input.addEventListener('blur', function(){ setTimeout(commit, 120); });
  document.addEventListener('mousedown', function(e){ if(!host.contains(e.target)) close(); });
  document.addEventListener('scroll', function(e){ if(popup.classList.contains('open') && !popup.contains(e.target)) close(); }, true);
  window.addEventListener('resize', function(){ if(popup.classList.contains('open')) place(); });
  return {
    get:function(){ return input.value.trim(); },
    set:function(v){ input.value = v || ''; host.classList.remove('bad-date'); },
    input:input
  };
}

function validateDateFilters(){
  var f = state.filters, ok = true;
  function setErr(id, msg){
    var fld = document.getElementById(id);
    fld.classList.toggle('has-error', !!msg);
    fld.querySelector('.error-msg').textContent = msg || '';
  }
  var df = parseDMY(f.from), dt = parseDMY(f.to);
  setErr('fld-from', !f.from ? 'Required' : (!df ? 'Use dd-mm-yyyy' : ''));
  setErr('fld-to',   !f.to ? 'Required' : (!dt ? 'Use dd-mm-yyyy' : (df && dt < df ? 'Before From date' : '')));
  return !(document.querySelector('#fld-from.has-error, #fld-to.has-error'));
}

function getFilteredSortedDeals(){
  var list = fetchDeals(state.filters);
  var q = state.search.trim().toLowerCase();
  if(q){
    list = list.filter(function(d){
      return DEAL_COLS.some(function(c){ return colText(c,d).toLowerCase().indexOf(q) !== -1; });
    });
  }
  var col = findIn(DEAL_COLS,'key',state.sort.field);
  if(col){
    var dir = state.sort.dir==='asc' ? 1 : -1;
    list.sort(function(a,b){
      var x = col.val(a), y = col.val(b);
      if(col.num){ return (Number(x)-Number(y))*dir; }
      x = String(x).toLowerCase(); y = String(y).toLowerCase();
      return x<y ? -dir : x>y ? dir : 0;
    });
  }
  return list;
}

function renderDeals(){
  var list = getFilteredSortedDeals();
  var total = list.length;
  var pages = Math.max(1, Math.ceil(total/state.pageSize));
  if(state.page > pages) state.page = pages;
  var rows = list.slice((state.page-1)*state.pageSize, state.page*state.pageSize);

  /* keep selection only while the row is still listed */
  if(state.selectedDealId && !list.some(function(d){ return d.id===state.selectedDealId; })) state.selectedDealId = null;

  var tbody = document.getElementById('dealBody');
  tbody.innerHTML = '';
  document.getElementById('emptyState').style.display = total===0 ? 'block' : 'none';
  document.getElementById('dealTable').style.display = total===0 ? 'none' : 'table';
  var datesOk = validateDateFilters();
  if(total===0){
    document.getElementById('emptyText').textContent = datesOk ? 'No deals match the selected settlement dates, filters or search.' : 'Enter a valid settlement date range to list deals.';
  }

  rows.forEach(function(d){
    var tr = document.createElement('tr');
    var sel = state.selectedDealId===d.id;
    if(sel) tr.classList.add('selected');
    tr.title = 'Click to select \u00b7 double-click to open transactions';
    var html = '<td class="action-col pin pin-1"><input type="checkbox" class="row-select-checkbox" aria-label="Select deal '+esc(d.id)+'"'+(sel?' checked':'')+'></td>';
    DEAL_COLS.forEach(function(c){
      html += '<td class="'+(c.num?'num ':'')+(c.cls||'')+(c.pin?' pin pin-2':'')+'">'+(c.html ? c.html(d) : esc(colText(c,d)))+'</td>';
    });
    tr.innerHTML = html;
    tr.draggable = sel;
    tr.addEventListener('click', function(){
      state.selectedDealId = (state.selectedDealId===d.id) ? null : d.id;
      renderDeals();
    });
    tr.addEventListener('dblclick', function(){ state.selectedDealId = d.id; renderDeals(); openDealModal(d.id); });
    tr.addEventListener('dragstart', function(e){
      if(state.selectedDealId !== d.id){ e.preventDefault(); return; }
      startRowDrag(e, 'deal', d.id, d.id+' \u2014 '+d.model, tr);
    });
    tr.addEventListener('dragend', function(){ endRowDrag(tr); });
    var cb = tr.querySelector('.row-select-checkbox');
    cb.addEventListener('click', function(e){ e.stopPropagation(); });
    cb.addEventListener('change', function(e){
      state.selectedDealId = e.target.checked ? d.id : null;
      renderDeals();
    });
    tbody.appendChild(tr);
  });

  document.getElementById('resultCount').textContent = total + (total===1 ? ' deal' : ' deals');
  document.getElementById('btnViewSettlement').disabled = !state.selectedDealId;
  Array.prototype.forEach.call(document.querySelectorAll('#dealHead th[data-sort]'), function(th){
    var k = th.getAttribute('data-sort'), ind = th.querySelector('.sort-ind');
    th.classList.toggle('sorted', k===state.sort.field);
    ind.textContent = k===state.sort.field ? (state.sort.dir==='asc' ? '\u25b2' : '\u25bc') : '';
  });
  renderPagination(pages, total);
  renderKpis(list);
}

function renderPagination(pages, total){
  var el = document.getElementById('pagination');
  el.innerHTML = '';
  function btn(label, disabled, active, fn){
    var b = document.createElement('button');
    b.textContent = label; b.disabled = disabled; if(active) b.classList.add('active');
    b.addEventListener('click', fn); el.appendChild(b);
  }
  btn('\u2039', state.page<=1, false, function(){ state.page--; renderDeals(); });
  for(var p=1;p<=pages;p++){ (function(p){ btn(String(p), false, p===state.page, function(){ state.page = p; renderDeals(); }); })(p); }
  btn('\u203a', state.page>=pages, false, function(){ state.page++; renderDeals(); });
  var from = total===0 ? 0 : (state.page-1)*state.pageSize+1;
  var to = Math.min(total, state.page*state.pageSize);
  document.getElementById('showingText').textContent = 'Showing '+from+'\u2013'+to+' of '+total;
}

/* =========================================================
   Drag a selected row onto an action button (same handler as the click)
   ========================================================= */
var dragPayload = null;
function startRowDrag(e, kind, id, label, rowEl){
  dragPayload = {kind:kind, id:id};
  rowEl.classList.add('dragging');
  document.body.classList.add('is-dragging');
  var ghost = document.createElement('div');
  ghost.className = 'drag-ghost'; ghost.textContent = label;
  document.body.appendChild(ghost);
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed = 'copy';
    try{ e.dataTransfer.setData('text/plain', String(id)); }catch(err){}
    if(e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(ghost, 12, 14);
  }
  setTimeout(function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function(b){
    if(!b.disabled && b.getAttribute('data-drop')===kind) b.classList.add('drop-ready');
  });
}
function endRowDrag(rowEl){
  dragPayload = null;
  if(rowEl) rowEl.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  Array.prototype.forEach.call(document.querySelectorAll('.drag-over,.drop-ready'), function(el){ el.classList.remove('drag-over'); el.classList.remove('drop-ready'); });
}
function wireDropTarget(btn, kind, onDrop){
  btn.setAttribute('data-drop', kind);
  btn.addEventListener('dragover', function(e){
    if(!dragPayload) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = dragPayload.kind===kind ? 'copy' : 'none';
    if(dragPayload.kind===kind) btn.classList.add('drag-over');
  });
  btn.addEventListener('dragleave', function(){ btn.classList.remove('drag-over'); });
  btn.addEventListener('drop', function(e){
    e.preventDefault(); btn.classList.remove('drag-over');
    if(!dragPayload) return;
    if(dragPayload.kind !== kind){ showToast(kind==='txn' ? 'This action requires a transaction row.' : 'Select a deal first.', 'error'); return; }
    if(btn.disabled){ return; }
    onDrop(dragPayload.id);
  });
}

function renderDealModal(){
  renderKpis();   /* data may have changed (exercise, fixing, spot) */
  if(!dealModalApi || dealModalApi.closed) return;
  var ctx = state.dealModal, deal = getDeal(ctx.dealId);
  var txns = fetchTransactions(ctx.dealId);
  var items = fetchActionItems(deal, txns);
  var root = dealModalApi.modal;

  /* ---- transactions ---- */
  var h = '<tr><th class="action-col"></th>';
  TXN_COLS.forEach(function(c){ h += '<th class="'+(c.num?'num':'')+'">'+esc(c.label)+'</th>'; });
  root.querySelector('#txnTable thead').innerHTML = h + '</tr>';
  var tb = root.querySelector('#txnTable tbody'); tb.innerHTML = '';
  if(!txns.length){ tb.innerHTML = '<tr class="no-hover"><td colspan="'+(TXN_COLS.length+1)+'" class="empty-row">No transactions for this deal.</td></tr>'; }
  txns.forEach(function(t){
    var tr = document.createElement('tr');
    var sel = ctx.selectedRfha === t.rfha;
    if(sel) tr.classList.add('selected');
    var row = '<td class="action-col"><input type="checkbox" class="row-select-checkbox" aria-label="Select transaction '+esc(t.rfha)+'"'+(sel?' checked':'')+'></td>';
    TXN_COLS.forEach(function(c){
      var cls = (c.num?'num ':'') + (c.mono?'mono ':'');
      var inner = esc(c.get(t));
      if(c.link){ cls += txnLinkClass(t) + ' '; inner = '<span class="link-cell" title="Display transaction">'+inner+'</span>'; }
      if(c.td) cls += c.td(t)+' ';
      if(c.sd && t.sdPending) cls += 'cell-pending ';
      if(c.status){ inner = '<span class="status-text '+txnStatusInfo(t.status).cls+'">'+inner+'</span>'; }
      row += '<td class="'+cls+'">'+inner+'</td>';
    });
    tr.innerHTML = row;
    tr.draggable = sel;
    tr.addEventListener('click', function(){ ctx.selectedRfha = sel ? null : t.rfha; renderDealModal(); });
    tr.addEventListener('dragstart', function(e){
      if(ctx.selectedRfha !== t.rfha){ e.preventDefault(); return; }
      startRowDrag(e, 'txn', t.rfha, t.rfha+' \u2014 '+(LOOKUPS.txnTypes[t.sfhaart]||t.sfhaart), tr);
    });
    tr.addEventListener('dragend', function(){ endRowDrag(tr); });
    tr.querySelector('.row-select-checkbox').addEventListener('click', function(e){ e.stopPropagation(); });
    tr.querySelector('.row-select-checkbox').addEventListener('change', function(e){ ctx.selectedRfha = e.target.checked ? t.rfha : null; renderDealModal(); });
    tr.querySelector('.link-cell').addEventListener('click', function(e){ e.stopPropagation(); openTxnDetails(t.rfha); });
    tb.appendChild(tr);
  });
  root.querySelector('#txnCount').textContent = txns.length + (txns.length===1 ? ' transaction' : ' transactions');

  /* ---- action items ---- */
  var ACOLS = [
    {label:'Transaction', get:function(i){ return i.rfha; }, mono:true},
    {label:'Deal Type', get:function(i){ return i.dealType; }, cls:'cell-type'},
    {label:'Action Item', action:true, get:function(i){ return i.text; }},
    {label:'Create', btn:true},
    {label:'Co. Code', get:function(i){ return i.bukrs; }},
    {label:'Counterparty', get:function(i){ return i.cpty; }},
    {label:'Txn Type', get:function(i){ return i.sfhaart+' \u00b7 '+(LOOKUPS.txnTypes[i.sfhaart]||''); }},
    {label:'Txn Status', status:true, get:function(i){ return txnStatusInfo(i.status).desc; }},
    {label:'Value Date', mono:true, get:function(i){ return isoToDMY(i.valueDate); }},
    {label:'Exec. Date', mono:true, get:function(i){ return isoToDMY(i.eDate); }},
    {label:'P/C', get:function(i){ return i.pc1; }},
    {label:'Curr 1', get:function(i){ return i.curr1; }},
    {label:'Amount 1', num:true, get:function(i){ return formatAmount(i.amt1); }},
    {label:'Curr 2', get:function(i){ return i.curr2; }},
    {label:'Buy/Sell', get:function(i){ return i.bs; }},
    {label:'Invoice Amt', num:true, get:function(i){ return i.invAmt!=='' ? formatAmount(i.invAmt) : ''; }},
    {label:'Inv Curr', get:function(i){ return i.invCurr; }},
    {label:'Invoice Diff.', num:true, get:function(i){ return i.diffAmt!=='' ? formatAmount(i.diffAmt) : ''; }}
  ];
  var ah = '<tr>';
  ACOLS.forEach(function(c){ ah += '<th class="'+(c.num?'num':'')+'">'+esc(c.label)+'</th>'; });
  root.querySelector('#actTable thead').innerHTML = ah + '</tr>';
  var ab = root.querySelector('#actTable tbody'); ab.innerHTML = '';
  if(!items.length){ ab.innerHTML = '<tr class="no-hover"><td colspan="'+ACOLS.length+'" class="empty-row">No action items for this deal.</td></tr>'; }
  items.forEach(function(it){
    var tr = document.createElement('tr'); tr.className = 'no-hover';
    var row = '';
    ACOLS.forEach(function(c){
      if(c.btn){
        row += '<td>'+(it.button ? '<button type="button" class="btn btn-primary btn-create" data-rfha="'+esc(it.rfha)+'">Create</button>' : '')+'</td>';
        return;
      }
      var cls = (c.num?'num ':'') + (c.mono?'mono ':'') + (c.cls?c.cls+' ':'');
      var inner = esc(c.get(it));
      if(c.action) cls += (it.state==='done' ? 'cell-done' : 'cell-pending') + ' ';
      if(c.status) inner = '<span class="status-text '+txnStatusInfo(it.status).cls+'">'+inner+'</span>';
      row += '<td class="'+cls+'">'+inner+'</td>';
    });
    tr.innerHTML = row;
    var b = tr.querySelector('.btn-create');
    if(b) b.addEventListener('click', function(){ actionItemCreate(it); });
    ab.appendChild(tr);
  });
  root.querySelector('#actCount').textContent = items.length + (items.length===1 ? ' item' : ' items');

  /* ---- toolbar state ---- */
  var has = !!ctx.selectedRfha;
  ['btnEx','btnNdf','btnDiff'].forEach(function(id){ root.querySelector('#'+id).disabled = !has; });
  root.querySelector('#txnHint').textContent = has ? 'Transaction '+ctx.selectedRfha+' selected' : 'Select a transaction to enable the actions';
}

/* ---- Action Items: BUT column click (handle_button_click) ---- */
function actionItemCreate(it){
  var t = getTxn(it.rfha), deal = getDeal(t.dealId);
  var ctx = {dealId:t.dealId, rfha:t.rfha, fromAction:true};
  switch(it.sfhaart){
    case '619':
      if(deal.ss !== 'X'){ openSettlementSpotPopup(ctx); }
      else if(t.dealType==='00' || t.dealType===''){ openFwdSsSpotPopup(ctx); }
      else { openSettlementSpotPopup(ctx); }
      break;
    case '604':
      openSettlementSpotPopup(ctx); break;
    case '631': case '632':
      if(t.sgsart.substring(0,2)==='12') openNdfPopup(ctx);
      else showToast('Please select the NDF/DNDF deal', 'error');
      break;
    default:
      if(t.status > '07'){ openSettlementSpotPopup(ctx); }
      else if(t.sgsart.substring(0,2)==='14'){ openRatePopup(ctx); }
      else { showToast('Please select the Option/NDO deal', 'error'); }
  }
}

/* ---------------------------------------------------------
   Screen 9001 — Update Rate (Option Exercise / Expire)
   --------------------------------------------------------- */
function openRatePopup(ctx){
  var txn = getTxn(ctx.rfha), deal = getDeal(ctx.dealId);
  var rate = marketRate(txn);                       /* gv_n_rate */
  var cash = txn.settlfl === '2';
  var m = openModal({title:'Update Rate', sub:'Option '+txn.rfha+' \u00b7 '+(txn.pc1||'')+' strike '+formatRate(txn.strike), cls:'sm-modal'});
  m.body.innerHTML =
    '<div class="inline-msg"></div>'+
    '<div class="pf-row c2">'+
      fld('Cover No','<input class="control mono" id="rpCover" readonly value="'+esc(txn.rfha)+'">')+
      fld('Current Market Rate','<input class="control mono" id="rpRate" inputmode="decimal" placeholder="Enter rate" value="'+(rate?esc(rate.toFixed(4)):'')+'">')+
    '</div>'+
    '<div class="pf-row c2">'+
      fld('Outcome','<div class="chip" id="rpChip">\u2014</div>')+
      (cash ? fld('Cash Settlement','<input class="control mono calc" id="rpCash" readonly>') : '<div></div>')+
    '</div>';
  var rateEl = m.body.querySelector('#rpRate'), chip = m.body.querySelector('#rpChip'), cashEl = m.body.querySelector('#rpCash');

  function sync(){
    var r = parseNum(rateEl.value); if(isNaN(r)) r = 0;
    var d = decideExercise(txn, r);
    chip.textContent = d ? (d==='Exercise' ? 'Option Exercised' : 'Option Expires') : '\u2014';
    chip.className = 'chip' + (d==='Exercise' ? ' ok' : d==='Expire' ? ' warn' : '');
    if(cashEl) cashEl.value = (d==='Exercise') ? numStr(calcCashSettlement(txn, r)) : '';
  }
  rateEl.addEventListener('input', function(){ inlineMsg(m,''); sync(); });
  sync();

  m.addButton('Cancel','btn-secondary',m.close);
  m.addButton('Update','btn-primary',function(){
    var r = parseNum(rateEl.value);
    if(!r || isNaN(r) || r <= 0){ inlineMsg(m,'Please update the rate','error'); rateEl.focus(); return; }   /* TEXT-009 */
    var decision = decideExercise(txn, r);
    var inv = invoiceAmountFor(deal.id, txn.dealType);
    var hasInvoice = !!(inv && inv.fAmt);
    var cs = cash ? calcCashSettlement(txn, r) : 0;
    function go(){ m.close(); if(decision==='Exercise') runExercise(ctx, txn, r, cs); else runExpire(ctx, txn, r); }
    var warn = 'Invoice amount not saved for Spot creation.Do you want to continue ?';       /* TEXT-105 */
    if(decision==='Exercise'){
      if(deal.ss==='X' || txn.settlfl==='1') go();
      else if(txn.settlfl==='2'){ if(hasInvoice) go(); else confirmDialog({title:'Option Exercise', message:warn}, go); }
      else go();
    } else {
      if(deal.ss==='X' || hasInvoice) go();
      else confirmDialog({title:'Option Expiry', message:warn}, go);
    }
  }, 'btnRateUpdate');
  setTimeout(function(){ rateEl.focus(); rateEl.select(); }, 40);
}

/* EXERCISE: status 24, "Exercise Updated Successfully", then spot logic */
function runExercise(ctx, txn, rate, cs){
  var deal = getDeal(ctx.dealId);
  updateTxnStatus(txn.rfha, '24', cs ? {cashAmt:Math.abs(cs), cashCurr:(txn.curr1==='USD'||txn.curr2==='USD')?'USD':txn.curr2} : null);
  showToast('Exercise Updated Sucessfully', 'success');                       /* TEXT-008 */
  afterChange();
  var fresh = getTxn(txn.rfha);
  if(fresh.settlfl === '1'){                                                    /* physical delivery -> spot */
    if(deal.ss==='X'){
      if(ctx.fromAction && fresh.dealType){ createAutoSpot(ctx, fresh, rate, '604'); }
      else { openSsSpotPopup({dealId:ctx.dealId, rfha:fresh.rfha, sfhaart:'604', rate:rate}); }
    } else { createAutoSpot(ctx, fresh, rate, '604'); }
  } else if(fresh.settlfl === '2'){                                             /* cash settlement */
    if(ctx.fromAction && fresh.dealType){
      confirmDialog({title:'Create Spot', message:'Do you want to create the Spot?'}, function(){      /* TEXT-005 */
        openSpotPopup({dealId:ctx.dealId, rfha:fresh.rfha, variant:'ndo', sfhaart:'604', rate:rate});
      });
    }
  }
}
/* EXPIRY: status 34, "Expire Updated Successfully", then spot logic */
function runExpire(ctx, txn, rate){
  updateTxnStatus(txn.rfha, '34');
  showToast('Expire Updated Successfully', 'success');                          /* TEXT-007 */
  afterChange();
  var fresh = getTxn(txn.rfha);
  if((fresh.settlfl==='1' || fresh.settlfl==='2') && fresh.dealType){
    confirmDialog({title:'Create Spot', message:'Do you want to create the Spot?'}, function(){
      openSpotPopup({dealId:ctx.dealId, rfha:fresh.rfha, variant:'ndo', sfhaart:'605', rate:rate});
    });
  }
}
/* Physical exercise: spot at the strike without a popup (CREATE_SPOT_NEW_MAIN) */
function createAutoSpot(ctx, txn, rate, sfhaart){
  var sp = buildNdoSpot(txn, {invoice:null, rate:txn.strike});
  var rfha = createSpotTransaction({
    dealId:ctx.dealId, dealType:txn.dealType, sourceRfha:txn.rfha, bukrs:sp.bukrs, sfhaart:sfhaart,
    bs1:sp.bs1, curr1:sp.curr1, amt1:sp.amt1, bs2:sp.bs2, curr2:sp.curr2, amt2:sp.amt2, rate:sp.rate, bp:txn.cpty,
    text:'Spot \u2013 option exercise'
  });
  showToast('Spot Transaction created Successfully: '+rfha, 'success');         /* TEXT-015 */
  afterChange();
}

function openSpotPopup(ctx){
  var txn = getTxn(ctx.rfha), deal = getDeal(ctx.dealId);
  var variant = ctx.variant || 'ndo';
  var sp;
  if(variant==='dndf'){
    /* PROCESS_DNDF_SPOT — cash currency against USD; sell/buy as the NDF cash amount is not negative */
    sp = { bukrs:txn.bukrs, curr1:txn.cashCurr||leadCurr(txn.curr1,txn.curr2).follow, bs1:'Sell', amt1:Math.abs(txn.cashAmt||0),
           curr2:'USD', bs2:'Buy', amt2:0, rate:txn.ndfRate||0, bp:txn.cpty, invText1:'', invText2:'', base:1 };
    recalcSpotAmounts(sp);
  } else {
    var inv = invoiceAmountFor(deal.id, txn.dealType);
    sp = buildNdoSpot(txn, {invoice:(inv && inv.fAmt) ? inv : null, rate:ctx.rate});
    if(variant==='ndf'){ sp.rate = 0; recalcSpotAmounts(sp); }   /* 9011: rate is entered by the user */
  }
  var showTrade = !txn.dealType;                                  /* group VIS hidden when a deal type exists */
  var m = openModal({title:'Create Spot', sub:'Transaction '+txn.rfha+' \u00b7 '+(variant==='ndo'?'Option settlement spot':variant==='ndf'?'NDF settlement spot':'DNDF settlement spot'), cls:'md-modal'});
  m.body.innerHTML = spotFormHtml(sp, showTrade);
  var co = coDropdown(m.body.querySelector('#spCo'), sp.bukrs);
  var bp = bpDropdown(m.body.querySelector('#spBp'), txn.grp, sp.bp);
  var trade = showTrade ? createDateField(m.body.querySelector('#spTrade'), {value:formatDMY(new Date())}) : null;
  function q(id){ return m.body.querySelector(id); }

  function paint(){
    q('#spC1').value = sp.curr1; q('#spB1').value = sp.bs1; q('#spA1').value = numStr(sp.amt1);
    q('#spC2').value = sp.curr2; q('#spB2').value = sp.bs2; q('#spA2').value = numStr(sp.amt2);
    q('#spN1').textContent = sp.invText1 ? '\u00b7 '+sp.invText1 : '';
    q('#spN2').textContent = sp.invText2 ? '\u00b7 '+sp.invText2 : '';

/* =========================================================
   KPI strip + breakdown analysis
   Calculations (computeKpis) are kept apart from rendering (renderKpis)
   so the same numbers can later come from an API.
   KPIs follow the deals currently listed (date range, filters and search).
   ========================================================= */
var KPI_AS_OF = '2026-10-01';      /* demo "today" so the seeded data stays meaningful; use todayIso() for live use */
var KPI_DUE_DAYS = 7;

function kpiDaysBetween(aIso, bIso){
  var a = new Date(aIso+'T00:00:00'), b = new Date(bIso+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function kpiToUsd(amt, curr){
  if(!amt) return 0;
  if(curr==='USD') return amt;
  var r = spotRateFor(curr,'USD');
  return r ? convertViaRate(amt, curr, 'USD', r) : 0;
}

function computeKpis(deals){
  var k = {
    deals:deals, count:deals.length, notionalUsd:0,
    byStatus:{}, byModel:{},
    due:[], overdue:[],
    pendingItems:[], doneItems:0, noAuth:[],
    perDealProgress:[],
    pl:[], plTotal:0, gains:0, losses:0
  };
  deals.forEach(function(d){
    k.notionalUsd += kpiToUsd(d.mcAmt, d.mcCurr);
    var st = dealStatusInfo(d.status).desc;
    k.byStatus[st] = (k.byStatus[st]||0) + 1;
    k.byModel[d.model] = (k.byModel[d.model]||0) + 1;

    var left = kpiDaysBetween(KPI_AS_OF, d.end);
    var open = d.status !== '40';
    if(open && left >= 0 && left <= KPI_DUE_DAYS) k.due.push({deal:d, days:left});
    if(open && left < 0) k.overdue.push({deal:d, days:-left});

    if(d.pl){
      var usd = kpiToUsd(d.pl, d.plCurr);
      k.pl.push({deal:d, usd:usd});
      k.plTotal += usd;
      if(usd >= 0) k.gains++; else k.losses++;
    }

    var txns = fetchTransactions(d.id);
    if(!isAuthorized(txns)){ k.noAuth.push(d); return; }
    var items = fetchActionItems(d, txns), p = 0, dn = 0;
    items.forEach(function(it){
      if(it.state==='pending'){ p++; k.pendingItems.push({deal:d, item:it}); }
      else if(it.state==='done'){ dn++; k.doneItems++; }
    });
    if(p+dn) k.perDealProgress.push({deal:d, pending:p, done:dn});
  });
  k.due.sort(function(a,b){ return a.days-b.days; });
  k.overdue.sort(function(a,b){ return b.days-a.days; });
  var tot = k.pendingItems.length + k.doneItems;
  k.progressPct = tot ? Math.round(k.doneItems/tot*100) : 0;
  k.totalItems = tot;
  return k;
}

function kpiCompact(n){
  var a = Math.abs(n), s = n<0 ? '-' : '';
  if(a>=1e9) return s+(a/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a>=1e6) return s+(a/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(a>=1e3) return s+(a/1e3).toFixed(1).replace(/\.?0+$/,'')+'K';
  return s+Math.round(a);
}

var kpiState = { data:null };

var KPI_DEFS = [
  {id:'deals', label:'Deals in Scope', tone:'',
   value:function(k){ return String(k.count); },
   desc:function(k){ return k.count ? '\u2248 USD '+kpiCompact(k.notionalUsd)+' notional' : 'No deals listed'; }},
  {id:'due', label:'Due in '+KPI_DUE_DAYS+' Days', tone:'warn',
   value:function(k){ return String(k.due.length); },
   desc:function(k){ return k.due.length ? 'Next: '+k.due[0].deal.id+' \u00b7 '+isoToDMY(k.due[0].deal.end) : 'Nothing due soon'; }},
  {id:'overdue', label:'Overdue', tone:'bad',
   value:function(k){ return String(k.overdue.length); },
   desc:function(k){ return k.overdue.length ? 'Oldest: '+k.overdue[0].days+' days late' : 'All on schedule'; }},
  {id:'pending', label:'Pending Actions', tone:'warn',
   value:function(k){ return String(k.pendingItems.length); },
   desc:function(k){
     var ids = {}; k.pendingItems.forEach(function(p){ ids[p.deal.id]=1; });
     var n = Object.keys(ids).length;
     return k.pendingItems.length ? 'across '+n+(n===1?' deal':' deals') : 'Nothing awaiting action';
   }},
  {id:'progress', label:'Settlement Progress', tone:'good',
   value:function(k){ return k.totalItems ? k.progressPct+'%' : '\u2013'; },
   desc:function(k){ return k.totalItems ? k.doneItems+' of '+k.totalItems+' actions done' : 'No action items'; }},
  {id:'pl', label:'Net P&L (USD)', tone:'',
   value:function(k){ return (k.plTotal>0?'+':'')+kpiCompact(k.plTotal); },
   valueCls:function(k){ return k.plTotal>0 ? 'kpi-pos' : k.plTotal<0 ? 'kpi-neg' : ''; },
   desc:function(k){ return k.pl.length ? k.gains+' gain \u00b7 '+k.losses+' loss' : 'No P&L booked'; }}
];

function initKpis(){
  var row = document.getElementById('kpiRow');
  row.innerHTML = '';
  KPI_DEFS.forEach(function(def){
    var c = document.createElement('div');
    c.className = 'kpi-card' + (def.tone ? ' tone-'+def.tone : '');
    c.id = 'kpi-'+def.id;
    c.tabIndex = 0;
    c.setAttribute('role','button');
    c.title = 'Double-click (or press Enter) for the breakdown';
    c.innerHTML = '<div class="kpi-label">'+esc(def.label)+'</div><div class="kpi-value"></div><div class="kpi-description"></div>';
    c.addEventListener('dblclick', function(){ openKpiDetail(def.id); });
    c.addEventListener('keydown', function(e){ if(e.key==='Enter'){ openKpiDetail(def.id); } });
    row.appendChild(c);
  });
}

function renderKpis(list){
  if(!document.getElementById('kpiRow')) return;
  var k = computeKpis(list || getFilteredSortedDeals());
  kpiState.data = k;
  KPI_DEFS.forEach(function(def){
    var c = document.getElementById('kpi-'+def.id);
    var v = c.querySelector('.kpi-value');
    v.textContent = def.value(k);
    v.className = 'kpi-value' + (def.valueCls && def.valueCls(k) ? ' '+def.valueCls(k) : '');
    c.querySelector('.kpi-description').textContent = def.desc(k);
  });
}

/* ---------- breakdown helpers ---------- */
function kpiBars(rows, opts){
  opts = opts || {};
  var max = 0; rows.forEach(function(r){ max = Math.max(max, Math.abs(r.value)); });
  if(!rows.length) return '<div class="kpi-empty">Nothing to show for the current filters.</div>';
  var h = '<div class="kpi-bars">';
  rows.forEach(function(r){
    var w = max ? Math.max(3, Math.round(Math.abs(r.value)/max*100)) : 0;
    h += '<div class="kpi-bar-row"><div class="kpi-bar-label" title="'+esc(r.label)+'">'+esc(r.label)+'</div>'+
         '<div class="kpi-bar-track"><div class="kpi-bar-fill '+(r.cls||'')+'" style="width:'+w+'%"></div></div>'+
         '<div class="kpi-bar-val '+(r.cls||'')+'">'+esc(r.text!==undefined ? r.text : String(r.value))+'</div></div>';
  });
  return h + '</div>';
}
function kpiTable(cols, rows){
  if(!rows.length) return '<div class="kpi-empty">Nothing to show for the current filters.</div>';
  var h = '<div class="grid-wrap"><table class="grid"><thead><tr>';
  cols.forEach(function(c){ h += '<th class="'+(c.num?'num':'')+'">'+esc(c.label)+'</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr data-deal="'+esc(r.dealId)+'" title="Double-click to open the deal">';
    cols.forEach(function(c){ h += '<td class="'+(c.num?'num mono ':'')+(c.cls||'')+'">'+(c.html ? r[c.key] : esc(r[c.key]))+'</td>'; });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function kpiSection(title, body){
  return '<div class="sub-section"><div class="sub-title"><span class="dot"></span>'+esc(title)+'</div>'+body+'</div>';
}
function kpiCountRows(obj){
  return Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a] || (a<b?-1:1); })
    .map(function(key){ return {label:key, value:obj[key], text:String(obj[key])}; });
}
function kpiStatusHtml(d){ var s=dealStatusInfo(d.status); return '<span class="status-text '+s.cls+'">'+esc(s.desc)+'</span>'; }

function openKpiDetail(id){
  var k = kpiState.data || computeKpis(getFilteredSortedDeals());
  var def = findIn(KPI_DEFS,'id',id);
  var body = '', sub = k.count+(k.count===1?' deal':' deals')+' in the current view \u00b7 as of '+isoToDMY(KPI_AS_OF);
  var cols = [], rows = [];

  if(id==='deals'){
    body += kpiSection('By deal status', kpiBars(kpiCountRows(k.byStatus)));
    body += kpiSection('By FX model', kpiBars(kpiCountRows(k.byModel).map(function(r){ r.label = r.label+' \u00b7 '+modelDesc(r.label); return r; })));
    var notional = {};
    k.deals.forEach(function(d){ var u=kpiToUsd(d.mcAmt,d.mcCurr); notional[d.id]=u; });
    body += kpiSection('Largest exposures (USD equivalent)', kpiBars(
      k.deals.slice().sort(function(a,b){ return notional[b.id]-notional[a.id]; }).slice(0,6)
        .map(function(d){ return {label:d.id, value:notional[d.id], text:formatAmount(notional[d.id],0)}; })));
  }
  else if(id==='due' || id==='overdue'){
    var src = id==='due' ? k.due : k.overdue;
    rows = src.map(function(x){ return {
      dealId:x.deal.id, id:x.deal.id, model:x.deal.model, status:kpiStatusHtml(x.deal), end:isoToDMY(x.deal.end),
      days: id==='due' ? (x.days===0 ? 'Today' : x.days+' d') : x.days+' d late'
    }; });
    cols = [{key:'id',label:'Deal ID',cls:'mono strong'},{key:'model',label:'Model'},{key:'status',label:'Status',html:true},
            {key:'end',label:'Settlement Date',cls:'mono'},{key:'days',label:id==='due'?'Due In':'Overdue By',num:true}];
    body += kpiSection(id==='due' ? 'Deals settling within '+KPI_DUE_DAYS+' days' : 'Open deals past their settlement date', kpiTable(cols, rows));
    if(id==='due'){
      var wk = {};
      src.forEach(function(x){ var lbl = x.days===0?'Today':(x.days<=3?'1\u20133 days':'4\u2013'+KPI_DUE_DAYS+' days'); wk[lbl]=(wk[lbl]||0)+1; });
      body += kpiSection('Urgency', kpiBars(kpiCountRows(wk)));
    }
  }
  else if(id==='pending'){
    var byAct = {};
    k.pendingItems.forEach(function(p){ byAct[p.item.text] = (byAct[p.item.text]||0)+1; });
    body += kpiSection('By action type', kpiBars(kpiCountRows(byAct)));
    rows = k.pendingItems.map(function(p){ return {
      dealId:p.deal.id, id:p.deal.id, txn:p.item.rfha, type:LOOKUPS.txnTypes[p.item.sfhaart]||p.item.sfhaart, action:p.item.text, due:isoToDMY(p.item.eDate||p.item.valueDate)
    }; });
    cols = [{key:'id',label:'Deal ID',cls:'mono strong'},{key:'txn',label:'Transaction',cls:'mono'},{key:'type',label:'Type'},{key:'action',label:'Action Required'},{key:'due',label:'Date',cls:'mono'}];
    body += kpiSection('Pending items', kpiTable(cols, rows));
    if(k.noAuth.length) body += '<div class="kpi-note">'+k.noAuth.length+' deal(s) excluded: no authorization for the company code ('+esc(k.noAuth.map(function(d){return d.id;}).join(', '))+').</div>';
  }
  else if(id==='progress'){
    body += kpiSection('Completion by deal', kpiBars(k.perDealProgress.map(function(p){
      var pct = Math.round(p.done/(p.done+p.pending)*100);
      return {label:p.deal.id, value:pct, text:p.done+'/'+(p.done+p.pending)+' \u00b7 '+pct+'%', cls:pct===100?'pos':(pct===0?'neg':'')};
    })));
    if(k.noAuth.length) body += '<div class="kpi-note">'+k.noAuth.length+' deal(s) excluded: no authorization for the company code ('+esc(k.noAuth.map(function(d){return d.id;}).join(', '))+').</div>';
  }
  else if(id==='pl'){
    body += kpiSection('P&L by deal (USD)', kpiBars(k.pl.slice().sort(function(a,b){ return b.usd-a.usd; }).map(function(p){
      return {label:p.deal.id, value:p.usd, text:(p.usd>0?'+':'')+formatAmount(p.usd), cls:p.usd>=0?'pos':'neg'};
    })));
    var byModel = {};
    k.pl.forEach(function(p){ byModel[p.deal.model] = (byModel[p.deal.model]||0)+p.usd; });
    body += kpiSection('P&L by FX model (USD)', kpiBars(Object.keys(byModel).sort().map(function(m){
      return {label:m, value:byModel[m], text:(byModel[m]>0?'+':'')+formatAmount(byModel[m]), cls:byModel[m]>=0?'pos':'neg'};
    })));
  }

  var m = openModal({title:def.label, sub:sub, cls:'lg-modal'});
  m.body.innerHTML = body;
  m.addButton('Close','btn-secondary',function(){ m.close(); });
  Array.prototype.forEach.call(m.body.querySelectorAll('tr[data-deal]'), function(tr){
    tr.addEventListener('dblclick', function(){
      var did = tr.getAttribute('data-deal');
      m.close(); state.selectedDealId = did; renderDeals(); openDealModal(did);
    });
  });
}


/* =========================================================
   Initialisation
   ========================================================= */
resetAppData();
initMainScreen();

})();
</script>
</body>
