<style>
  *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;font-size:12px;color:#1D2D3E;background:#F4F8FC;overflow:hidden}
  button,input,select{font:inherit;color:inherit} button{cursor:pointer}
  .app{height:100vh;display:flex;flex-direction:column;min-width:980px}
  .topbar{height:58px;background:#fff;border-bottom:1px solid #D9E4EE;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px}.back{height:34px;border:1px solid #C9D7E4;border-radius:9px;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;white-space:nowrap}.back:hover{background:#F4F8FC;border-color:#9CB4C9}.back svg{width:16px;height:16px;flex:0 0 auto}.logo-box{display:flex;align-items:center;justify-content:center;height:34px}.logo-box img{display:block;height:34px;width:auto;object-fit:contain}
  .title-wrap h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}.title-wrap p{margin:2px 0 0;color:#687A8B;font-size:11px}
  .header-actions{display:flex;gap:8px;align-items:center}.btn{height:34px;border:1px solid #B8C9D8;border-radius:9px;background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}.btn:hover:not(:disabled){background:#F2F7FC;border-color:#8EABC2}.btn.primary{background:#1F6FEB;color:#fff;border-color:#1F6FEB}.btn.primary:hover:not(:disabled){background:#195EC9}.btn:disabled{opacity:.42;cursor:not-allowed}.btn.ghost{border-color:transparent;background:transparent}.btn.warn{color:#B85C00}.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
  .content{flex:1;min-height:0;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
  .card{background:#fff;border:1px solid #D7E2EC;border-radius:14px;box-shadow:0 3px 12px rgba(30,61,86,.06)}
  .toolbar-card{padding:10px 12px;flex:0 0 auto}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section-head h2{font-size:13px;margin:0;font-weight:700}.count{color:#6B7E90;font-size:11px}
  .toolbar{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:10px;font-weight:700;color:#5D7083;letter-spacing:.15px}.field input,.field select{height:34px;border:1px solid #C6D5E2;border-radius:8px;background:#fff;padding:0 9px;outline:none;min-width:116px}.field input:focus,.field select:focus{border-color:#1F6FEB;box-shadow:0 0 0 2px rgba(31,111,235,.1)}
  .search{position:relative;width:230px}.search input{width:100%;padding-left:31px}.search svg{position:absolute;left:10px;bottom:9px;width:15px;height:15px;stroke:#6C7F91;fill:none;stroke-width:2}.w-90 select{min-width:90px}.w-105 input,.w-105 select{min-width:105px;width:105px}.w-125 select,.w-125 input{min-width:125px}.w-150 select{min-width:150px}.w-180 select{min-width:180px}.basis{display:flex;height:34px;border:1px solid #C6D5E2;border-radius:8px;overflow:hidden}.basis button{border:0;border-right:1px solid #D6E1EA;background:#fff;padding:0 9px;font-weight:600;color:#627588}.basis button:last-child{border-right:0}.basis button.active{background:#EAF2FF;color:#1F6FEB}
  .split{height:24px;width:1px;background:#D7E2EC;margin:0 1px 5px}.more-wrap{position:relative}.menu{position:absolute;right:0;top:40px;background:#fff;border:1px solid #CEDBE6;border-radius:10px;box-shadow:0 10px 30px rgba(29,45,62,.15);width:220px;padding:6px;z-index:30;display:none}.menu.open{display:block}.menu button{width:100%;height:34px;border:0;background:transparent;border-radius:7px;text-align:left;padding:0 9px;display:flex;align-items:center;gap:8px}.menu button:hover{background:#F2F7FC}.menu .divider{height:1px;background:#E3EBF2;margin:5px 4px}.menu small{display:block;color:#7B8B9A;font-size:9px;padding:4px 9px 2px;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
  .advanced{margin-top:8px;padding-top:8px;border-top:1px solid #ECF1F5;display:none;align-items:flex-end;gap:8px;flex-wrap:wrap}.advanced.open{display:flex}.toggle-link{border:0;background:transparent;color:#1F6FEB;font-weight:700;padding:0 2px 8px}
  .table-card{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.table-top{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #E1E9F0;flex:0 0 auto}.range-title{font-weight:700}.range-title span{color:#65798C;font-weight:500;margin-left:6px}.table-actions{display:flex;gap:6px}.icon-btn{width:30px;height:30px;border:1px solid #D0DCE6;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}.icon-btn:hover{background:#F3F7FB}.icon-btn svg{width:14px;height:14px;fill:none;stroke:#526A7E;stroke-width:1.8}
  .grid-wrap{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#C2D0DC transparent}.grid-wrap::-webkit-scrollbar{height:8px;width:8px}.grid-wrap::-webkit-scrollbar-thumb{background:#C2D0DC;border-radius:8px}.grid-wrap::-webkit-scrollbar-track{background:transparent}
  table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px}thead th{position:sticky;top:0;background:#EDF3F8;color:#43596C;border-bottom:1px solid #CBD8E3;padding:8px 9px;text-align:left;font-weight:700;white-space:nowrap;z-index:5;cursor:pointer}thead th:first-child{left:0;z-index:8}tbody td{padding:7px 9px;border-bottom:1px solid #E7EEF4;white-space:nowrap;background:#fff}tbody tr:nth-child(even) td{background:#FAFCFE}tbody tr:hover td{background:#F1F7FD}tbody tr.selected td{background:#E6F0FF!important}.checkcell{position:sticky;left:0;z-index:4;text-align:center;width:34px}.checkcell input{width:14px;height:14px;accent-color:#1F6FEB}.mono{font-variant-numeric:tabular-nums}.amt{text-align:right;font-variant-numeric:tabular-nums}.deal{color:#1F6FEB;font-weight:700;cursor:pointer}.status{font-weight:700}.s-red{color:#C73E35}.s-orange{color:#C46D00}.s-green{color:#16823B}.s-blue{color:#1F6FEB}.s-grey{color:#5E7182}.source-int{border-left:3px solid #F1A14A}.source-ext{border-left:3px solid #A8B5C2}.empty{padding:30px!important;text-align:center;color:#728497}
  .footer{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid #E1E9F0;flex:0 0 auto}.pages{display:flex;align-items:center;gap:4px}.page{min-width:28px;height:28px;border:1px solid #D0DCE6;background:#fff;border-radius:7px}.page.active{background:#1F6FEB;color:#fff;border-color:#1F6FEB}.page:disabled{opacity:.4}.rows{display:flex;align-items:center;gap:7px;color:#687B8E}.rows select{height:29px;border:1px solid #CAD7E2;border-radius:7px;background:#fff}
  .overlay{position:fixed;inset:0;background:rgba(17,36,52,.34);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}.overlay.open{display:flex}.modal{width:min(820px,92vw);max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 22px 60px rgba(19,42,60,.24);display:flex;flex-direction:column;overflow:hidden}.modal-head{height:55px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E2EAF1}.modal-head h3{margin:0;font-size:15px}.close{width:30px;height:30px;border:0;background:#F2F6F9;border-radius:8px;font-size:18px}.modal-body{padding:14px 16px;overflow:auto}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.summary .box{border:1px solid #DDE7EF;border-radius:10px;padding:9px}.summary .k{font-size:9px;text-transform:uppercase;color:#728496;font-weight:700;margin-bottom:4px}.summary .v{font-size:12px;font-weight:700}.detail-section{border-top:1px solid #E6EDF3;padding-top:12px;margin-top:8px}.detail-section h4{margin:0 0 9px;font-size:12px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}.drow .k{color:#718395;font-size:10px;margin-bottom:3px}.drow .v{font-weight:600;word-break:break-word}.modal-foot{height:54px;border-top:1px solid #E2EAF1;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .toast{position:fixed;right:18px;bottom:18px;background:#1D2D3E;color:#fff;padding:10px 13px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:120;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateY(0)}
  .columns-pop{position:absolute;right:12px;top:40px;background:#fff;border:1px solid #D0DCE6;border-radius:10px;box-shadow:0 10px 26px rgba(26,50,70,.16);z-index:25;width:220px;padding:8px;display:none;max-height:320px;overflow:auto}.columns-pop.open{display:block}.columns-pop label{display:flex;align-items:center;gap:7px;padding:5px 4px}.table-top{position:relative}
  @media(max-width:1250px){.field.optional-hide{display:none}.search{width:190px}.summary{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}}

    s+='<div class="detail-section"><h4>Organization & Counterparty</h4><div class="detail-grid">'+d('Business Area',r.businessArea+' - '+r.businessAreaName)+d('Profit Center',r.profitCenter+' - '+r.profitName)+d('Business Partner',(r.partner||'—')+(r.partnerName?' - '+r.partnerName:''))+d('Trader',r.trader||'—')+d('Trader Group',r.traderGroup||'—')+d('BU Requestor',r.requestor||'—')+d('Trade Category',r.tradeCategory||'—')+d('Bank Reference',r.bankRef||'—')+d('NDF Reference',r.ndfRef||'—')+'</div></div>';
    document.getElementById('modalBody').innerHTML=s;document.getElementById('overlay').className='overlay open'}
  function d(k,v){return'<div class="drow"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
  window.closeModal=function(){document.getElementById('overlay').className='overlay'};window.overlayClose=function(e){if(e.target.id==='overlay')closeModal()}
  window.changePageSize=function(){pageSize=+document.getElementById('pageSize').value;page=1;render()}
  window.toggleAdvanced=function(){var a=document.getElementById('advanced');a.className=a.className.indexOf('open')>=0?'advanced':'advanced open';document.getElementById('advBtn').textContent=a.className.indexOf('open')>=0?'Fewer filters':'More filters'}
  window.toggleMenu=function(e){e.stopPropagation();var m=document.getElementById('moreMenu');m.className=m.className.indexOf('open')>=0?'menu':'menu open'};document.onclick=function(){document.getElementById('moreMenu').className='menu';document.getElementById('columnsPop').className='columns-pop'}
  window.resetFilters=function(){document.getElementById('search').value='';document.getElementById('company').value='SG03';document.getElementById('fromDate').value='01-01-2012';document.getElementById('toDate').value='01-01-2030';document.getElementById('listType').value='';document.getElementById('status').value='';document.getElementById('trader').value='';document.getElementById('traderGroup').value='';document.getElementById('businessArea').value='';document.getElementById('profitCenter').value='';document.getElementById('partner').value='';document.getElementById('dealNo').value='';document.getElementById('txnType').value='';document.getElementById('currencyPair').value='';basis='blotter';var bs=document.querySelectorAll('.basis button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-basis')==='blotter'?'active':'';sortKey='';sortDir=1;page=1;selected=null;applyFilters()}
  window.refreshData=function(){resetFilters();showToast('Deal Dump restored to initial demo state')}
  window.exportCSV=function(){var keys=[];for(var i=0;i<columns.length;i++)if(visible[columns[i][0]])keys.push(columns[i]);var rows=[keys.map(function(c){return'"'+c[1].replace(/"/g,'""')+'"'}).join(',')];for(var j=0;j<filtered.length;j++){rows.push(keys.map(function(c){return'"'+String(filtered[j][c[0]]===undefined?'':filtered[j][c[0]]).replace(/"/g,'""')+'"'}).join(','))}var blob=new Blob([rows.join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deal_dump.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('CSV downloaded')}
  window.toggleColumns=function(e){if(e)e.stopPropagation();var p=document.getElementById('columnsPop');if(!p.innerHTML){for(var i=0;i<columns.length;i++){(function(c){var l=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=visible[c[0]];cb.onchange=function(){visible[c[0]]=cb.checked;render()};l.appendChild(cb);l.appendChild(document.createTextNode(c[1]));p.appendChild(l)})(columns[i])}}p.className=p.className.indexOf('open')>=0?'columns-pop':'columns-pop open'}
  window.showToast=function(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.className='toast'},2200)}
  applyFilters();
})();
