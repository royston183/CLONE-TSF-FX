  function cloneRows(source){
    var out=[],i;
    for(i=0;i<source.length;i++){out.push(deriveRow(copyObject(source[i])));}
    return out;

  function copyObject(o){var n={},k;for(k in o){if(o.hasOwnProperty(k)){n[k]=o[k];}}return n;}

  function deriveRow(r){
    /* ABAP India logic: choose the USD leg, multiply by contract/valuation INR rates, then sign the gain/loss by USD buy/sell direction. */
    r.fAmt = Math.abs(r.curr1==='USD' ? r.amt1 : r.amt2);
    r.fCurr = 'USD';
    r.ccAmt = r.fAmt*r.cRate;
    r.vRate = r.vSpot+r.vSwap;
    r.vAmt = r.fAmt*r.vRate;
    var rawGl=Math.abs(r.vAmt-r.ccAmt);
    if(r.buySell==='Buy'){
      r.vGl = r.cRate>=r.vRate ? rawGl*-1 : rawGl;
    }else{
      r.vGl = r.cRate>=r.vRate ? rawGl : rawGl*-1;
    }
    r.invStat = r.ztsfDealId ? (r.t1Amt>0?'Yes':'No') : '';
    r.valMer = (r.ztsfDealId && !r.t1Amt) ? r.vSpot : null;
    r.uinvAmt=0;r.uinvPer=0;
    if(r.pc==='C'){
      r.vGl=null;
    }else if(r.pc==='P'){
      var usdLegAmt=r.fAmt;
      r.uinvAmt=usdLegAmt-Math.abs(r.t1Amt);
      r.uinvPer=usdLegAmt?(Math.abs(r.uinvAmt)/usdLegAmt)*100:0;
      r.vGl=r.vGl*(r.uinvPer/100);
    }
    r.totGl=r.vGl;
    r.month=monthYear(r.valueDate);
    r.monat=expiryMonthBucket(r.valueDate,INITIAL_KEY_DATE);
    return r;
  }

  function safeDiv(a,b){return b? a/b:0;}
  function monthYear(iso){var p=iso.split('-'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[parseInt(p[1],10)-1]+' '+p[0];}
  function expiryMonthBucket(valueDate,keyDate){var v=parseIso(valueDate),k=parseIso(keyDate);if(!v||!k){return 0;}return Math.max(1,(v.getFullYear()-k.getFullYear())*12+(v.getMonth()-k.getMonth()));}

  function formatNumber(v,dec){
    if(v===null||v===undefined||v===''){return '';}
    var n=Number(v);if(isNaN(n)){return String(v);}
    var neg=n<0;n=Math.abs(n);var s=n.toFixed(dec);var parts=s.split('.');var x=parts[0];var out='';var i,c=0;
    for(i=x.length-1;i>=0;i--){out=x.charAt(i)+out;c++;if(c===3&&i!==0){out=','+out;c=0;}}
    return (neg?'-':'')+out+(dec?'.'+parts[1]:'');
  }

  function formatDate(iso){if(!iso){return '';}var p=iso.split('-');return p[2]+'-'+p[1]+'-'+p[0];}
  function parseDisplayDate(s){if(!/^\d{2}-\d{2}-\d{4}$/.test(s)){return null;}var p=s.split('-');var d=new Date(parseInt(p[2],10),parseInt(p[1],10)-1,parseInt(p[0],10));if(d.getFullYear()!=parseInt(p[2],10)||d.getMonth()!=parseInt(p[1],10)-1||d.getDate()!=parseInt(p[0],10)){return null;}return d;}
  function parseIso(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){return null;}var p=s.split('-');return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));}
  function toIso(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate());}
  function toDisplay(d){return two(d.getDate())+'-'+two(d.getMonth()+1)+'-'+d.getFullYear();}
  function two(n){return n<10?'0'+n:String(n);}
  function isMonthEnd(d){var next=new Date(d.getFullYear(),d.getMonth()+1,1);var last=new Date(next.getTime()-86400000);return d.getDate()===last.getDate();}

  function getFiltered(){

    var out=[],i,r,hay;
    for(i=0;i<rows.length;i++){
      r=rows[i];

      if(tx!=='ALL'&&r.rfha!==tx){continue;}

      if(deal==='WITH'&&!r.ztsfDealId){continue;}

      if(!(r.tradeDate<=toIso(kd)&&r.valueDate>toIso(kd))){continue;}
      if(q){hay=rowSearchText(r);if(hay.indexOf(q)===-1){continue;}}

    return out;
  }

  function detail(k,v){return '<div class="detail"><div class="k">'+escapeHtml(k)+'</div><div class="v" title="'+escapeHtml(v)+'">'+escapeHtml(v)+'</div></div>';}

  function openMessageLog(logs){
    var html='<table class="mini-table"><thead><tr><th>Status</th><th>Transaction</th><th>Document</th><th>Type</th><th class="num">Difference</th><th class="num">Contract Rate</th><th>Message</th></tr></thead><tbody>',i,l;
    for(i=0;i<logs.length;i++){l=logs[i];html+='<tr><td class="center"><span class="'+(l.ok?'ok-icon':'err-icon')+'">'+(l.ok?'✓':'!')+'</span></td><td>'+escapeHtml(l.rfha)+'</td><td>'+escapeHtml(l.doc)+'</td><td>'+escapeHtml(l.kind)+'</td><td class="num">'+escapeHtml(formatNumber(l.diff,2))+'</td><td class="num">'+escapeHtml(formatNumber(l.rate,4))+'</td><td>'+escapeHtml(l.message)+'</td></tr>';}
    html+='</tbody></table>';openModal('Message Log',html,'wide');
  }
  function openModal(title,body,size){document.getElementById('modalTitle').innerHTML=escapeHtml(title);document.getElementById('modalBody').innerHTML=body;var box=document.getElementById('modalBox');box.className='modal'+(size==='small'?' small':size==='wide'?' wide':'');document.getElementById('modalBackdrop').style.display='flex';}
  function closeModal(){document.getElementById('modalBackdrop').style.display='none';}

  function showToast(text,type){var t=document.getElementById('toast');document.getElementById('toastText').innerHTML=escapeHtml(text);document.getElementById('toastMark').innerHTML=type==='success'?'✓':'i';t.className='toast '+(type||'info');t.style.display='flex';if(toastTimer){clearTimeout(toastTimer);}toastTimer=setTimeout(function(){t.style.display='none';},2600);}

  function exportCsv(){
    var data=getFiltered(),out=[],headers=[],i,j,c,v;
    for(i=1;i<columns.length;i++){headers.push(csv(columns[i].label));}out.push(headers.join(','));
    for(i=0;i<data.length;i++){var row=[];for(j=1;j<columns.length;j++){c=columns[j];v=data[i][c.field];if(c.type==='date'){v=formatDate(v);}else if(c.type==='amount'){v=v===null?'':formatNumber(v,2);}else if(c.type==='rate'){v=formatNumber(v,4);}else if(c.type==='percent'){v=formatNumber(v,2)+'%';}row.push(csv(v===null?'':v));}out.push(row.join(','));}
    var blob=new Blob([out.join('\r\n')],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Reverse_FX_MTM_India.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},0);
  }
  function csv(v){v=String(v);return '"'+v.replace(/"/g,'""')+'"';}

  function validateAndApplyDate(){var input=document.getElementById('keyDateInput'),d=parseDisplayDate(input.value),err=document.getElementById('dateError');if(!d||!isMonthEnd(d)){input.style.borderColor='#D64545';err.style.display='block';render();return false;}input.style.borderColor='#B8C6D3';err.style.display='none';for(var i=0;i<rows.length;i++){rows[i].monat=expiryMonthBucket(rows[i].valueDate,toIso(d));}currentPage=1;render();return true;}
  function dateKeyDown(e){e=e||window.event;if(e.keyCode===13){validateAndApplyDate();closeCalendar();}}

  function buildCalendarSelectors(){var m=document.getElementById('calMonth'),y=document.getElementById('calYear'),names=['January','February','March','April','May','June','July','August','September','October','November','December'],i,o;for(i=0;i<12;i++){o=document.createElement('option');o.value=i;o.text=names[i];m.appendChild(o);}for(i=2020;i<=2035;i++){o=document.createElement('option');o.value=i;o.text=i;y.appendChild(o);}}
  function toggleCalendar(e){if(e&&e.stopPropagation){e.stopPropagation();}var pop=document.getElementById('calendarPop');if(pop.style.display==='block'){closeCalendar();return;}var d=parseDisplayDate(document.getElementById('keyDateInput').value)||new Date();calendarYear=d.getFullYear();calendarMonth=d.getMonth();renderCalendar();var rect=document.getElementById('dateField').getBoundingClientRect();pop.style.left=Math.max(8,Math.min(window.innerWidth-286,rect.left))+'px';pop.style.top=(rect.bottom+4)+'px';pop.style.display='block';pop.setAttribute('aria-hidden','false');}
  function closeCalendar(){var p=document.getElementById('calendarPop');p.style.display='none';p.setAttribute('aria-hidden','true');}
  function shiftCalendar(delta){calendarMonth+=delta;if(calendarMonth<0){calendarMonth=11;calendarYear--;}if(calendarMonth>11){calendarMonth=0;calendarYear++;}renderCalendar();}
  function calendarSelectChanged(){calendarMonth=parseInt(document.getElementById('calMonth').value,10);calendarYear=parseInt(document.getElementById('calYear').value,10);renderCalendar();}
  function renderCalendar(){document.getElementById('calMonth').value=calendarMonth;document.getElementById('calYear').value=calendarYear;var grid=document.getElementById('calendarGrid');grid.innerHTML='';var dows=['Su','Mo','Tu','We','Th','Fr','Sa'],i,el;for(i=0;i<7;i++){el=document.createElement('div');el.className='cal-dow';el.innerHTML=dows[i];grid.appendChild(el);}var first=new Date(calendarYear,calendarMonth,1),start=first.getDay(),days=new Date(calendarYear,calendarMonth+1,0).getDate(),prevDays=new Date(calendarYear,calendarMonth,0).getDate(),selected=parseDisplayDate(document.getElementById('keyDateInput').value),today=new Date(),cell,dateNum,cellDate,cls;for(cell=0;cell<42;cell++){if(cell<start){dateNum=prevDays-start+cell+1;cellDate=new Date(calendarYear,calendarMonth-1,dateNum);cls=' out';}else if(cell>=start+days){dateNum=cell-start-days+1;cellDate=new Date(calendarYear,calendarMonth+1,dateNum);cls=' out';}else{dateNum=cell-start+1;cellDate=new Date(calendarYear,calendarMonth,dateNum);cls='';}if(cellDate.getDay()===0||cellDate.getDay()===6){cls+=' weekend';}if(today.getFullYear()===cellDate.getFullYear()&&today.getMonth()===cellDate.getMonth()&&today.getDate()===cellDate.getDate()){cls+=' today';}if(selected&&selected.getFullYear()===cellDate.getFullYear()&&selected.getMonth()===cellDate.getMonth()&&selected.getDate()===cellDate.getDate()){cls+=' selected';}el=document.createElement('button');el.type='button';el.className='cal-day'+cls;el.innerHTML=dateNum;el.onclick=(function(dt){return function(e){if(e.stopPropagation){e.stopPropagation();}document.getElementById('keyDateInput').value=toDisplay(dt);closeCalendar();validateAndApplyDate();};})(cellDate);grid.appendChild(el);}}

  function bindGlobalEvents(){document.addEventListener('click',function(e){var pop=document.getElementById('calendarPop');if(pop.style.display==='block'){var node=e.target,inside=false;while(node){if(node===pop||node===document.getElementById('dateField')){inside=true;break;}node=node.parentNode;}if(!inside){closeCalendar();}}});document.getElementById('modalBackdrop').onclick=function(e){if(e.target===this){closeModal();}};bindDrop();}

  window.onFilterChange=onFilterChange;window.resetFilters=resetFilters;window.refreshAll=refreshAll;window.goBack=goBack;window.postSelected=postSelected;window.exportCsv=exportCsv;window.closeModal=closeModal;window.validateAndApplyDate=validateAndApplyDate;window.dateKeyDown=dateKeyDown;window.toggleCalendar=toggleCalendar;window.shiftCalendar=shiftCalendar;window.calendarSelectChanged=calendarSelectChanged;

  init();
})();
</script>
